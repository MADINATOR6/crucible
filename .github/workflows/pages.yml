# Publishes the lifting tracker (site root) and Social Studio (/social-studio/) to GitHub Pages: only the files each
# app runs from (no specs, scripts, tests or anything else in the repo). Runs both apps' tests first, so a failing
# build is never published. Both apps share the origin; each service worker cleans only its own caches.
name: Pages

on:
  push:
    branches: [main]
    paths: ['lifting-tracker/**', 'social-studio/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pinned, not ubuntu-latest: that label moved to Ubuntu 26.04, where the pinned Playwright (1.56.1) cannot
    # install its browsers, so the smoke test failed before it ran. Move both together: upgrade
    # @playwright/test to a release that supports the newer image, then change this line.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test
        working-directory: lifting-tracker
        run: node --test
      - name: Test Social Studio
        working-directory: social-studio
        run: node --test
      # Stub elements cannot show whether the real app still works: these drive it in a real browser.
      - name: Browser smoke test
        working-directory: lifting-tracker
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          npx playwright test
      - name: Keep the failing run's traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: lifting-tracker/test-results
          retention-days: 7
      - name: Collect the app's runtime files
        working-directory: lifting-tracker
        run: |
          mkdir -p ../_site/assets
          cp -r index.html manifest.webmanifest sw.js icons styles src data vendor ../_site/
          cp assets/body.glb assets/body-front.webp assets/body-back.webp ../_site/assets/
      - name: Collect Social Studio's runtime files
        working-directory: social-studio
        run: |
          mkdir -p ../_site/social-studio
          cp -r index.html styles.css manifest.webmanifest sw.js icon.svg icons src ../_site/social-studio/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
