<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll site</title>
<style>
  :root { color-scheme: dark; --fg: #f5f5f4; --bg: #0b0b0c; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  /* The track's height is the scroll distance the clip plays over. */
  #track { height: 500vh; position: relative; }
  #stage { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  .caption { position: absolute; left: 16px; right: 16px; bottom: 12vh; font-size: clamp(1.5rem, 6vw, 3.5rem);
    font-weight: 800; line-height: 1.05; opacity: 0; transform: translateY(12px); transition: opacity .3s, transform .3s; pointer-events: none; }
  .caption.on { opacity: 1; transform: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); transition: opacity .4s; }
  #loading.done { opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .caption { transition: none; } }
</style>
</head>
<body>
<div id="loading">Loading <span id="pct">0</span>%</div>
<div id="track">
  <div id="stage">
    <canvas id="c"></canvas>
    <!-- at = progress (0..1) at which the caption appears; it hides at the next caption's `at`. -->
    <div class="caption" data-at="0.00">Scroll to begin.</div>
    <div class="caption" data-at="0.33">Second beat.</div>
    <div class="caption" data-at="0.66">Third beat.</div>
  </div>
</div>
<script>
// Edit these two lines after running the ffmpeg step in SKILL.md.
const FRAMES = 75;                           // number of files in ./frames (see the memory budget in SKILL.md)
const src = i => `frames/f${String(i + 1).padStart(4, '0')}.webp`;

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const caps = [...document.querySelectorAll('.caption')];
const images = new Array(FRAMES);
let shown = -1;

function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap: 3x phones would quadruple fill cost
  canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
  shown = -1; draw();
}
function draw() {
  const p = scrollProgress(), i = Math.min(FRAMES - 1, Math.max(0, Math.round(p * (FRAMES - 1))));
  caps.forEach((el, k) => {
    const next = caps[k + 1] ? +caps[k + 1].dataset.at : 2;
    el.classList.toggle('on', p >= +el.dataset.at && p < next);
  });
  if (i === shown) return;
  let img = images[i];
  for (let d = 1; !img && d < FRAMES; d++) img = images[i - d] || images[i + d];   // a missing frame shows its nearest neighbour
  if (!img) return;
  shown = i;
  // object-fit: cover
  const s = Math.max(canvas.width / img.width, canvas.height / img.height);
  const w = img.width * s, h = img.height * s;
  ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
}
function scrollProgress() {
  const track = document.getElementById('track');
  const max = track.offsetHeight - window.innerHeight;
  return max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
}
addEventListener('scroll', draw, { passive: true });   // draw() returns early when the frame index is unchanged
new ResizeObserver(fit).observe(canvas);   // not window resize: also fires when the canvas goes from 0x0 to real size (hidden tab, mobile toolbar)

// Load every frame; first frame draws as soon as it arrives, page unlocks when all are in.
let loaded = 0;
const pct = document.getElementById('pct');
Promise.all(Array.from({ length: FRAMES }, (_, i) =>
  fetch(src(i)).then(r => r.blob()).then(createImageBitmap).then(b => { images[i] = b; pct.textContent = Math.round(++loaded / FRAMES * 100); if (i === 0) fit(); })
    .catch(() => { loaded++; })   // a missing frame holds the previous one rather than breaking the page
)).then(() => {
  if (!images.some(Boolean)) { document.getElementById('loading').textContent = 'Could not load the frames. Check frames/ and FRAMES.'; return; }
  document.getElementById('loading').classList.add('done'); fit();
});
</script>
</body>
</html>
