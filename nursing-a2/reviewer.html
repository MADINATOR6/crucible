xt": "Symptom onset 2 hours ago", "why": "This is within the 4.5-hour window, not a contraindication."}, {"text": "Age over 65", "why": "Age is not on the contraindication list."}, {"text": "An ischaemic stroke confirmed on CT", "why": "Thrombolysis is for ischaemic stroke. Haemorrhagic stroke is the contraindication."}], "explanation": "Contraindications: haemorrhagic stroke; large ischaemic area on imaging (over 1/3); active bleeding or recent trauma or surgery; coagulopathy (low platelets, high INR); anticoagulants within 48 hrs.", "cite": [{"src": "STROKE", "loc": "slide 25"}]}, {"id": "ST-04", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: localisation", "slo": ["SLO2"], "reasoning": true, "stem": "A patient has sudden right-sided arm weakness and difficulty finding words. Which hemisphere is most likely affected?", "options": [{"text": "Left hemisphere", "correct": true, "why": "The left hemisphere controls motor function on the right side of the body and handles speech, language and comprehension."}, {"text": "Right hemisphere", "why": "The right hemisphere controls the LEFT side of the body."}, {"text": "Cerebellum", "why": "The cerebellum handles balance, coordination and fine muscle control, not language."}, {"text": "Occipital lobe", "why": "The occipital lobe handles vision."}], "explanation": "Identifying the area of the brain affected lets you recognise symptoms and provide patient-centred care.", "cite": [{"src": "STROKE", "loc": "slides 3-4"}]}, {"id": "ST-05", "type": "mcq", "week": "Stroke lecture", "topic": "Neurological assessment", "slo": ["SLO1", "SLO2"], "reasoning": true, "stem": "A patient's GCS falls from 14 to 12 between observations. On the adult neurological observation chart shown in the lecture, what should you do?", "options": [{"text": "Initiate a Rapid Response", "correct": true, "why": "The chart says: if GCS drops by 2 or more points, initiate a Rapid Response."}, {"text": "Initiate a Clinical Review", "why": "A Clinical Review is for a 1-point drop. This is a 2-point drop."}, {"text": "Recheck in 4 hours", "why": "A 2-point drop meets the Rapid Response criterion now."}, {"text": "Document only; a GCS of 12 is acceptable", "why": "The trigger is the size of the drop, not the absolute score."}], "explanation": "Findings (GCS down 2) → interpretation (neurological deterioration) → action (Rapid Response).", "cite": [{"src": "STROKE", "loc": "slide 21"}]}, {"id": "ST-06", "type": "mcq", "week": "Stroke lecture", "topic": "Neurological assessment", "slo": ["SLO1"], "stem": "A patient opens their eyes to speech, is confused, and localises to pain. What is their GCS on the chart in the lecture?", "options": [{"text": "12 (E3 V4 M5)", "correct": true, "why": "Eyes to speech = 3, confused = 4, localises to pain = 5, total 12."}, {"text": "11 (E3 V4 M4)", "why": "Withdraws = 4, but localising to pain scores 5."}, {"text": "13 (E4 V4 M5)", "why": "Spontaneous eye opening scores 4. Eyes open to speech scores 3."}, {"text": "10 (E2 V3 M5)", "why": "Eyes to pain = 2 and inappropriate words = 3 do not match this patient."}], "explanation": "Rate by the HIGHEST response observed (the 'Rate' step on the GCS slide).", "cite": [{"src": "STROKE", "loc": "slide 21"}]}, {"id": "ST-07", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: diagnosis", "slo": ["SLO2"], "stem": "In the ACI stroke pathway in the lecture, what does the first imaging (non-contrast head CT) rule out?", "options": [{"text": "Intracerebral haemorrhage", "correct": true, "why": "The pathway says 'Noncontrast head CT rules out intracerebral haemorrhage'."}, {"text": "Pneumonia", "why": "The pathway uses non-contrast head CT to rule out intracerebral haemorrhage, not pneumonia."}, {"text": "Atrial fibrillation", "why": "The pathway uses non-contrast head CT to rule out intracerebral haemorrhage, not atrial fibrillation."}, {"text": "Hyperglycaemia", "why": "The pathway uses non-contrast head CT to rule out intracerebral haemorrhage, not hyperglycaemia."}], "explanation": "Haemorrhage must be excluded because haemorrhagic stroke is a contraindication to thrombolysis.", "cite": [{"src": "STROKE", "loc": "slides 20, 25, 26"}]}, {"id": "ST-08", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: nursing care", "slo": ["SLO1", "SLO2"], "reasoning": true, "stem": "According to the lecture, which factors must be controlled to prevent secondary brain injury after stroke?", "options": [{"text": "Hypertension, hyperglycaemia, infection and hypoxia", "correct": true, "why": "The medical management slide lists these four as the targets for preventing secondary brain injury."}, {"text": "Hypotension only", "why": "The slide lists four factors; nursing care also says avoid both hyper- and hypotension."}, {"text": "Pain and anxiety only", "why": "Not the factors listed for secondary brain injury."}, {"text": "Tachycardia and hypothermia", "why": "Not the factors listed on the slide."}], "explanation": "Nursing links: BP management (avoid hyper/hypotension), manage hyperglycaemia, manage fevers and infection, neurological monitoring.", "cite": [{"src": "STROKE", "loc": "slides 23, 28"}]}, {"id": "ST-09", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: nursing care", "slo": ["SLO1", "SLO2"], "reasoning": true, "stem": "A patient with new facial droop and slurred speech asks for a drink of water. Which nursing consideration from the lecture applies most directly?", "options": [{"text": "Dysphagia: swallow assessment", "correct": true, "why": "'Dysphagia (swallow assessment)' is on the lecture's list of nursing considerations, and facial and speech deficits suggest the face and mouth are affected."}, {"text": "DVT prophylaxis", "why": "DVT prophylaxis is on the list, but it does not answer whether the patient can safely drink."}, {"text": "Reduce the risk of falls", "why": "Falls prevention is on the list, but it is not the issue raised by a request to drink."}, {"text": "Manage delirium", "why": "Delirium management is on the list, but the question is about swallowing safely."}], "explanation": "The motor homunculus shows swallowing, tongue, jaw and lips next to the face, all in the MCA territory.", "cite": [{"src": "STROKE", "loc": "slides 8, 9, 28"}]}, {"id": "ST-10", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: types", "slo": ["SLO2"], "stem": "According to the lecture, what proportion of strokes are ischaemic?", "options": [{"text": "4 out of 5", "correct": true, "why": "'4 out of 5 strokes are ischaemic'; the haemorrhagic slide gives 1 out of 5."}, {"text": "1 out of 5", "why": "1 out of 5 is the haemorrhagic proportion."}, {"text": "1 out of 2", "why": "Not stated in the lecture."}, {"text": "85%", "why": "85% is the share of subarachnoid haemorrhages caused by a ruptured aneurysm."}], "explanation": "Ischaemic subtypes: embolic (a clot travels to the brain) and thrombotic (plaque formation). TIA = temporary blockage.", "cite": [{"src": "STROKE", "loc": "slides 10-12"}]}, {"id": "ST-11", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: types", "slo": ["SLO1", "SLO2"], "reasoning": true, "stem": "A patient's facial droop and arm weakness resolve completely and a transient ischaemic attack (TIA) is diagnosed. What risk does the lecture highlight?", "options": [{"text": "1 in 5 will have a major stroke within the next 3 months", "correct": true, "why": "The ischaemic stroke slide gives this statistic for TIA."}, {"text": "No further risk, because symptoms resolved", "why": "The lecture stresses a significant risk of major stroke after TIA."}, {"text": "85% will have a subarachnoid haemorrhage", "why": "85% is the proportion of SAH caused by ruptured aneurysm."}, {"text": "Functional independence in only 20%", "why": "That statistic is for haemorrhagic stroke."}], "explanation": "A TIA is a temporary blockage of the vessels supplying the brain. Take it seriously: early recognition and treatment are vital to stroke outcomes.", "cite": [{"src": "STROKE", "loc": "slides 9-12"}]}, {"id": "ST-12", "type": "saq", "week": "Stroke lecture", "topic": "Stroke: treatment", "slo": ["SLO1", "SLO2"], "reasoning": true, "prompt": "A patient has sudden left facial droop and left arm weakness that started 1 hour ago. Using the stroke lecture, outline the initial assessment, first imaging, the time-critical ischaemic stroke treatments (with time windows), and four nursing considerations.", "model": "Initial assessment: time of symptom onset, past medical history, medications; vital signs, GCS and NIHSS. First imaging: non-contrast CT to rule out intracerebral haemorrhage (then CTA/CT perfusion). If ischaemic: IV thrombolysis (tenecteplase or alteplase) as early as possible and up to 4.5 hours after onset, if there are no contraindications (for example haemorrhage, anticoagulants within 48 hrs, coagulopathy); endovascular clot retrieval up to 24 hours (ideally under 6 hours) for some patients. Nursing: neurological monitoring (NIHSS/GCS) and vital signs after thrombolysis; BP management avoiding hyper- and hypotension; dysphagia screening (swallow assessment); managing fever, infection and hyperglycaemia; falls, pressure-area care and positioning; engaging family.", "rubric": [{"point": "Symptom onset time, history, medications; vital signs, GCS + NIHSS", "cite": [{"src": "STROKE", "loc": "slide 20"}]}, {"point": "Non-contrast CT first to rule out haemorrhage", "cite": [{"src": "STROKE", "loc": "slides 20, 26"}]}, {"point": "Thrombolysis up to 4.5 h; ECR up to 24 h (ideally under 6 h)", "cite": [{"src": "STROKE", "loc": "slides 23-25"}]}, {"point": "At least one thrombolysis contraindication", "cite": [{"src": "STROKE", "loc": "slide 25"}]}, {"point": "Four nursing considerations (e.g. neuro obs, BP, swallow assessment, glucose/fever, falls)", "cite": [{"src": "STROKE", "loc": "slide 28"}]}], "cite": [{"src": "STROKE", "loc": "slides 20-28"}]}, {"id": "ST-13", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: types", "slo": ["SLO2"], "stem": "According to the lecture, what causes 85% of subarachnoid haemorrhages?", "options": [{"text": "A ruptured aneurysm", "correct": true, "why": "'85% are caused by a ruptured aneurysm'."}, {"text": "An embolus from the heart", "why": "Embolic clots cause ischaemic (embolic) stroke."}, {"text": "Plaque formation", "why": "Plaque formation describes thrombotic ischaemic stroke."}, {"text": "Trauma only", "why": "Trauma is listed as a cause of haemorrhagic stroke, but 85% of SAH is attributed to ruptured aneurysm."}], "explanation": "SAH needs vascular treatment because of the risk of re-rupture: surgical clipping or endovascular coiling/stenting.", "cite": [{"src": "STROKE", "loc": "slides 10-15"}]}, {"id": "ST-14", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: treatment", "slo": ["SLO2", "SLO4"], "stem": "Endovascular treatment of a cerebral aneurysm with stenting and coiling requires which medicine therapy, according to the lecture?", "options": [{"text": "Dual antiplatelet therapy (DAPT)", "correct": true, "why": "The endovascular slide says it 'requires administration of dual antiplatelet therapy (DAPT)'."}, {"text": "IV thrombolysis", "why": "Thrombolysis is for ischaemic stroke; haemorrhagic stroke is a contraindication."}, {"text": "Magnesium sulfate", "why": "The endovascular slide names dual antiplatelet therapy, not magnesium sulfate."}, {"text": "No medication is involved", "why": "The slide states DAPT is required."}], "explanation": "Surgical alternative: craniotomy and clipping, where the clip stays in situ permanently.", "cite": [{"src": "STROKE", "loc": "slides 14-15, 25"}]}, {"id": "ST-15", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: types", "slo": ["SLO1", "SLO2"], "stem": "Which is NOT listed in the lecture as a risk factor for cerebral aneurysm?", "options": [{"text": "Being under 20 years of age", "correct": true, "why": "The listed risk factors are smoking, hypertension, family history, age over 40, and being female (women > men)."}, {"text": "Smoking", "why": "Smoking is listed."}, {"text": "Hypertension", "why": "Hypertension is listed."}, {"text": "Family history", "why": "Family history is listed."}], "explanation": "Ruptured aneurysms cause subarachnoid haemorrhage and are a medical emergency.", "cite": [{"src": "STROKE", "loc": "slide 13"}]}, {"id": "ST-16", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: treatment", "slo": ["SLO2"], "stem": "In endovascular clot retrieval, how is the catheter introduced, according to the lecture?", "options": [{"text": "Via the femoral or radial artery", "correct": true, "why": "The catheter is 'fed into the blocked blood vessel (via femoral or radial artery)'."}, {"text": "Through a burr hole in the skull", "why": "ECR is endovascular, not a craniotomy."}, {"text": "Via a peripheral IV cannula in the hand", "why": "The slide specifies the femoral or radial artery."}, {"text": "Through the jugular vein", "why": "Not stated; the slide names arterial access."}], "explanation": "A wire stent or suction device captures the clot. ECR can be done up to 24 hours from onset (ideally under 6 hours) for some patients, often with thrombolysis.", "cite": [{"src": "STROKE", "loc": "slide 24"}]}, {"id": "ST-17", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: recognition", "slo": ["SLO1", "SLO2"], "stem": "Which age-related change does the lecture link to a reduced ability to recover from a brain insult?", "options": [{"text": "Reduction in new neuronal growth", "correct": true, "why": "The slide says 'Reduction in new neuronal growth - reduce the ability to recover from insult'."}, {"text": "Increased cerebral blood flow", "why": "The slide says cerebral blood flow DEcreases (more than 25% by the 80s)."}, {"text": "Improved baroreceptor function", "why": "The slide says baroreceptor function decreases."}, {"text": "Growth of new synapses", "why": "The slide describes a loss of synapses."}], "explanation": "Other changes: cerebral amyloidosis (70s), atherosclerosis, neuronal loss and shrinkage, decreased cerebral blood flow and metabolic rate.", "cite": [{"src": "STROKE", "loc": "slide 17"}]}]};

<script>
"use strict";
/* ---------- data & storage ---------- */
const C = CONTENT || {meta:{title:"Assessment 2 Reviewer",status:"No content built. Run tools/build_reviewer.py."},sources:{},slos:{},skills:[],questions:[],gaps:[],context:[]};
const KEY = "na2-reviewer-v1";
let mem = {};
function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : {}; }catch(e){ return mem; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){ mem = P; } }
const P = Object.assign({items:{}, skills:{}, mocks:[], theme:null, mockA:null, mockB:null, includeSupp:true}, load());

/* Items citing a "supp" source come from outside the 93225 Modules; they are badged and can be excluded. */
const isSuppCite = cites => (cites||[]).some(c => (C.sources[c.src]||{}).set === "supp");
const isSupp = q => isSuppCite(q.cite) || (q.rubric||[]).some(r => isSuppCite(r.cite));
const suppTag = `<span class="tag supp" title="From slides outside the 93225 Modules">Supplementary</span>`;
const QALL = C.questions || [];
let Q = [];
function applySupp(){ Q = QALL.filter(q => P.includeSupp || !isSupp(q)); }
applySupp();
const QBY = Object.fromEntries(QALL.map(q => [q.id, q]));
const SK = C.skills || [];
const SKBY = Object.fromEntries(SK.map(s => [s.id, s]));

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function uniq(a){ return [...new Set(a)].filter(v => v !== undefined && v !== null && v !== ""); }
function citeText(cites){
  return (cites||[]).map(c => { const s = C.sources[c.src] || {}; return esc((s.file || c.src) + (c.loc ? ", " + c.loc : "")); }).join("; ");
}
function citeHTML(cites){ return cites && cites.length ? `<div class="cite">${citeText(cites)}</div>` : ""; }
function pct(x){ return Math.round(x*100) + "%"; }
function record(id, score){
  const r = P.items[id] || {n:0, sum:0};
  r.n++; r.sum += score; r.last = score; r.ts = Date.now();
  P.items[id] = r; save();
}
function isWeak(id){ const r = P.items[id]; return !!r && r.last < 0.6; }
function fmt(ms){ ms = Math.max(0, ms); const s = Math.round(ms/1000); return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }
/* In-page confirmation: embedded viewers block confirm()/alert(), so ask next to the button instead. */
function askFirst(btn, question, onYes){
  const old = btn.parentNode.querySelector(".ask"); if(old) old.remove();
  const box = document.createElement("span");
  box.className = "ask row";
  box.innerHTML = `<b>${esc(question)}</b> <button class="primary">Yes</button> <button>No</button>`;
  const [yes, no] = box.querySelectorAll("button");
  yes.onclick = () => { box.remove(); onYes(); };
  no.onclick = () => box.remove();

/* ---------- Part A quiz ---------- */
let QZ = null; // {ids, i}
function opts(values, all){ return `<option value="">${all}</option>` + values.map(v => `<option>${esc(v)}</option>`).join(""); }
function renderQuizSetup(){
  const weeks = uniq(Q.map(q => q.week)), topics = uniq(Q.map(q => q.topic));

function filterQ(f){
  return Q.filter(q => (!f.type || q.type === f.type) && (!f.week || q.week === f.week) && (!f.topic || q.topic === f.topic)
    && (!f.slo || (q.slo||[]).includes(f.slo)) && (!f.skill || q.skill === f.skill) && (!f.weak || isWeak(q.id)) && (!f.reasoning || q.reasoning));
}
function startQuiz(f){
  let ids = f.ids || filterQ(f).map(q => q.id);
  if(f.shuffle !== false) ids = shuffle(ids);
  if(!ids.length){ const c = $("#fCount"); if(c) c.textContent = "No questions match these filters."; return; }
  tab = "quiz"; document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === "quiz"));
  QZ = {ids, i:0, done:{}}; renderQuestion();
}
function qHeader(q){
  return `<div class="row small muted"><span>${esc(q.id)}</span>${isSupp(q)?suppTag:""}${q.week?`<span class="tag">${esc(q.week)}</span>`:""}${q.topic?`<span class="tag">${esc(q.topic)}</span>`:""}${(q.slo||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join("")}${q.reasoning?`<span class="tag">clinical reasoning</span>`:""}</div>`;
}
function renderQuestion(){
  const q = QBY[QZ.ids[QZ.i]];
  const nav = `<div class="row noprint" style="margin-top:12px">
    <button id="qPrev" ${QZ.i?"":"disabled"}>Back</button>
    <span class="muted small">${QZ.i+1} / ${QZ.ids.length}</span>
    <button id="qNext" class="primary">${QZ.i+1 < QZ.ids.length ? "Next" : "Finish"}</button>
    <button id="qExit">Exit</button></div>`;
  let body;
  if(q.type === "mcq"){
    const order = QZ.done[q.id]?.order || shuffle(q.options.map((_,k)=>k));
    body = `<p class="big">${esc(q.stem)}</p><div id="opts">${order.map(k => `<button class="opt" data-k="${k}">${esc(q.options[k].text)}</button><div class="why hide" data-why="${k}"></div>`).join("")}</div><div id="fb"></div>`;
    $("#main").innerHTML = `<div class="card">${qHeader(q)}${body}</div>${nav}`;
    const reveal = (chosen) => {
      document.querySelectorAll("#opts .opt").forEach(b => {
        const k = +b.dataset.k, o = q.options[k]; b.disabled = true;
        if(o.correct) b.classList.add("good"); else if(k === chosen) b.classList.add("bad");
        const w = $(`[data-why="${k}"]`); w.classList.remove("hide"); w.classList.add(o.correct?"good":"bad");
        w.innerHTML = `<b>${o.correct?"Correct":"Incorrect"}:</b> ${esc(o.why)}`;
      });
      const ok = q.options[chosen].correct;
      $("#fb").innerHTML = `<p><b>${ok?"Right.":"Not quite."}</b> ${esc(q.explanation||"")}</p>${contextHTML(q)}${citeHTML(q.cite)}`;
    };
    if(QZ.done[q.id]) reveal(QZ.done[q.id].chosen);
    document.querySelectorAll("#opts .opt").forEach(b => b.onclick = () => {
      const k = +b.dataset.k; QZ.done[q.id] = {chosen:k, order}; record(q.id, q.options[k].correct ? 1 : 0); reveal(k);
    });
  } else {
    body = `<p class="big">${esc(q.prompt)}</p><textarea id="ans" placeholder="Type your answer, then check it against the model answer.">${esc(QZ.done[q.id]?.text||"")}</textarea>
      <div class="row" style="margin-top:8px"><button id="showModel" class="primary">Show model answer</button></div><div id="model"></div>`;
    $("#main").innerHTML = `<div class="card">${qHeader(q)}${body}</div>${nav}`;
    const show = () => {
      $("#model").innerHTML = saqReview(q, QZ.done[q.id]?.ticks);
      $("#saveMark").onclick = () => {
        const ticks = [...document.querySelectorAll("#model input[type=checkbox]")].map(c => c.checked);
        QZ.done[q.id] = Object.assign(QZ.done[q.id]||{}, {ticks, text:$("#ans").value});
        record(q.id, ticks.filter(Boolean).length / ticks.length);
        $("#saveMark").textContent = "Saved: " + ticks.filter(Boolean).length + " / " + ticks.length;
      };
    };
    $("#showModel").onclick = () => { QZ.done[q.id] = Object.assign(QZ.done[q.id]||{}, {text:$("#ans").value}); show(); };
    if(QZ.done[q.id]?.ticks) show();
  }
  $("#qPrev").onclick = () => { QZ.i--; renderQuestion(); };
  $("#qNext").onclick = () => { if(QZ.i+1 < QZ.ids.length){ QZ.i++; renderQuestion(); } else quizSummary(); };

}
function saqReview(q, ticks){

    <b>Marking points</b> <span class="muted small">(tick each point your answer covered)</span>
    ${q.rubric.map((r,k) => `<label style="display:block;margin:6px 0"><input type="checkbox" ${ticks&&ticks[k]?"checked":""}> ${esc(r.point)}${citeHTML(r.cite)}</label>`).join("")}

}
function contextHTML(q){
  return (q.context||[]).map(id => (C.context||[]).find(c => c.id === id)).filter(Boolean)
    .map(c => `<div class="ctx small"><b>${esc(c.label)}:</b> ${esc(c.text)}</div>`).join("");
}
function quizSummary(){
  const ids = QZ.ids, done = ids.filter(id => P.items[id]);

/* ---------- Part B skills ---------- */
let SKS = {id:null, mode:"list"};
function noSteps(s){ return `<div class="banner">No procedure steps for <b>${esc(s.name)}</b> are in the loaded modules yet, so there is nothing to drill. See the Sources &amp; gaps tab.</div>`; }
function renderSkills(){
  if(!SKS.id){
    $("#main").innerHTML = `${banner()}<div class="card"><h2 class="big" style="margin-top:0">Part B skills</h2>
      <p class="muted small">You will be allocated two of these four. Critical safety steps are marked in red where the lab material identifies them.</p>
      <div class="grid">${SK.map(s => `<button class="opt" data-s="${esc(s.id)}"><b>${esc(s.name)}</b><br><span class="small muted">${(s.steps||[]).length ? s.steps.length + " steps" : "steps not loaded"}</span></button>`).join("")}</div></div>`;

    return;
  }
  const s = SKBY[SKS.id], steps = s.steps || [];

  $("#main").innerHTML = `<div class="card noprint"><div class="row"><button id="skBack">All skills</button><b>${esc(s.name)}</b></div>
    <div class="row" style="margin-top:8px">${modes.map(([m,l]) => `<button data-m="${m}" aria-pressed="${SKS.mode===m}">${l}</button>`).join("")}</div></div><div id="skBody"></div>`;
  $("#skBack").onclick = () => { SKS = {id:null}; renderSkills(); };

  const body = $("#skBody");
  if(!steps.length){ body.innerHTML = noSteps(s) + skillNotes(s); return; }
  ({list:skillList, order:skillOrder, missing:skillMissing, verbal:skillVerbal}[SKS.mode])(s, body);

function skillNotes(s){
  const notes = (s.notes||[]).map(n => `<div class="card small">${isSuppCite(n.cite)?suppTag:""}${esc(n.text)}${citeHTML(n.cite)}</div>`).join("");
  return (notes ? `<h3 class="noprint" style="margin:14px 0 8px">What the loaded sources say</h3>${notes}` : "") + contextNote("CTX-GENERIC-STEPS");
}
function stepLi(st, k, extra=""){
  return `<li class="${st.critical?"crit":""} ${extra}"><span class="n">${k+1}.</span><span class="t">${st.critical?`<span class="critbadge">Critical</span><br>`:""}${isSuppCite(st.cite)?suppTag:""}${esc(st.text)}${citeHTML(st.cite)}</span></li>`;
}
function skillList(s, body){
  body.innerHTML = `<div class="card"><h2 class="big" style="margin-top:0">${esc(s.name)}: checklist</h2>${citeHTML(s.cite)}
    <ol class="steps">${s.steps.map((st,k) => stepLi(st,k)).join("")}</ol>
    <p class="muted small noprint">To print, use your browser's print command on the offline file; the page prints as a plain checklist.</p></div>${skillNotes(s)}`;
}
function skillOrder(s, body){
  let cur = shuffle(s.steps.map((_,k)=>k));
  if(s.steps.length > 1) while(cur.every((v,k)=>v===k)) cur = shuffle(cur);
  const draw = (checked) => {
    body.innerHTML = `<div class="card"><h2 class="big" style="margin-top:0">Put the steps in order</h2>
      <p class="muted small">Use the arrows to move steps. Then press Check.</p>
      <ol class="steps">${cur.map((k,pos) => {
        const cls = checked ? (k===pos?"good":"bad") : "";
        const hint = checked && k!==pos ? `<div class="small"><b>Belongs at #${k+1}</b></div>` : "";
        return `<li class="${cls}"><span class="n">${pos+1}.</span><span class="t">${esc(s.steps[k].text)}${hint}</span>
          <span class="noprint"><button data-up="${pos}" aria-label="Move up" ${pos?"":"disabled"}>↑</button> <button data-dn="${pos}" aria-label="Move down" ${pos<cur.length-1?"":"disabled"}>↓</button></span></li>`;
      }).join("")}</ol>
      <div class="row" style="margin-top:10px"><button class="primary" id="oCheck">Check</button><button id="oNew">Reshuffle</button><span id="oRes"></span></div></div>`;
    body.querySelectorAll("[data-up]").forEach(b => b.onclick = () => { const p=+b.dataset.up; [cur[p-1],cur[p]]=[cur[p],cur[p-1]]; draw(false); });
    body.querySelectorAll("[data-dn]").forEach(b => b.onclick = () => { const p=+b.dataset.dn; [cur[p+1],cur[p]]=[cur[p],cur[p+1]]; draw(false); });
    $("#oNew").onclick = () => skillOrder(s, body);
    $("#oCheck").onclick = () => {
      const right = cur.filter((k,pos)=>k===pos).length, score = right/cur.length;
      const r = P.skills[s.id] || {}; r.order = Math.max(r.order||0, score); P.skills[s.id] = r; save();
      draw(true); $("#oRes").textContent = `${right} / ${cur.length} in the right place`;
    };
  };
  draw(false);
}
function skillMissing(s, body){
  const gone = Math.floor(Math.random()*s.steps.length);
  body.innerHTML = `<div class="card"><h2 class="big" style="margin-top:0">One step is missing. Which one?</h2>
    <ol class="steps">${s.steps.map((st,k) => k===gone ? `<li id="gap" class="hide"><span class="n">?</span><span class="t"><i>missing step</i></span></li>` : `<li><span class="t">${esc(st.text)}</span></li>`).join("")}</ol>
    <textarea id="mAns" placeholder="Type the missing step"></textarea>
    <div class="row" style="margin-top:8px"><button id="mHint">Show where the gap is</button><button class="primary" id="mShow">Reveal</button><button id="mNew">New round</button></div><div id="mRes"></div></div>`;
  $("#mHint").onclick = () => $("#gap").classList.remove("hide");
  $("#mNew").onclick = () => skillMissing(s, body);
  $("#mShow").onclick = () => {
    const st = s.steps[gone];
    $("#mRes").innerHTML = `<div class="card" style="background:var(--surface-2);margin-top:10px"><b>Missing step #${gone+1}:</b> ${st.critical?`<span class="critbadge">Critical</span> `:""}${esc(st.text)}${citeHTML(st.cite)}
      <div class="row" style="margin-top:8px"><button id="mGot">I had it</button><button id="mMiss">I missed it</button></div></div>`;
    const mark = ok => { const r = P.skills[s.id] || {}; r.missHit = (r.missHit||0) + (ok?1:0); r.missN = (r.missN||0)+1; P.skills[s.id] = r; save(); skillMissing(s, body); };
    $("#mGot").onclick = () => mark(true); $("#mMiss").onclick = () => mark(false);
  };
}
function skillVerbal(s, body, i=0, shown=false){
  const st = s.steps[i];
  body.innerHTML = `<div class="card"><h2 class="big" style="margin-top:0">Say step ${i+1} of ${s.steps.length} out loud</h2>
    <p class="muted small">Say what you would do and say at the bedside, then reveal.</p>
    <div class="card ${shown&&st.critical?"crit":""}" style="background:var(--surface-2);min-height:90px">${shown ? `${st.critical?`<span class="critbadge">Critical</span><br>`:""}<span class="big">${esc(st.text)}</span>${citeHTML(st.cite)}` : `<span class="muted">Hidden</span>`}</div>
    <div class="row"><button id="vBack" ${i?"":"disabled"}>Back</button>${shown?"":`<button class="primary" id="vShow">Reveal</button>`}<button id="vNext" ${shown?'class="primary"':""}>${i+1<s.steps.length?"Next step":"Finish"}</button></div></div>`;
  $("#vBack").onclick = () => skillVerbal(s, body, i-1);
  if(!shown) $("#vShow").onclick = () => skillVerbal(s, body, i, true);
  $("#vNext").onclick = () => {
    if(i+1 < s.steps.length) return skillVerbal(s, body, i+1);

    body.innerHTML = `<div class="card"><b>Run-through complete.</b> Rehearsals logged: ${r.reps}. <button id="vAgain">Again</button></div>`;
    $("#vAgain").onclick = () => skillVerbal(s, body, 0);
  };
}

  };
  $("#mB").onclick = () => { P.mockB = {skills:shuffle(SK.map(s=>s.id)).slice(0,2), end:null, ticks:{}}; save(); mockB(); };
}
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle = null; } $("#hdrTimer").classList.add("hide"); }
function tick(el, end, onEnd){
  const hdr = $("#hdrTimer");
  const upd = () => {
    const left = end - Date.now();
    for(const t of [el, hdr]){ t.textContent = fmt(left); t.classList.toggle("low", left < 120000); }
    if(left <= 0){ stopTimer(); beep(); onEnd(); }
  };
  if(timerHandle) clearInterval(timerHandle);
  timerHandle = null;
  hdr.classList.remove("hide");
  upd(); // runs onEnd at once if the time already ran out (e.g. page reopened late)
  if(end - Date.now() > 0) timerHandle = setInterval(upd, 1000);
}
function mockA(){
  const M = P.mockA;
  if(M.submitted) return mockAReview();
  $("#main").innerHTML = `<div class="card row"><span class="timer" id="tA"></span><span class="muted small">Part A mock</span><button class="primary" id="sub" style="margin-left:auto">Submit</button><button id="quit">Abandon</button></div>
    ${M.ids.map((id,n) => { const q = QBY[id]; if(!q) return "";
      return `<div class="card"><div class="muted small">Q${n+1} · ${q.type==="mcq"?"Multiple choice":"Short answer"}</div>` + (q.type==="mcq"
      ? `<p><b>${esc(q.stem)}</b></p>${M.order[id].map(k => `<label style="display:block;margin:6px 0"><input type="radio" name="${esc(id)}" value="${k}" ${M.ans[id]==k?"checked":""}> ${esc(q.options[k].text)}</label>`).join("")}`
      : `<p><b>${esc(q.prompt)}</b></p><textarea data-id="${esc(id)}">${esc(M.ans[id]||"")}</textarea>`) + `</div>`; }).join("")}`;
  document.querySelectorAll('#main input[type=radio]').forEach(r => r.onchange = () => { M.ans[r.name] = +r.value; save(); });
  document.querySelectorAll('#main textarea').forEach(t => t.oninput = () => { M.ans[t.dataset.id] = t.value; save(); });
  const submit = () => { stopTimer(); M.submitted = true; save(); mockAReview(); };
  $("#sub").onclick = e => askFirst(e.target, "Submit now?", submit);
  $("#quit").onclick = e => askFirst(e.target, "Abandon? Answers are discarded.", () => { stopTimer(); P.mockA = null; save(); renderMock(); });
  tick($("#tA"), M.end, submit);
}
function mockAReview(){
  const M = P.mockA, mcq = M.ids.filter(id => QBY[id] && QBY[id].type==="mcq"), saq = M.ids.filter(id => QBY[id] && QBY[id].type==="saq");
  const right = mcq.filter(id => M.ans[id] !== undefined && QBY[id].options[M.ans[id]].correct).length;
  if(!M.recorded){ mcq.forEach(id => record(id, M.ans[id] !== undefined && QBY[id].options[M.ans[id]].correct ? 1 : 0)); M.recorded = true; save(); }
  $("#main").innerHTML = `<div class="card"><h2 class="big" style="margin-top:0">Part A mock: results</h2>
    <p class="big">Multiple choice: ${right} / ${mcq.length}</p>
    ${saq.length?`<p>Self-mark the short answers below, then press Finish.</p>`:""}</div>
    ${mcq.map((id,n) => { const q = QBY[id], a = M.ans[id];
      return `<div class="card">${qHeader(q)}<p><b>${esc(q.stem)}</b></p>${q.options.map((o,k) => `<div class="why ${o.correct?"good":(k===a?"bad":"")}">${k===a?"<b>Your answer:</b> ":""}${o.correct?"<b>Correct answer:</b> ":""}${esc(o.text)}<br><span class="muted">${esc(o.why)}</span></div>`).join("")}
        ${a===undefined?`<p class="muted">Not answered.</p>`:""}<p class="small">${esc(q.explanation||"")}</p>${contextHTML(q)}${citeHTML(q.cite)}</div>`; }).join("")}
    ${saq.map(id => { const q = QBY[id];
      return `<div class="card" data-saq="${esc(id)}">${qHeader(q)}<p><b>${esc(q.prompt)}</b></p><p class="small"><b>Your answer:</b> ${esc(M.ans[id]||"(blank)")}</p>
        <b>Model answer</b><p>${esc(q.model)}</p>${q.rubric.map(r => `<label style="display:block;margin:6px 0"><input type="checkbox"> ${esc(r.point)}${citeHTML(r.cite)}</label>`).join("")}${citeHTML(q.cite)}</div>`; }).join("")}
    <div class="card"><button class="primary" id="fin">Finish and save</button></div>`;
  $("#fin").onclick = () => {
    let got = 0, tot = 0;
    document.querySelectorAll("[data-saq]").forEach(card => { const cb = [...card.querySelectorAll("input")]; const g = cb.filter(c=>c.checked).length; got += g; tot += cb.length; record(card.dataset.saq, cb.length ? g/cb.length : 0); });
    P.mocks.push({ts:Date.now(), kind:"Part A", result:`MCQ ${right}/${mcq.length}` + (tot?`, SAQ points ${got}/${tot}`:"")});
    P.mockA = null; save(); go("home");
  };
}
function mockB(){
  const M = P.mockB, sks = M.skills.map(id => SKBY[id]).filter(Boolean);
  $("#main").innerHTML = `<div class="card"><h2 class="big" style="margin-top:0">Your allocated skills</h2>
    <ol class="big">${sks.map(s=>`<li>${esc(s.name)}</li>`).join("")}</ol>
    <div class="row"><span class="timer" id="tB">${M.end?"":"15:00"}</span>${M.end?"":`<button class="primary" id="bGo">Start 15-minute timer</button>`}<button id="bDone">Finish and self-check</button><button id="bQuit">Abandon</button></div></div>
    <div id="bCheck"></div>`;
  const check = () => {
    $("#bCheck").innerHTML = sks.map(s => `<div class="card" data-sk="${esc(s.id)}"><b>${esc(s.name)}: self-check</b>${(s.steps||[]).length ? `<p class="muted small">Tick each step you performed and verbalised.</p>` + s.steps.map((st,k) => `<label style="display:block;margin:6px 0" class="${st.critical?"crit":""}"><input type="checkbox"> ${st.critical?`<span class="critbadge">Critical</span> `:""}${esc(st.text)}</label>`).join("") : noSteps(s)}</div>`).join("")
      + `<div class="card"><button class="primary" id="bSave">Save rehearsal</button></div>`;
    $("#bSave").onclick = () => {
      const parts = [...document.querySelectorAll("[data-sk]")].map(card => { const cb = [...card.querySelectorAll("input")]; const r = P.skills[card.dataset.sk] || {}; r.reps = (r.reps||0)+1; P.skills[card.dataset.sk] = r; return `${SKBY[card.dataset.sk].name} ${cb.length ? cb.filter(c=>c.checked).length + "/" + cb.length : "(no checklist loaded)"}`; });
      P.mocks.push({ts:Date.now(), kind:"Part B", result:parts.join("; ")}); P.mockB = null; save(); go("home");
    };
  };
  if(M.end) tick($("#tB"), M.end, check);
  if(!M.end) $("#bGo").onclick = () => { M.end = Date.now()+MOCK_MS; save(); mockB(); };
  $("#bDone").onclick = () => { stopTimer(); check(); };
  $("#bQuit").onclick = e => askFirst(e.target, "Abandon this rehearsal?", () => { stopTimer(); P.mockB = null; save(); renderMock(); });
}

/* ---------- flashcards (Leitner boxes) ---------- */
// Cards reuse the cited questions: front = stem/prompt, back = correct answer or model answer.
const BOX_WAIT = [0, 0, 10*60e3, 60*60e3, 24*60*60e3, 3*24*60*60e3]; // index = box 1..5
function cardDue(id){ const c = (P.cards||{})[id]; return !c || c.due <= Date.now(); }
function renderCards(){
  P.cards = P.cards || {};
  const due = shuffle(Q.filter(q => cardDue(q.id)).map(q => q.id));
  const boxes = [1,2,3,4,5].map(b => Q.filter(q => ((P.cards[q.id]||{}).box||1) === b).length);
  const head = `<div class="card"><h2 class="big" style="margin-top:0">Flashcards</h2>
    <p class="muted small">Recall the answer, then reveal. Cards you know move up a box and come back later (10 min, 1 hour, 1 day, 3 days); cards you miss go back to box 1.</p>
    <div class="row small">${boxes.map((n,i) => `<span class="tag">Box ${i+1}: ${n}</span>`).join("")}</div>
    <p><b>${due.length}</b> card${due.length===1?"":"s"} due now.</p></div>`;
  if(!due.length){ $("#main").innerHTML = head; return; }
  let i = 0;
  const show = (revealed) => {
    const q = QBY[due[i]];
    $("#main").innerHTML = head + `<div class="card">${qHeader(q)}<p class="big">${esc(q.stem || q.prompt)}</p>
      ${revealed ? `<div class="card" style="background:var(--surface-2)">${q.type==="mcq" ? `<b>${esc(q.options.find(o=>o.correct).text)}</b>${q.explanation?`<p class="small">${esc(q.explanation)}</p>`:""}` : esc(q.model)}${citeHTML(q.cite)}</div>
        <div class="row"><button class="primary" id="cKnew">I knew it</button><button id="cMiss">I didn't</button></div>`
      : `<button class="primary" id="cShow">Reveal answer</button>`}
      <p class="muted small">Card ${i+1} of ${due.length}</p></div>`;
    if(!revealed){ $("#cShow").onclick = () => show(true); return; }
    const mark = knew => {
      const c = P.cards[q.id] || {box:1};
      c.box = knew ? Math.min(5, (c.box||1) + 1) : 1;
      c.due = Date.now() + BOX_WAIT[c.box];
      P.cards[q.id] = c; save();
      if(++i < due.length) show(false); else renderCards();
    };
    $("#cKnew").onclick = () => mark(true); $("#cMiss").onclick = () => mark(false);
  };
  show(false);
}

/* ---------- search ---------- */
function renderSearch(){
  $("#main").innerHTML = `<div class="card"><label for="sQ"><b>Search questions, answers and skill notes</b></label>
    <input type="text" id="sQ" style="width:100%;margin-top:6px" placeholder="e.g. stridor, SpO2, thrombolysis"></div><div id="sRes"></div>`;
  const run = () => {
    const term = $("#sQ").value.trim().toLowerCase();
    if(term.length < 2){ $("#sRes").innerHTML = ""; return; }
    const hit = s => String(s||"").toLowerCase().includes(term);
    const qs = Q.filter(q => hit(q.stem) || hit(q.prompt) || hit(q.model) || hit(q.explanation) || (q.options||[]).some(o => hit(o.text) || hit(o.why)) || (q.rubric||[]).some(r => hit(r.point)));
    const notes = SK.flatMap(s => [...(s.steps||[]), ...(s.notes||[])].filter(n => hit(n.text)).map(n => ({s, n})));
    $("#sRes").innerHTML = `<p class="muted small">${qs.length} question${qs.length===1?"":"s"}, ${notes.length} skill note${notes.length===1?"":"s"}</p>`
      + qs.map(q => `<button class="opt" data-q="${esc(q.id)}"><span class="small muted">${esc(q.id)} · ${esc(q.topic)}</span><br>${esc(q.stem || q.prompt)}</button>`).join("")
      + notes.map(({s, n}) => `<div class="card small"><b>${esc(s.name)}</b><br>${esc(n.text)}${citeHTML(n.cite)}</div>`).join("");
    document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => startQuiz({ids:[b.dataset.q]}));
  };
  $("#sQ").oninput = run; $("#sQ").focus();
}

/* ---------- sources & gaps ---------- */
function renderSources(){
  $("#main").innerHTML = `${banner()}<div class="card"><h2 class="big" style="margin-top:0">Sources used</h2>
    <p class="muted small">Every question, answer and step in this app cites one of these files from ./modules/.</p>
    <table><tr><th>File</th><th>What it is</th></tr>${Object.values(C.sources).map(s => `<tr><td>${esc(s.file)}</td><td>${esc(s.label||"")}</td></tr>`).join("")}</table></div>
    <div class="card"><h2 class="big" style="margin-top:0">Subject Learning Objectives</h2>${Object.entries(C.slos||{}).map(([k,v]) => `<p><b>${esc(k)}</b> ${esc(v.text||v)}${v.cite?citeHTML(v.cite):""}</p>`).join("")}</div>
    <div class="card"><h2 class="big" style="margin-top:0">Gaps: topics with little or no source material</h2>
    <p class="muted small">These are assessed but not covered by the loaded modules. They are deliberately not filled from general knowledge.</p>
    <ul>${(C.gaps||[]).map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>
    ${(C.context||[]).length ? `<div class="card"><h2 class="big" style="margin-top:0">Context notes (not scored)</h2>${C.context.map(c => `<div class="ctx small"><b>${esc(c.label)}:</b> ${esc(c.text)}</div>`).join("")}</div>` : ""}
    <p class="muted small">Built ${esc(C.meta.built||"")}. ${Q.length} questions, ${SK.reduce((n,s)=>n+(s.steps||[]).length,0)} skill steps.</p>`;
}

go("home");
