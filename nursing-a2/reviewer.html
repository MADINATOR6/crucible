q", "week": "Module 4", "topic": "NGT initial confirmation", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "An initial NGT aspirate has pH greater than five. What must be ordered?", "options": [{"text": "Chest x-ray confirmation", "correct": true, "why": "The policy requires x-ray when initial aspirate pH is greater than five."}, {"text": "Confirm by auscultation", "why": "The policy says never use auscultation."}, {"text": "Use litmus paper", "why": "The policy says never use litmus."}, {"text": "Begin medication administration", "why": "Placement must first be confirmed."}], "explanation": "The policy requires x-ray when initial aspirate pH is greater than five.", "cite": [{"src": "NGTPOL", "loc": "p.13"}]}, {"id": "M4-07", "type": "mcq", "week": "Module 4", "topic": "NGT no aspirate", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "No gastric aspirate can be obtained after NGT insertion. What confirmation is required?", "options": [{"text": "Radiological confirmation", "correct": true, "why": "The policy requires an x-ray if aspirate cannot be obtained."}, {"text": "Air insufflation with auscultation", "why": "Auscultation must never confirm position."}, {"text": "Litmus paper", "why": "Litmus cannot confirm pH."}, {"text": "Assume correct placement from the external length", "why": "Initial placement still requires confirmation."}], "explanation": "The policy requires an x-ray if aspirate cannot be obtained.", "cite": [{"src": "NGTPOL", "loc": "p.13"}]}, {"id": "M4-08", "type": "mcq", "week": "Module 4", "topic": "NGT medication safety", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "Before medication is given through a newly inserted NGT, which requirements apply?", "options": [{"text": "Confirmed tube placement and a documented medical-officer direction to use it", "correct": true, "why": "Both are required before medications or feed."}, {"text": "Only a medication order", "why": "Tube placement and direction to commence use are also required."}, {"text": "Only an audible air test", "why": "Auscultation is not a valid confirmation method."}, {"text": "Only a visible nostril mark", "why": "The mark is for monitoring migration, not initial confirmation."}], "explanation": "Both are required before medications or feed.", "cite": [{"src": "NGTPOL", "loc": "p.14"}, {"src": "NGTPOL", "loc": "p.13"}, {"src": "NGTPOL", "loc": "p.15"}]}, {"id": "M4-09", "type": "mcq", "week": "Module 4", "topic": "NGT migration", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "The tube's nostril centimetre mark differs from its insertion record. What next?", "options": [{"text": "Do not use it until gastric position is reconfirmed", "correct": true, "why": "A changed mark indicates migration and reconfirmation is required."}, {"text": "Continue feed if the patient does not cough", "why": "Absence of coughing does not rule out displacement."}, {"text": "Rely on the old x-ray alone", "why": "Placement can change after the image."}, {"text": "Give water through it to test patency", "why": "Use must pause until position is reconfirmed."}], "explanation": "A changed mark indicates migration and reconfirmation is required.", "cite": [{"src": "NGTPOL", "loc": "p.15"}, {"src": "NGTPOL", "loc": "p.14"}, {"src": "NGTPOL", "loc": "p.16"}]}, {"id": "M4-10", "type": "mcq", "week": "Module 4", "topic": "NGT feed intolerance", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "A patient receiving NGT feed starts coughing and aspiration is suspected. What action is specified?", "options": [{"text": "Cease feeds immediately and notify the medical officer", "correct": true, "why": "The policy directs both actions for suspected aspiration."}, {"text": "Increase the feed rate", "why": "This conflicts with immediate cessation."}, {"text": "Continue and observe only", "why": "The policy calls for cessation and notification."}, {"text": "Give crushed medication first", "why": "Medication also requires safe tube use."}], "explanation": "The policy directs both actions for suspected aspiration.", "cite": [{"src": "NGTPOL", "loc": "p.15"}]}, {"id": "M4-11", "type": "saq", "week": "Module 4", "topic": "ASSIST sequence", "slo": ["SLO2", "SLO3"], "reasoning": true, "prompt": "A trained clinician screens an adult with persisting acute stroke symptoms. Outline the ASSIST stop rules before and during water testing.", "model": "First check alertness for at least 20 minutes, upright sitting and head control; any no means stop, NBM and review. Any section 2 risk sign such as facial droop, slurred speech or weak cough means stop, NBM and refer to speech pathology. During a 10 mL sip or cup of water, coughing or throat clearing, voice change, drooling or breathing change also means stop, NBM and refer.", "rubric": [{"point": "Section 1 alertness, posture and head control; any no means stop and NBM", "cite": [{"src": "ASSIST", "loc": "p.1"}]}, {"point": "Section 2 risk sign means NBM and speech pathology referral", "cite": [{"src": "ASSIST", "loc": "p.1"}]}, {"point": "Water-test cough, voice, drool or breathing change means NBM and referral (including coughing or throat clearing)", "cite": [{"src": "ASSIST", "loc": "p.1"}]}], "cite": [{"src": "ASSIST", "loc": "p.1"}]}, {"id": "M4-12", "type": "saq", "week": "Module 4", "topic": "NGT medication", "slo": ["SLO2", "SLO3"], "reasoning": true, "prompt": "Before administering a medicine through an NGT, what placement, authorisation and medicine checks does the policy require?", "model": "Confirm tube position before medication, including checking for migration. A medical officer must document direction to commence tube use, and medication administration directions must be on the medication order by a pharmacist or medical officer. Confirm medication/feed compatibility, solubility and stability with pharmacists; liquid medicines are preferred to crushed medicines.", "rubric": [{"point": "Placement confirmed before medicines and migration checked", "cite": [{"src": "NGTPOL", "loc": "p.14"}, {"src": "NGTPOL", "loc": "p.15"}]}, {"point": "Medical officer documents direction to commence use", "cite": [{"src": "NGTPOL", "loc": "p.14"}]}, {"point": "Medication directions documented by pharmacist or medical officer", "cite": [{"src": "NGTPOL", "loc": "p.15"}]}, {"point": "Pharmacist confirms compatibility, solubility and stability; liquids preferred", "cite": [{"src": "NGTPOL", "loc": "p.15"}]}], "cite": [{"src": "NGTPOL", "loc": "p.14"}, {"src": "NGTPOL", "loc": "p.15"}]}, {"id": "RA-01", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Respiratory assessment", "slo": ["SLO1"], "skill": "auscultation", "stem": "You are about to auscultate a patient's chest. According to the tutorial, what is the first step?", "options": [{"text": "Position the patient upright", "correct": true, "why": "Step 1 on the auscultation slide is 'Position patient upright'."}, {"text": "Ask the patient to breathe through their nose", "why": "The slide asks the patient to breathe through their mouth, and that is step 2."}, {"text": "Listen for adventitious sounds", "why": "Listening for quality, intensity and adventitious sounds is the last step (step 5)."}, {"text": "Compare each side with the other", "why": "Side-to-side comparison is step 4, done while you listen."}], "explanation": "The sequence is: upright, breathe through mouth, listen with stethoscope, compare sides, listen for quality, intensity and adventitious sounds.", "cite": [{"src": "COPD", "loc": "slide 7"}]}, {"id": "RA-02", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Respiratory assessment", "slo": ["SLO1"], "skill": "auscultation", "stem": "While auscultating the lungs, which three features does the tutorial tell you to listen for?", "options": [{"text": "Quality, intensity and adventitious sounds", "correct": true, "why": "Step 5 on the slide is 'Listen for quality, intensity and adventitious sounds'."}, {"text": "Rate, rhythm and depth", "why": "Rate and rhythm are LOOK items on slide 6, not what you listen for with the stethoscope."}, {"text": "Resonance, hyper-resonance and dullness", "why": "These are percussion notes (slide 11), not auscultation findings."}, {"text": "Lumps, skin temperature and pain", "why": "These are palpation (FEEL) items on slide 10."}], "explanation": "Keep the look / listen / feel components separate: rate and rhythm are LOOK items, resonance is percussion, lumps and skin temperature are palpation.", "cite": [{"src": "COPD", "loc": "slides 6, 7, 10, 11"}]}, {"id": "RA-03", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Adventitious breath sounds", "slo": ["SLO1", "SLO2"], "skill": "auscultation", "reasoning": true, "stem": "On auscultation you hear continuous, high-pitched, hissing sounds. What is this and what does it indicate?", "options": [{"text": "Wheeze: air flowing through narrowed airways (distal airflow obstruction)", "correct": true, "why": "The slide defines wheeze as continuous, high-pitched hissing sounds from distal airflow obstruction as air flows through narrowed airways."}, {"text": "Crackles: distal airways opening on inspiration", "why": "Crackles are interrupted, non-musical sounds, not continuous hissing."}, {"text": "Pleural friction rub: inflamed pleura rubbing", "why": "A friction rub is a grating sound from thickened pleural surfaces rubbing together."}, {"text": "Stridor: upper airway obstruction", "why": "Stridor is a loud strangulating sound on inspiration, heard clearly over the trachea."}], "explanation": "Wheeze = continuous, high-pitched, hissing. Crackles = interrupted and non-musical.", "cite": [{"src": "COPD", "loc": "slide 9"}]}, {"id": "RA-04", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Adventitious breath sounds", "slo": ["SLO1", "SLO2"], "skill": "auscultation", "reasoning": true, "stem": "A patient has a loud, strangulating sound on inspiration, heard most clearly over the trachea. What is your priority action?", "options": [{"text": "Get an immediate review by a senior doctor", "correct": true, "why": "This is stridor, an obstruction of the trachea or larynx that 'requires immediate review by a senior doctor'."}, {"text": "Document it and reassess at the next routine observations", "why": "Stridor is an upper airway obstruction that needs immediate senior review, not routine reassessment."}, {"text": "Encourage deep breathing and coughing, then re-auscultate", "why": "Upper airway obstruction needs immediate senior medical review; the source does not support waiting."}, {"text": "Record it as crackles and continue the assessment", "why": "Crackles are interrupted, non-musical sounds; this description matches stridor."}], "explanation": "Findings → interpretation → action: inspiratory strangulating sound over the trachea → stridor (upper airway obstruction) → escalate now.", "cite": [{"src": "COPD", "loc": "slide 9"}]}, {"id": "RA-05", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Adventitious breath sounds", "slo": ["SLO1", "SLO2"], "skill": "auscultation", "reasoning": true, "stem": "A person with a severe asthma attack, who earlier had loud wheeze, now has very soft breath sounds and almost no wheeze. How should you interpret this?", "options": [{"text": "A danger sign: a silent chest may mean total peripheral airway obstruction", "correct": true, "why": "The tutorial warns that a silent chest may mean total peripheral airway obstruction, and the Asthma Handbook figure lists soft or absent breath sounds as a life-threatening finding."}, {"text": "Improvement: the wheeze has resolved", "why": "Less wheeze with soft breath sounds can mean less air is moving, not recovery; soft or absent breath sounds are a life-threatening sign."}, {"text": "A normal finding after salbutamol", "why": "The sources treat soft or absent breath sounds in acute asthma as life-threatening, not normal."}, {"text": "Pleural friction rub from pneumonia", "why": "A friction rub is a grating sound; this finding is reduced breath sounds."}], "explanation": "Escalate. Life-threatening asthma management includes arranging immediate transfer to higher-level care and notifying senior staff (ASTHMA.pdf slide 15).", "cite": [{"src": "COPD", "loc": "slide 9"}, {"src": "ASTHMA", "loc": "slide 15"}]}, {"id": "RA-06", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Adventitious breath sounds", "slo": ["SLO1", "SLO2"], "skill": "auscultation", "stem": "You hear interrupted, non-musical sounds during inspiration. What causes them, according to the tutorial?", "options": [{"text": "Distal airways opening during inspiration (and collapsing during expiration)", "correct": true, "why": "This is the slide's definition of crackles."}, {"text": "Air flowing through narrowed airways", "why": "That describes wheeze, which is continuous and high-pitched."}, {"text": "Thickened pleural surfaces rubbing together", "why": "That describes a pleural friction rub (a grating sound)."}, {"text": "Obstruction of the trachea or larynx", "why": "That describes stridor."}], "explanation": "Crackles = interrupted and non-musical. Wheeze = continuous, high-pitched, hissing.", "cite": [{"src": "COPD", "loc": "slide 9"}]}, {"id": "RA-07", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Adventitious breath sounds", "slo": ["SLO2"], "skill": "auscultation", "stem": "According to the tutorial, a pleural friction rub is indicative of:", "options": [{"text": "Pleurisy secondary to pneumonia or pulmonary infarction", "correct": true, "why": "The slide gives this as the significance of a pleural friction rub."}, {"text": "Upper airway obstruction", "why": "Upper airway obstruction causes stridor."}, {"text": "Total peripheral airway obstruction", "why": "That is the warning attached to a silent chest."}, {"text": "Distal airways opening on inspiration", "why": "That is the mechanism of crackles."}], "explanation": "Friction rub = grating sound as thickened pleural surfaces rub together during breathing.", "cite": [{"src": "COPD", "loc": "slide 9"}]}, {"id": "RA-08", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Respiratory assessment", "slo": ["SLO1"], "skill": "auscultation", "stem": "Which of these is NOT one of the LOOK (inspection) components in the tutorial's respiratory assessment?", "options": [{"text": "Percussion note", "correct": true, "why": "Percussion (resonant, hyper-resonant, dull) is under FEEL on slide 11, not LOOK."}, {"text": "Position of the trachea", "why": "Position of the trachea is a LOOK item on slide 6."}, {"text": "Work of breathing", "why": "Work of breathing is a LOOK item on slide 6."}, {"text": "Orthopnoea", "why": "Orthopnoea is a LOOK item on slide 6."}], "explanation": "LOOK: general appearance (facial expression, anxiety, agitation, position), ability to talk, colour, trachea position, work of breathing, rate, rhythm, cough, orthopnoea.", "cite": [{"src": "COPD", "loc": "slides 6 and 11"}]}, {"id": "RA-09", "type": "saq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Respiratory assessment", "slo": ["SLO1"], "skill": "auscultation", "prompt": "List, in order, the five steps for auscultating the chest taught in the Week 2 tutorial.", "model": "1. Position the patient upright. 2. Ask them to breathe through their mouth. 3. Listen to breath sounds with your stethoscope (at the anterior and posterior auscultation points). 4. Compare each side with the other. 5. Listen for quality, intensity and adventitious sounds.", "rubric": [{"point": "Position the patient upright", "cite": [{"src": "COPD", "loc": "slide 7"}]}, {"point": "Ask the patient to breathe through their mouth", "cite": [{"src": "COPD", "loc": "slide 7"}]}, {"point": "Listen to breath sounds with a stethoscope", "cite": [{"src": "COPD", "loc": "slide 7"}]}, {"point": "Compare each side with the other", "cite": [{"src": "COPD", "loc": "slide 7"}]}, {"point": "Listen for quality, intensity and adventitious sounds", "cite": [{"src": "COPD", "loc": "slide 7"}]}], "cite": [{"src": "COPD", "loc": "slides 7-8"}]}, {"id": "RA-10", "type": "saq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Adventitious breath sounds", "slo": ["SLO1", "SLO2"], "skill": "auscultation", "reasoning": true, "prompt": "Describe wheeze, crackles, pleural friction rub and stridor. Which one needs immediate escalation, and to whom?", "model": "Wheeze: continuous, high-pitched, hissing sounds from air flowing through narrowed airways (distal airflow obstruction). Crackles: interrupted, non-musical sounds from distal airways opening on inspiration and collapsing on expiration. Pleural friction rub: grating sound as thickened pleural surfaces rub together; indicates pleurisy secondary to pneumonia or pulmonary infarction. Stridor: loud strangulating inspiratory sound from obstruction of the trachea or larynx (upper airway), heard clearly over the trachea. Stridor needs an immediate review by a senior doctor. Also: a silent chest may mean total peripheral airway obstruction.", "rubric": [{"point": "Wheeze: continuous, high-pitched; narrowed airways", "cite": [{"src": "COPD", "loc": "slide 9"}]}, {"point": "Crackles: interrupted, non-musical; distal airways opening/collapsing", "cite": [{"src": "COPD", "loc": "slide 9"}]}, {"point": "Friction rub: grating; pleurisy secondary to pneumonia or pulmonary infarction", "cite": [{"src": "COPD", "loc": "slide 9"}]}, {"point": "Stridor: inspiratory, upper airway (trachea/larynx) obstruction", "cite": [{"src": "COPD", "loc": "slide 9"}]}, {"point": "Stridor → immediate review by a senior doctor", "cite": [{"src": "COPD", "loc": "slide 9"}]}], "cite": [{"src": "COPD", "loc": "slide 9"}]}, {"id": "RA-11", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Respiratory assessment", "slo": ["SLO1"], "skill": "auscultation", "stem": "Which set of findings belongs to the FEEL (palpation) part of the respiratory assessment in the tutorial?", "options": [{"text": "Lumps or abnormal structures, skin temperature, rise and fall of the chest, pain", "correct": true, "why": "These four are the palpation items on slide 10."}, {"text": "Quality, intensity, adventitious sounds", "why": "These are what you listen for on auscultation (slide 7)."}, {"text": "Ability to talk, colour, work of breathing", "why": "These are LOOK items (slide 6)."}, {"text": "Wheeze, crackles, stridor", "why": "These are adventitious breath sounds (slide 9)."}], "explanation": "The assessment runs look, listen, feel (palpation, then percussion: resonant, hyper-resonant, dull).", "cite": [{"src": "COPD", "loc": "slides 6, 7, 9, 10, 11"}]}, {"id": "ST-01", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: recognition", "slo": ["SLO2"], "stem": "What does F.A.S.T. stand for in the Stroke Foundation poster?", "options": [{"text": "Face drooped? Arms can't be raised? Speech slurred or confused? Time is critical: call 000", "correct": true, "why": "This is the wording on the F.A.S.T. poster in the lecture."}, {"text": "Fever, Airway, Swallow, Temperature", "why": "Not the F.A.S.T. mnemonic."}, {"text": "Face, Alertness, Sensation, Tone", "why": "Not the wording on the poster."}, {"text": "Fall, Arm weakness, Sight loss, Time", "why": "Not the wording on the poster."}], "explanation": "If you see any of these signs, act FAST and call triple zero (000).", "cite": [{"src": "STROKE", "loc": "slide 19"}]}, {"id": "ST-02", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: treatment", "slo": ["SLO2", "SLO4"], "stem": "Up to how long after symptom onset may IV thrombolysis (tenecteplase or alteplase) be used for ischaemic stroke, according to the lecture?", "options": [{"text": "Up to 4.5 hours", "correct": true, "why": "Give as early as possible, but it may be used up to 4.5 hours after onset."}, {"text": "Up to 24 hours", "why": "Up to 24 hours is the window for endovascular clot retrieval (ideally under 6 hours)."}, {"text": "Up to 48 hours", "why": "48 hours relates to the anticoagulant contraindication (anticoagulants within 48 hrs)."}, {"text": "Up to 6 hours", "why": "Under 6 hours is the ideal time for clot retrieval, not the thrombolysis limit."}], "explanation": "After thrombolysis: stroke team care, NIHSS neurological assessment and vital-sign monitoring.", "cite": [{"src": "STROKE", "loc": "slides 23-25"}]}, {"id": "ST-03", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: treatment", "slo": ["SLO2", "SLO4"], "reasoning": true, "stem": "Which finding is a contraindication to thrombolysis listed in the lecture?", "options": [{"text": "Took an anticoagulant within the last 48 hours", "correct": true, "why": "'Anticoagulants within 48hrs' is on the contraindication list."}, {"text": "Symptom onset 2 hours ago", "why": "This is within the 4.5-hour window, not a contraindication."}, {"text": "Age over 65", "why": "Age is not on the contraindication list."}, {"text": "An ischaemic stroke confirmed on CT", "why": "Thrombolysis is for ischaemic stroke. Haemorrhagic stroke is the contraindication."}], "explanation": "Contraindications: haemorrhagic stroke; large ischaemic area on imaging (over 1/3); active bleeding or recent trauma or surgery; coagulopathy (low platelets, high INR); anticoagulants within 48 hrs.", "cite": [{"src": "STROKE", "loc": "slide 25"}]}, {"id": "ST-04", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: localisation", "slo": ["SLO2"], "reasoning": true, "stem": "A patient has sudden right-sided arm weakness and difficulty finding words. Which hemisphere is most likely affected?", "options": [{"text": "Left hemisphere", "correct": true, "why": "The left hemisphere controls motor function on the right side of the body and handles speech, language and comprehension."}, {"text": "Right hemisphere", "why": "The right hemisphere controls the LEFT side of the body."}, {"text": "Cerebellum", "why": "The cerebellum handles balance, coordination and fine muscle control, not language."}, {"text": "Occipital lobe", "why": "The occipital lobe handles vision."}], "explanation": "Identifying the area of the brain affected lets you recognise symptoms and provide patient-centred care.", "cite": [{"src": "STROKE", "loc": "slides 3-4"}]}, {"id": "ST-05", "type": "mcq", "week": "Stroke lecture", "topic": "Neurological assessment", "slo": ["SLO1", "SLO2"], "reasoning": true, "stem": "A patient's GCS falls from 14 to 12 between observations. On the adult neurological observation chart shown in the lecture, what should you do?", "options": [{"text": "Initiate a Rapid Response", "correct": true, "why": "The chart says: if GCS drops by 2 or more points, initiate a Rapid Response."}, {"text": "Initiate a Clinical Review", "why": "A Clinical Review is for a 1-point drop. This is a 2-point drop."}, {"text": "Recheck in 4 hours", "why": "A 2-point drop meets the Rapid Response criterion now."}, {"text": "Document only; a GCS of 12 is acceptable", "why": "The trigger is the size of the drop, not the absolute score."}], "explanation": "Findings (GCS down 2) → interpretation (neurological deterioration) → action (Rapid Response).", "cite": [{"src": "STROKE", "loc": "slide 21"}]}, {"id": "ST-06", "type": "mcq", "week": "Stroke lecture", "topic": "Neurological assessment", "slo": ["SLO1"], "stem": "A patient opens their eyes to speech, is confused, and localises to pain. What is their GCS on the chart in the lecture?", "options": [{"text": "12 (E3 V4 M5)", "correct": true, "why": "Eyes to speech = 3, confused = 4, localises to pain = 5, total 12."}, {"text": "11 (E3 V4 M4)", "why": "Withdraws = 4, but localising to pain scores 5."}, {"text": "13 (E4 V4 M5)", "why": "Spontaneous eye opening scores 4. Eyes open to speech scores 3."}, {"text": "10 (E2 V3 M5)", "why": "Eyes to pain = 2 and inappropriate words = 3 do not match this patient."}], "explanation": "Rate by the HIGHEST response observed (the 'Rate' step on the GCS slide).", "cite": [{"src": "STROKE", "loc": "slide 21"}]}, {"id": "ST-07", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: diagnosis", "slo": ["SLO2"], "stem": "In the ACI stroke pathway in the lecture, what does the first imaging (non-contrast head CT) rule out?", "options": [{"text": "Intracerebral haemorrhage", "correct": true, "why": "The pathway says 'Noncontrast head CT rules out intracerebral haemorrhage'."}, {"text": "Pneumonia", "why": "The pathway uses non-contrast head CT to rule out intracerebral haemorrhage, not pneumonia."}, {"text": "Atrial fibrillation", "why": "The pathway uses non-contrast head CT to rule out intracerebral haemorrhage, not atrial fibrillation."}, {"text": "Hyperglycaemia", "why": "The pathway uses non-contrast head CT to rule out intracerebral haemorrhage, not hyperglycaemia."}], "explanation": "Haemorrhage must be excluded because haemorrhagic stroke is a contraindication to thrombolysis.", "cite": [{"src": "STROKE", "loc": "slides 20, 25, 26"}]}, {"id": "ST-08", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: nursing care", "slo": ["SLO1", "SLO2"], "reasoning": true, "stem": "According to the lecture, which factors must be controlled to prevent secondary brain injury after stroke?", "options": [{"text": "Hypertension, hyperglycaemia, infection and hypoxia", "correct": true, "why": "The medical management slide lists these four as the targets for preventing secondary brain injury."}, {"text": "Hypotension only", "why": "The slide lists four factors; nursing care also says avoid both hyper- and hypotension."}, {"text": "Pain and anxiety only", "why": "Not the factors listed for secondary brain injury."}, {"text": "Tachycardia and hypothermia", "why": "Not the factors listed on the slide."}], "explanation": "Nursing links: BP management (avoid hyper/hypotension), manage hyperglycaemia, manage fevers and infection, neurological monitoring.", "cite": [{"src": "STROKE", "loc": "slides 23, 28"}]}, {"id": "ST-09", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: nursing care", "slo": ["SLO1", "SLO2"], "reasoning": true, "stem": "A patient with new facial droop and slurred speech asks for a drink of water. Which nursing consideration from the lecture applies most directly?", "options": [{"text": "Dysphagia: swallow assessment", "correct": true, "why": "'Dysphagia (swallow assessment)' is on the lecture's list of nursing considerations, and facial and speech deficits suggest the face and mouth are affected."}, {"text": "DVT prophylaxis", "why": "DVT prophylaxis is on the list, but it does not answer whether the patient can safely drink."}, {"text": "Reduce the risk of falls", "why": "Falls prevention is on the list, but it is not the issue raised by a request to drink."}, {"text": "Manage delirium", "why": "Delirium management is on the list, but the question is about swallowing safely."}], "explanation": "The motor homunculus shows swallowing, tongue, jaw and lips next to the face, all in the MCA territory.", "cite": [{"src": "STROKE", "loc": "slides 8, 9, 28"}]}, {"id": "ST-10", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: types", "slo": ["SLO2"], "stem": "According to the lecture, what proportion of strokes are ischaemic?", "options": [{"text": "4 out of 5", "correct": true, "why": "'4 out of 5 strokes are ischaemic'; the haemorrhagic slide gives 1 out of 5."}, {"text": "1 out of 5", "why": "1 out of 5 is the haemorrhagic proportion."}, {"text": "1 out of 2", "why": "Not stated in the lecture."}, {"text": "85%", "why": "85% is the share of subarachnoid haemorrhages caused by a ruptured aneurysm."}], "explanation": "Ischaemic subtypes: embolic (a clot travels to the brain) and thrombotic (plaque formation). TIA = temporary blockage.", "cite": [{"src": "STROKE", "loc": "slides 10-12"}]}, {"id": "ST-11", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: types", "slo": ["SLO1", "SLO2"], "reasoning": true, "stem": "A patient's facial droop and arm weakness resolve completely and a transient ischaemic attack (TIA) is diagnosed. What risk does the lecture highlight?", "options": [{"text": "1 in 5 will have a major stroke within the next 3 months", "correct": true, "why": "The ischaemic stroke slide gives this statistic for TIA."}, {"text": "No further risk, because symptoms resolved", "why": "The lecture stresses a significant risk of major stroke after TIA."}, {"text": "85% will have a subarachnoid haemorrhage", "why": "85% is the proportion of SAH caused by ruptured aneurysm."}, {"text": "Functional independence in only 20%", "why": "That statistic is for haemorrhagic stroke."}], "explanation": "A TIA is a temporary blockage of the vessels supplying the brain. Take it seriously: early recognition and treatment are vital to stroke outcomes.", "cite": [{"src": "STROKE", "loc": "slides 9-12"}]}, {"id": "ST-12", "type": "saq", "week": "Stroke lecture", "topic": "Stroke: treatment", "slo": ["SLO1", "SLO2"], "reasoning": true, "prompt": "A patient has sudden left facial droop and left arm weakness that started 1 hour ago. Using the stroke lecture, outline the initial assessment, first imaging, the time-critical ischaemic stroke treatments (with time windows), and four nursing considerations.", "model": "Initial assessment: time of symptom onset, past medical history, medications; vital signs, GCS and NIHSS. First imaging: non-contrast CT to rule out intracerebral haemorrhage (then CTA/CT perfusion). If ischaemic: IV thrombolysis (tenecteplase or alteplase) as early as possible and up to 4.5 hours after onset, if there are no contraindications (for example haemorrhage, anticoagulants within 48 hrs, coagulopathy); endovascular clot retrieval up to 24 hours (ideally under 6 hours) for some patients. Nursing: neurological monitoring (NIHSS/GCS) and vital signs after thrombolysis; BP management avoiding hyper- and hypotension; dysphagia screening (swallow assessment); managing fever, infection and hyperglycaemia; falls, pressure-area care and positioning; engaging family.", "rubric": [{"point": "Symptom onset time, history, medications; vital signs, GCS + NIHSS", "cite": [{"src": "STROKE", "loc": "slide 20"}]}, {"point": "Non-contrast CT first to rule out haemorrhage", "cite": [{"src": "STROKE", "loc": "slides 20, 26"}]}, {"point": "Thrombolysis up to 4.5 h; ECR up to 24 h (ideally under 6 h)", "cite": [{"src": "STROKE", "loc": "slides 23-25"}]}, {"point": "At least one thrombolysis contraindication", "cite": [{"src": "STROKE", "loc": "slide 25"}]}, {"point": "Four nursing considerations (e.g. neuro obs, BP, swallow assessment, glucose/fever, falls)", "cite": [{"src": "STROKE", "loc": "slide 28"}]}], "cite": [{"src": "STROKE", "loc": "slides 20-28"}]}, {"id": "ST-13", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: types", "slo": ["SLO2"], "stem": "According to the lecture, what causes 85% of subarachnoid haemorrhages?", "options": [{"text": "A ruptured aneurysm", "correct": true, "why": "'85% are caused by a ruptured aneurysm'."}, {"text": "An embolus from the heart", "why": "Embolic clots cause ischaemic (embolic) stroke."}, {"text": "Plaque formation", "why": "Plaque formation describes thrombotic ischaemic stroke."}, {"text": "Trauma only", "why": "Trauma is listed as a cause of haemorrhagic stroke, but 85% of SAH is attributed to ruptured aneurysm."}], "explanation": "SAH needs vascular treatment because of the risk of re-rupture: surgical clipping or endovascular coiling/stenting.", "cite": [{"src": "STROKE", "loc": "slides 10-15"}]}, {"id": "ST-14", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: treatment", "slo": ["SLO2", "SLO4"], "stem": "Endovascular treatment of a cerebral aneurysm with stenting and coiling requires which medicine therapy, according to the lecture?", "options": [{"text": "Dual antiplatelet therapy (DAPT)", "correct": true, "why": "The endovascular slide says it 'requires administration of dual antiplatelet therapy (DAPT)'."}, {"text": "IV thrombolysis", "why": "Thrombolysis is for ischaemic stroke; haemorrhagic stroke is a contraindication."}, {"text": "Magnesium sulfate", "why": "The endovascular slide names dual antiplatelet therapy, not magnesium sulfate."}, {"text": "No medication is involved", "why": "The slide states DAPT is required."}], "explanation": "Surgical alternative: craniotomy and clipping, where the clip stays in situ permanently.", "cite": [{"src": "STROKE", "loc": "slides 14-15, 25"}]}, {"id": "ST-15", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: types", "slo": ["SLO1", "SLO2"], "stem": "Which is NOT listed in the lecture as a risk factor for cerebral aneurysm?", "options": [{"text": "Being under 20 years of age", "correct": true, "why": "The listed risk factors are smoking, hypertension, family history, age over 40, and being female (women > men)."}, {"text": "Smoking", "why": "Smoking is listed."}, {"text": "Hypertension", "why": "Hypertension is listed."}, {"text": "Family history", "why": "Family history is listed."}], "explanation": "Ruptured aneurysms cause subarachnoid haemorrhage and are a medical emergency.", "cite": [{"src": "STROKE", "loc": "slide 13"}]}, {"id": "ST-16", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: treatment", "slo": ["SLO2"], "stem": "In endovascular clot retrieval, how is the catheter introduced, according to the lecture?", "options": [{"text": "Via the femoral or radial artery", "correct": true, "why": "The catheter is 'fed into the blocked blood vessel (via femoral or radial artery)'."}, {"text": "Through a burr hole in the skull", "why": "ECR is endovascular, not a craniotomy."}, {"text": "Via a peripheral IV cannula in the hand", "why": "The slide specifies the femoral or radial artery."}, {"text": "Through the jugular vein", "why": "Not stated; the slide names arterial access."}], "explanation": "A wire stent or suction device captures the clot. ECR can be done up to 24 hours from onset (ideally under 6 hours) for some patients, often with thrombolysis.", "cite": [{"src": "STROKE", "loc": "slide 24"}]}, {"id": "ST-17", "type": "mcq", "week": "Stroke lecture", "topic": "Stroke: recognition", "slo": ["SLO1", "SLO2"], "stem": "Which age-related change does the lecture link to a reduced ability to recover from a brain insult?", "options": [{"text": "Reduction in new neuronal growth", "correct": true, "why": "The slide says 'Reduction in new neuronal growth - reduce the ability to recover from insult'."}, {"text": "Increased cerebral blood flow", "why": "The slide says cerebral blood flow DEcreases (more than 25% by the 80s)."}, {"text": "Improved baroreceptor function", "why": "The slide says baroreceptor function decreases."}, {"text": "Growth of new synapses", "why": "The slide describes a loss of synapses."}], "explanation": "Other changes: cerebral amyloidosis (70s), atherosclerosis, neuronal loss and shrinkage, decreased cerebral blood flow and metabolic rate.", "cite": [{"src": "STROKE", "loc": "slide 17"}]}], "guide": [{"id": "g-ausc", "group": "Part B skills", "title": "Lung auscultation", "skill": "auscultation", "match": "auscultat|breath sound|crackle|wheeze|stridor", "summary": "How to listen, where to listen, and what the sounds mean.", "blocks": [{"h": "Set up", "points": [{"text": "Clean the stethoscope, explain and gain consent, keep the patient warm, screen for privacy, hand hygiene.", "cite": [{"src": "AUSC", "loc": "p.2"}]}, {"text": "Best position: sitting in a chair or on the side of the bed; some patients only tolerate lying at 45°. Expose the chest while keeping privacy and dignity.", "cite": [{"src": "AUSC", "loc": "p.2"}, {"src": "L2", "loc": "slide 7"}]}, {"text": "Ask the patient to breathe through their mouth.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-2-preparation-activities-patient-assessment"}]}, {"text": "Bell for high-pitched sounds at the apex above the clavicle; diaphragm for low-pitched sounds over the rest of the chest.", "cite": [{"src": "AUSC", "loc": "p.1"}]}]}, {"h": "Technique", "points": [{"text": "Stepladder approach, anterior 1st to 7th intercostal space, comparing side to side. Listen through a full inspiration and expiration at each point.", "cite": [{"src": "AUSC", "loc": "p.2-3"}]}, {"text": "Posterior: stepladder again, avoiding the scapula (you can't hear through bone). Lateral: arm aside, upper → middle → lower lobe on the right, then upper and lower on the left.", "cite": [{"src": "AUSC", "loc": "p.3"}]}, {"text": "Listen for quality, intensity and adventitious (unexpected) sounds.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-2-preparation-activities-patient-assessment"}]}, {"text": "Finish: replace clothing, explain findings, clean the stethoscope, hand hygiene, and record location, quality and where any abnormal sounds were heard.", "cite": [{"src": "AUSC", "loc": "p.3-4"}]}]}, {"h": "What you hear, and what it can mean", "points": [{"text": "Normal: vesicular (soft, low, most of the lung field); bronchovesicular (1st-2nd ICS beside the sternum, between the scapulae); bronchial (over the manubrium); tracheal (over the trachea).", "cite": [{"src": "AUSC", "loc": "p.4 (Table 1)"}]}, {"text": "Crackles: mostly inspiratory, from small airways. Coarse may indicate pneumonia; fine may suggest pulmonary oedema. Also seen in COPD, fibrosis, infection, heart failure.", "cite": [{"src": "AUSC", "loc": "p.3"}]}, {"text": "Wheeze: often expiratory, musical; high-pitched in asthma. An inspiratory wheeze (stridor) usually means upper airway obstruction.", "cite": [{"src": "AUSC", "loc": "p.3"}]}, {"text": "Rhonchi: continuous low-pitched gurgling, most prominent over the trachea and bronchi. Friction rub: grating or creaking from inflamed pleura, commonly lower anterior and lateral thorax.", "cite": [{"src": "L2", "loc": "slide 10"}]}, {"text": "Absent breath sounds: e.g. pneumothorax, pleural effusion, consolidation.", "cite": [{"src": "AUSC", "loc": "p.3-4"}]}, {"text": "Percussion: resonant = healthy; hyper-resonant = too much air (emphysema, pneumothorax); dull = abnormal density (pneumonia, effusion, tumour).", "cite": [{"src": "L2", "loc": "slide 9"}]}, {"text": "Stridor needs an immediate senior doctor review; a silent chest may mean total peripheral airway obstruction.", "cite": [{"src": "COPD", "loc": "slide 9"}]}]}]}, {"id": "g-ecg", "group": "Part B skills", "title": "ECG lead placement and monitoring", "skill": "ecg", "match": "ECG|electrode|lead|monitor|rhythm|telemetry", "summary": "Electrode positions, preparation, and what monitoring can and can't do.", "blocks": [{"h": "Precordial (chest) leads", "points": [{"text": "V1: 4th intercostal space, RIGHT sternal margin. V2: 4th ICS, LEFT sternal margin.", "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}, {"text": "V4: 5th ICS, mid-clavicular line. V3: midway between V2 and V4.", "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}, {"text": "V5: 5th ICS, anterior axillary line. V6: 5th ICS, mid-axillary line (V5 and V6 at the same level as V4).", "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}]}, {"h": "Limb leads", "points": [{"text": "Slightly proximal to the wrists and ankles, symmetrical, avoiding bony prominences. Inconsistent limb placement changes how the ECG looks.", "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}, {"text": "No standard site (amputation, tremor): use the most distal available point, mirrored on the other side. Avoid torso placement for a diagnostic 12-lead, and document the modified placement on the tracing.", "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}]}, {"h": "The procedure (Lab 3 appraisal form)", "points": [{"text": "Privacy and warmth; remove objects causing electrical interference; person centred on the bed, feet not touching the footboard; clip hair; wipe excess oil; electrodes on clean, dry, hair-free skin; ask them to stay still and relaxed; record; remove electrodes and clean skin.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "After: document the procedure, assessment data and ECG interpretation; initiate nursing interventions; report abnormalities.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}]}, {"h": "Monitoring vs 12-lead", "points": [{"text": "Continuous monitoring (hardwire or telemetry, usually 3 or 5 electrodes) watches rhythm but does not diagnose. Record a 12-lead when a diagnosis is needed.", "cite": [{"src": "CANVAS", "loc": "page 3-dot-3-cardiac-monitoring-and-telemetry"}]}, {"text": "Hardwire: movement limited to cable reach. Telemetry: the patient can walk around the ward. Each hardwire disconnection is unwatched time, so plan toileting and transfers.", "cite": [{"src": "CANVAS", "loc": "page 3-dot-3-cardiac-monitoring-and-telemetry"}]}, {"text": "Monitoring form: select Lead 2, set alarm settings, print a rhythm strip, document the rhythm.", "cite": [{"src": "LAB3PKG", "loc": "p.22"}]}]}]}, {"id": "g-o2", "group": "Part B skills", "title": "Oxygen therapy and devices", "skill": "oxygen", "match": "oxygen|SpO2|FiO2|mask|prong|cannula|Venturi|hypercap", "summary": "Prescription, targets, devices and escalation triggers.", "blocks": [{"h": "Principles (TSANZ 2022)", "points": [{"text": "Oxygen is a drug and needs a prescription: flow rate, delivery device, SpO2 target with upper and lower limits, and criteria for deterioration and improvement.", "cite": [{"src": "TSANZ", "loc": "p.2 (Table 1)"}]}, {"text": "Targets: 88-92% where there is potential for hypercapnia (chronic respiratory disease, e.g. COPD), i.e. give O2 when SpO2 < 88%. Otherwise 92-96%, i.e. give O2 when SpO2 < 92%.", "cite": [{"src": "TSANZ", "loc": "p.2 (Table 1)"}]}, {"text": "Nasal cannulae are preferred in most situations for ease and practicality.", "cite": [{"src": "TSANZ", "loc": "p.2 (Table 1)"}]}, {"text": "Needing high FiO2 means serious illness: senior clinician review if FiO2 ≥ 0.40 or ≥ 6 L/min via simple face mask is needed to keep the target; ICU review if FiO2 ≥ 0.50 or ≥ 8 L/min.", "cite": [{"src": "TSANZ", "loc": "p.2 (Table 1)"}]}, {"text": "Stable saturations on more oxygen is deterioration.", "cite": [{"src": "L3", "loc": "p.15"}]}]}, {"h": "Devices", "points": [{"text": "Nasal prongs: 1-4 L (93225 Canvas; above 4 L needs humidification, which standard prongs can't provide). Section 12.5: 24-44% at 1-6 L/min.", "cite": [{"src": "CANVAS", "loc": "page 2-dot-2-preparation-activities-respiratory-nursing-skills"}, {"src": "S125", "loc": "p.21"}]}, {"text": "Hudson (simple face) mask: 5-10 L (Canvas). Section 12.5: 40-60% at 5-8 L/min, and at least 5 L/min to prevent rebreathing CO2.", "cite": [{"src": "CANVAS", "loc": "page 2-dot-2-preparation-activities-respiratory-nursing-skills"}, {"src": "S125", "loc": "p.24"}]}, {"text": "Non-rebreather: 95-100% at 10-15 L/min. Inflate the reservoir before it goes on the face, and keep the flow high enough that the bag stays inflated.", "cite": [{"src": "S125", "loc": "p.25-26"}, {"src": "O2CHK", "loc": "p.2"}, {"src": "WB2", "loc": "p.~4"}]}, {"text": "Venturi: controlled FiO2, 24-50% at 4-10 L/min (e.g. blue 24% at 4 L/min; green 35% at 8 L/min). Turn the barrel to the ordered concentration and set the matching flow.", "cite": [{"src": "S125", "loc": "p.26-27"}, {"src": "O2CHK", "loc": "p.3"}]}]}, {"h": "Every device, every time", "points": [{"text": "Semi-Fowler's if possible; apply the mask from the nose downwards; pad ears and bony prominences; pulse oximetry with low and high alarms; check skin for dampness or chafing; document; tell the treating doctor about changes.", "cite": [{"src": "O2CHK", "loc": "p.1-3"}]}]}], "context": []}, {"id": "g-neb", "group": "Part B skills", "title": "Nebuliser and inhaled medicines", "skill": "nebuliser", "match": "nebul|inhal|spacer|puffer|salbutamol|relieve|preventer|MDI", "summary": "When a nebuliser is used, the procedure, flows and safety.", "blocks": [{"h": "Why and when", "points": [{"text": "A nebuliser turns liquid medication into a mist, inhaled via a mask or mouthpiece. For most people a puffer and spacer works as well and is more convenient.", "cite": [{"src": "S126", "loc": "p.2, p.11"}]}, {"text": "Still used when the person can't use an inhaler (confusion, hand problems), has lots of mucus (the humidification helps), or is really struggling to breathe.", "cite": [{"src": "S126", "loc": "p.11"}]}, {"text": "Relievers (e.g. salbutamol) relax airway muscle. Preventers (corticosteroids, e.g. fluticasone, budesonide) reduce swelling and mucus.", "cite": [{"src": "S126", "loc": "p.3-4"}]}]}, {"h": "Procedure essentials", "points": [{"text": "Before: respiratory assessment (at minimum auscultate, so you can compare after). Check a valid medication order; six rights; identity (full name, DOB) and allergies; consent; sit upright.", "cite": [{"src": "S126", "loc": "p.12-15"}]}, {"text": "Connect the tubing to the chamber before adding the liquid (avoids spillage); add medication, close the chamber, attach the mask or mouthpiece; breathe normally; about 5-10 minutes.", "cite": [{"src": "S126", "loc": "p.15-16"}]}, {"text": "Flow: set 6-8 L/min. Too high (above 10 L/min) delivers the medication too fast and may pop the connection off.", "cite": [{"src": "L2", "loc": "slide 16"}]}, {"text": "If oxygen drives it instead of the compressor, always monitor SpO2.", "cite": [{"src": "S126", "loc": "p.16"}]}, {"text": "After: reassess breathing, RR and auscultate; rinse the chamber; document, including breath sounds before and after; stop and escalate if the person deteriorates.", "cite": [{"src": "S126", "loc": "p.17-18"}, {"src": "WB2", "loc": "p.~7"}]}]}, {"h": "Driving gas (sources differ)", "points": [{"text": "COPD / chronic respiratory failure: MDI and spacer preferred; if a nebuliser is necessary it should be air-driven, with oxygen continued via nasal cannulae.", "cite": [{"src": "TSANZ", "loc": "p.2 (Table 1)"}]}, {"text": "Life-threatening acute asthma (Asthma Handbook figure in the FNP2B tutorial): oxygen drives continuous salbutamol nebulisation.", "cite": [{"src": "ASTHMA", "loc": "slide 15"}]}]}]}, {"id": "g-agh", "group": "Assessment", "title": "A–G (+H) and focused assessment", "match": "A-G|A–H|A-H|assessment|holistic", "summary": "The structured approach behind Part A reasoning questions.", "blocks": [{"h": "Why it matters", "points": [{"text": "Know what normal is so you can identify abnormal, however subtle the change.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-1-look-listen-feel-interpret-this-is-must-know-stuff"}]}, {"text": "Admission assessment: history, general appearance, examination, vital signs on admission. Shift assessment: at the start of each shift or when the condition changes. Focused assessment: detailed assessment of the system(s) related to the presenting problem, usually combined with others.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-1-look-listen-feel-interpret-this-is-must-know-stuff"}]}, {"text": "The A-G (+H) table is the GATHER part of the 'collect cues' stage of the Clinical Reasoning Cycle.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-2-preparation-activities-patient-assessment"}]}]}, {"h": "A-H table, Year 2 level (Look / Listen / Feel / Tests)", "points": [{"text": "A Airway. Look: signs of obstruction, tracheal tug, swelling/haematoma. Listen: noisy breathing (gurgling, snoring, stridor); does speech sound normal or obstructed? Feel: air movement.", "cite": [{"src": "AH", "loc": "p.1 (A-H Yr2 table, image; transcribed visually)"}]}, {"text": "B Breathing. Look: chest movement and symmetry, accessory muscles, RR for 1 minute. Listen: can they complete full sentences? Noisy breathing (stridor, wheezing); chest pain. Feel: trachea central, surgical emphysema/crepitus, diaphoresis. Tests: SpO2, O2 requirements and delivery mode, PQRST.", "cite": [{"src": "AH", "loc": "p.1 (A-H Yr2 table, image; transcribed visually)"}]}, {"text": "C Circulation. Look: pallor or cyanosis (peripheral, oral mucosa), capillary refill, JVP. Listen: dizziness, headache, chest pain; manual BP. Feel: warm or cold hands and feet, oedema, pulses (presence, rate, quality, regularity, equality). Tests: manual BP, ECG, PQRST, conscious state, fluid balance, urine.", "cite": [{"src": "AH", "loc": "p.1 (A-H Yr2 table, image; transcribed visually)"}]}, {"text": "D Disability. Look: level of consciousness, facial symmetry, abnormal movements, seizure activity, limb movements, pupil size, equality and reaction to light. Listen: response to stimuli, pain, slurred speech, orientation to person, place and time. Feel: response to stimuli, muscle power and strength. Tests: LOC (GCS, AVPU), pain scale, mobility and falls risk.", "cite": [{"src": "AH", "loc": "p.1 (A-H Yr2 table, image; transcribed visually)"}]}, {"text": "E Exposure: bleeding, rash, contusion, skin integrity, wounds and drains hidden by bed clothes; air leaks in drains; bowel sounds; abdomen; temperature and pressure injury risk. F Fluids: observation and fluid charts, input and output, drain losses, urine amount and colour, urinalysis; thirst; skin turgor; IV access. G Glucose: BGL, signs of low or high glucose, insulin/hypoglycaemics on the chart; thirst; orientation; sweaty, cold or clammy skin. H Holistic: visitors and support system, psychosocial history, ask about psychosocial aspects of care.", "cite": [{"src": "AH", "loc": "p.1 (A-H Yr2 table, image; transcribed visually)"}]}]}, {"h": "H: holistic care", "points": [{"text": "Look: support people, non-verbal cues, documented psychosocial concerns. Listen: what matters most, goals, language or health literacy needs. Feel: empathic presence. Consider: social determinants, goals of care and advance care plan, cultural and spiritual needs, functional baseline, carer communication.", "cite": [{"src": "L1", "loc": "p.25"}]}]}, {"h": "Respiratory history questions", "points": [{"text": "Previous admissions or ICU/intubation for breathing; asthma/COPD and last exacerbation; smoking or vaping amount; regular puffers and how often; current cough/cold/flu; breathless on movement or at rest; sleeping on more pillows.", "cite": [{"src": "L2", "loc": "slide 6"}]}, {"text": "Inspection: RR for a full minute (depth, rhythm, symmetry), accessory muscles (tracheal tug, subcostal/intercostal recession), pursed-lip breathing, bruising or lumps.", "cite": [{"src": "L2", "loc": "slide 7"}]}]}]}, {"id": "g-neuro", "group": "Assessment", "title": "Neurological assessment: AVPU, GCS, limbs", "match": "GCS|AVPU|neuro|limb|pupil|conscious|cranial", "summary": "Level of consciousness and the focused neuro assessment.", "blocks": [{"h": "Focused neuro assessment", "points": [{"text": "Done with other assessments, and at minimum with vital signs, because most vital-sign changes are a sign of end-stage neurological injury. Assess LOC, limb strength, pupillary response and cranial nerves as applicable.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-2-preparation-activities-patient-assessment"}]}, {"text": "Non-neuro patients need it too, e.g. pneumonia with hypoxia, or post-op blood loss.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-2-preparation-activities-patient-assessment"}]}]}, {"h": "AVPU and GCS", "points": [{"text": "AVPU: Alert (eyes open spontaneously); Verbal (eyes open to a verbal stimulus); Pain (responds only to painful stimuli); Unresponsive.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-2-preparation-activities-patient-assessment"}]}, {"text": "Limb strength comes after the GCS; score each limb separately, upper to lower, proximal to distal.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-2-preparation-activities-patient-assessment"}]}, {"text": "GCS: eyes 4/3/2/1 (spontaneous, to speech, to pain, none); verbal 5-1 (orientated, confused, inappropriate words, incomprehensible sounds, none); motor 6-1 (obeys, localises, withdraws, flexion, extension, none). Rate the highest response. A 1-point drop → clinical review; a 2-point drop → rapid response.", "cite": [{"src": "LAB1PKG", "loc": "p.8"}, {"src": "STROKE", "loc": "slide 21"}]}]}]}, {"id": "g-rhythm", "group": "Assessment", "title": "Rhythm interpretation (flow chart)", "match": "rhythm|fibrillation|tachycardia|heart block|asystole|sinus|flutter", "summary": "The Module 3 rhythm analysis flow chart, step by step.", "blocks": [{"h": "Work through the questions in order", "points": [{"text": "1. Can upright, smooth, rounded P waves be clearly seen? YES → 2. Is every P wave followed by a QRS in a 1:1 ratio?", "cite": [{"src": "RHYTHM", "loc": "p.1 (flow chart, image; transcribed visually)"}]}, {"text": "P waves, 1:1: is the PR interval ≤ 0.2 s? YES → sinus: HR < 60 sinus bradycardia; 60-100 sinus rhythm; > 100 sinus tachycardia (QRS > 0.1 s means aberrant conduction). NO → 1st-degree heart block.", "cite": [{"src": "RHYTHM", "loc": "p.1 (flow chart, image; transcribed visually)"}]}, {"text": "P waves, not 1:1: are the QRS complexes > 0.1 s wide? YES → 3rd-degree heart block. NO → are the PR intervals all the same length? NO → 2nd-degree type 1; YES → 2nd-degree type 2.", "cite": [{"src": "RHYTHM", "loc": "p.1 (flow chart, image; transcribed visually)"}]}, {"text": "No clear P waves: can narrow or broad QRS complexes be clearly seen? NO → any electrical activity? YES → ventricular fibrillation; NO → asystole.", "cite": [{"src": "RHYTHM", "loc": "p.1 (flow chart, image; transcribed visually)"}]}, {"text": "QRS seen and ≤ 0.1 s (narrow). Irregular: saw-tooth flutter waves → atrial flutter (variable block), otherwise atrial fibrillation. Regular: flutter waves → atrial flutter (fixed block); otherwise rate > 100 → atrial tachycardia / SVT / junctional tachycardia (by P-wave shape), ≤ 100 → junctional rhythms (< 40 junctional bradycardia, 40-60 junctional, 60-100 accelerated junctional).", "cite": [{"src": "RHYTHM", "loc": "p.1 (flow chart, image; transcribed visually)"}]}, {"text": "QRS > 0.1 s (broad). Irregular → AF with aberration. Regular: rate > 100 → ventricular tachycardia OR SVT with aberration; ≤ 100 → idioventricular rhythm.", "cite": [{"src": "RHYTHM", "loc": "p.1 (flow chart, image; transcribed visually)"}]}, {"text": "The chart does not account for atrial or ventricular ectopics, which can make a rhythm irregular. Report them as an event on top of the rhythm (e.g. sinus rhythm with atrial ectopics).", "cite": [{"src": "RHYTHM", "loc": "p.1 (flow chart, image; transcribed visually)"}]}]}, {"h": "Life-threatening rhythms and the response", "points": [{"text": "Second-year students should identify normal sinus rhythm and the life-threatening rhythms VT, VF and asystole.", "cite": [{"src": "ACS", "loc": "slide 25"}]}, {"text": "VF: no real rate, grossly irregular, no identifiable P waves → immediate cardioversion/defibrillation. VT: rate 100-250, regular, QRS ≥ 0.12 s and bizarre.", "cite": [{"src": "ACS", "loc": "slides 30-31"}]}, {"text": "Unresponsive and not breathing normally → start CPR and follow DRSABCD; don't check for a pulse.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}]}]}, {"id": "g-bls", "group": "Assessment", "title": "Basic life support", "match": "BLS|life support|CPR|airway|bag|arrest|DRSABCD", "summary": "Recognising arrest and the BLS response.", "blocks": [{"h": "Key points", "points": [{"text": "Start CPR when a person is unresponsive and not breathing normally. No pulse check: pulse checks are not part of BLS and are unreliable.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}, {"text": "Agonal gasps (slow, laboured, irregular) are NOT breathing, and gasping indicates cardiac arrest.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}, {"text": "Respiratory arrest (cardiac output at first) and cardiac arrest (no output) get the same BLS response: DRSABCD.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}, {"text": "On day one of every placement, find out: the emergency number, what to say, where the resus trolley and AED are, whether there is a rapid response/MET call, and where the emergency buttons are.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}]}, {"h": "Airway adjuncts and bag-valve-mask", "points": [{"text": "OPA: indicated when unresponsive with soft-tissue obstruction despite manual positioning; contraindicated with any gag or cough reflex. Size it, never force it, and confirm chest rise. It does not replace head tilt-chin lift.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}, {"text": "NPA: avoid if basal skull fracture is suspected; an oral airway is preferred.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}, {"text": "BVM: high-flow oxygen at 15 L/min with the reservoir attached. It needs a patent airway, an adequate seal and good technique; two rescuers are recommended; the main hazard is gastric inflation and regurgitation.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}]}]}, {"id": "g-asthma", "group": "Conditions", "title": "Asthma", "match": "asthma", "summary": "Severity, oxygen, bronchodilators and self-management.", "blocks": [{"h": "Assessment and severity", "points": [{"text": "Severe: any of unable to speak in sentences, visibly breathless, increased work of breathing, SpO2 90-94%. Life-threatening: drowsy, collapsed, exhausted, cyanotic, poor respiratory effort, soft/absent breath sounds, SpO2 < 90%.", "cite": [{"src": "ASTHMA", "loc": "slides 15-16"}]}, {"text": "Auscultation: high-pitched musical wheeze, often more evident on expiration.", "cite": [{"src": "AUSC", "loc": "p.3"}]}]}, {"h": "Treatment and escalation", "points": [{"text": "Salbutamol (reliever) via pMDI and spacer; in life-threatening asthma, continuous nebulisation driven by oxygen, immediate transfer to higher-level care, notify senior staff; IV magnesium sulfate if poor response.", "cite": [{"src": "ASTHMA", "loc": "slides 15-16, 18"}, {"src": "S126", "loc": "p.3-4"}]}, {"text": "FNP2B doctor's notes: give O2 if SpO2 < 92% (adults) or < 95% (children); salbutamol only hourly on the ward, with ICU review if more is needed; observe at least 3 hours after distress resolves.", "cite": [{"src": "ASTHMA", "loc": "slide 18"}]}]}, {"h": "Self-management", "points": [{"text": "A written asthma action plan says when and how to increase treatment, for how long, and when to seek urgent help. Teach inhaler technique, adherence and trigger avoidance, and review every 6 months.", "cite": [{"src": "ASTHMA", "loc": "slides 23-26"}]}, {"text": "Puffer technique: cap off and upright, shake, breathe out gently, seal lips, press as you start a slow deep breath, hold about 5 seconds. Clean spacers about monthly.", "cite": [{"src": "S126", "loc": "p.5-7"}]}]}]}, {"id": "g-copd", "group": "Conditions", "title": "COPD", "match": "COPD|hypercap|chronic obstructive", "summary": "Oxygen targets, bronchodilator delivery and long-term care.", "blocks": [{"h": "Key points", "points": [{"text": "SpO2 target 88-92% where there is potential for hypercapnia; give O2 when SpO2 < 88%.", "cite": [{"src": "TSANZ", "loc": "p.2 (Table 1)"}]}, {"text": "Bronchodilators by MDI and spacer; if nebulised, air-driven with oxygen via nasal cannulae.", "cite": [{"src": "TSANZ", "loc": "p.2 (Table 1)"}]}, {"text": "Percussion may be hyper-resonant (too much air, e.g. emphysema). Crackles can occur in COPD.", "cite": [{"src": "L2", "loc": "slide 9"}, {"src": "AUSC", "loc": "p.3"}]}, {"text": "Stable COPD: stepwise inhaled therapy starting with short-acting relievers (SABA or SAMA); smoking cessation, influenza and pneumococcal vaccines, pulmonary rehabilitation for symptomatic patients; check inhaler technique at every visit.", "cite": [{"src": "COPD", "loc": "slide 29"}]}, {"text": "Person-centred: social history (home, carer role, finances, access to GP and pharmacy, living with a smoker), health literacy, and discharge planning from admission.", "cite": [{"src": "COPD", "loc": "slides 25-27"}]}]}]}, {"id": "g-pneu", "group": "Conditions", "title": "Pneumonia", "match": "pneumonia|sputum|consolidat", "summary": "Signs, auscultation findings and specimens.", "blocks": [{"h": "Key points", "points": [{"text": "Coarse crackles may indicate pneumonia; percussion over consolidation is dull.", "cite": [{"src": "AUSC", "loc": "p.3"}, {"src": "L2", "loc": "slide 9"}]}, {"text": "Symptom diagram (FNP2B): high fever and chills, cough with sputum, shortness of breath, pleuritic chest pain, high heart rate, low blood pressure, nausea and vomiting, fatigue.", "cite": [{"src": "COPD", "loc": "slide 13"}]}, {"text": "Sputum collection: confirm identity and the request, consent, PPE, sterile labelled container, deep breathing and coughing (or suction), avoid contaminating the container, label, send promptly, document.", "cite": [{"src": "WB2", "loc": "p.~6"}]}]}]}, {"id": "g-cardfind", "group": "Conditions", "title": "Cardiac findings and escalation", "match": "escalat|deteriorat|urine|oedema|pulse|ISBAR|weight", "summary": "Finding → what it might mean → nursing response → escalate?", "blocks": [{"h": "Findings that should worry you", "points": [{"text": "New fast or irregular pulse: manual radial pulse; if irregular, count apically for a full minute (a radial count undercounts); BP, 12-lead ECG, monitoring, conscious state. Escalate immediately if hypotensive, chest pain, breathless or altered consciousness.", "cite": [{"src": "L3", "loc": "p.10"}]}, {"text": "Reduced urine output: escalate if under 100 mL over 4 hours (or under 0.5 mL/kg/hr via an IDC), or if it falls alongside a dropping BP.", "cite": [{"src": "L3", "loc": "p.10"}]}, {"text": "New peripheral oedema: bilateral and dependent fits cardiac; unilateral with warmth or calf pain needs a DVT assessment. Escalate if rapid onset or with breathlessness.", "cite": [{"src": "L3", "loc": "p.11"}]}, {"text": "Increased breathlessness: sit upright, full vital signs, listen to the chest, fluid balance and weight trend, O2 if indicated. Escalate if SpO2 is falling, RR is rising, breathless at rest, or unable to speak in sentences.", "cite": [{"src": "L3", "loc": "p.13"}]}, {"text": "'I just don't feel right' is often the first sign of deterioration in a cardiac patient: do a full A-H with vital signs before you reassure.", "cite": [{"src": "L3", "loc": "p.14"}]}, {"text": "Daily charts: escalate if weight is up more than 2 kg in 3 days, doses are repeatedly withheld or PRN GTN use is increasing, or potassium/renal function shifts after a diuretic change.", "cite": [{"src": "L3", "loc": "p.15"}]}]}, {"h": "Escalating", "points": [{"text": "ISBAR: Identify, Situation, Background, Assessment (your A-H findings), Recommendation (what you want and by when). Document the actual numbers, not 'obs satisfactory', plus what you did, who you told and when you will reassess.", "cite": [{"src": "L3", "loc": "p.16"}]}]}]}, {"id": "g-acs", "group": "Conditions", "title": "Acute coronary syndrome", "match": "ACS|STEMI|chest pain|troponin|PCI|GTN|angina", "summary": "Recognition, first 10 minutes, and care after PCI.", "blocks": [{"h": "Recognition", "points": [{"text": "UA: new, worsening or rest pain, troponin not raised. NSTEMI: troponin raised, no ST elevation. STEMI: ST elevation on the 12-lead; don't delay reperfusion waiting for troponin.", "cite": [{"src": "L3", "loc": "p.20"}]}, {"text": "Women, older adults and people with diabetes more often present without chest pain (fatigue, breathlessness, nausea, jaw/back discomfort). If the patient is at risk, do the ECG anyway.", "cite": [{"src": "L3", "loc": "p.21"}]}, {"text": "The ECG answers 'is there ischaemia'; troponin answers 'has muscle died'. Record the actual collection time. Raised troponin doesn't always mean ACS; normal troponin doesn't rule out infarct.", "cite": [{"src": "L3", "loc": "p.26"}]}]}, {"h": "Immediate nursing response", "points": [{"text": "Treat chest pain as possible ACS: full vital signs, PQRST pain assessment, 12-lead ECG within 10 minutes, IV access; escalate every time. One normal ECG doesn't exclude ACS: repeat it.", "cite": [{"src": "L3", "loc": "p.12"}]}, {"text": "Oxygen: consider if dyspnoeic; titrate to SpO2 over 93% (88-92% if at risk of hypercapnia). Not required in stable patients with SpO2 ≥ 93% (PACSA).", "cite": [{"src": "L3", "loc": "p.12, p.27"}]}, {"text": "Do not give GTN after recent PDE5 inhibitors (e.g. sildenafil within 24 h, tadalafil 48 h) or in known severe anaemia. Students do not administer under the ECAT protocol.", "cite": [{"src": "L3", "loc": "p.27"}]}]}, {"h": "After angiogram or PCI", "points": [{"text": "Baseline neurovascular observations before, and compare after. Radial: increasing forearm pain, swelling or tightness is compartment syndrome, so escalate immediately. Femoral: back or flank pain with hypotension suggests retroperitoneal bleeding.", "cite": [{"src": "L3", "loc": "p.28, p.30"}]}, {"text": "Bleeding or swelling at the site: direct pressure above the puncture point, someone else calls for help, mark and time the swelling edge, full vital signs.", "cite": [{"src": "L3", "loc": "p.12"}]}, {"text": "Never omit a dose of dual antiplatelet therapy (it risks the stent). Watch for arrhythmia, heart failure, cardiogenic shock, recurrent ischaemia and bleeding.", "cite": [{"src": "L3", "loc": "p.30, p.32"}]}]}]}, {"id": "g-hf", "group": "Conditions", "title": "Heart failure", "match": "heart failure|diuretic|fluid balance|HFrEF", "summary": "Daily nursing work, medication safety, going home.", "blocks": [{"h": "Daily nursing", "points": [{"text": "Fluid and sodium restriction where prescribed; fluid balance including urine output and diuretic response; daily weight; respiratory status, lung sounds, oedema, JVP; sit upright to ease breathing.", "cite": [{"src": "L3", "loc": "p.35"}]}, {"text": "Daily weight: same time, same scales, same clothing, before breakfast.", "cite": [{"src": "L3", "loc": "p.15"}]}, {"text": "Document mobility specifically; pace care; falls risk (postural drop after diuretics); poor appetite can signal gut congestion.", "cite": [{"src": "L3", "loc": "p.35"}]}]}, {"h": "Medication safety", "points": [{"text": "Diuretics. Before: BP, weight, fluid balance, electrolytes and renal function. After: urine output, postural BP, weight, potassium, magnesium.", "cite": [{"src": "L3", "loc": "p.34"}]}, {"text": "HFrEF 'four pillars': beta blocker, ACE inhibitor/ARNI, MRA (spironolactone), SGLT2 inhibitor. Check HR, BP, potassium and renal function first; if low BP or pulse, or rising potassium or creatinine, ask the MO. Don't just withhold.", "cite": [{"src": "L3", "loc": "p.34"}]}]}, {"h": "Going home", "points": [{"text": "Weigh every morning; call the HF nurse or GP if weight goes up about 2 kg in two days or symptoms worsen; call 000 for chest pain or breathlessness at rest. Take the fluid tablet in the morning. Check understanding with teach-back.", "cite": [{"src": "L3", "loc": "p.37"}]}, {"text": "Refer to cardiac rehabilitation before discharge, and arrange written follow-up and allied health.", "cite": [{"src": "L3", "loc": "p.37"}]}]}]}, {"id": "g-stroke", "group": "Conditions", "title": "Stroke", "match": "stroke|TIA|swallow|ASSIST|NIHSS|dysphagia|NGT", "summary": "Diagnosis, nursing care and swallow safety.", "blocks": [{"h": "Types and diagnosis", "points": [{"text": "Haemorrhagic, ischaemic, TIA. Diagnosed with CT angiography, NIHSS (measures stroke severity), FAST positive, MRI brain.", "cite": [{"src": "L4", "loc": "p.5-6"}]}, {"text": "Thrombolysis up to 4.5 h after onset (contraindicated in haemorrhagic stroke or anticoagulants within 48 h); clot retrieval up to 24 h (ideally < 6 h).", "cite": [{"src": "STROKE", "loc": "slides 23-25"}]}]}, {"h": "Nursing considerations (Lecture 4)", "points": [{"text": "Regular neuro assessments; NBM until swallowing is assessed as safe; head of bed at 30°; manage BP (particularly severe systolic hypertension), BGL and temperature.", "cite": [{"src": "L4", "loc": "p.11"}]}, {"text": "Pressure injury prevention and a Waterlow assessment; DVT prophylaxis as prescribed; falls risk screening; NGT care.", "cite": [{"src": "L4", "loc": "p.11"}]}]}, {"h": "Swallow screening (ASSIST)", "points": [{"text": "ASSIST is a validated bedside swallow screen, only for adults with suspected or confirmed acute stroke/TIA. About 27-64% of stroke patients have dysphagia.", "cite": [{"src": "CANVAS", "loc": "page 4-dot-3-assist-screening-tool"}]}, {"text": "It is an accredited skill: students are not accredited to perform it on placement. Patients who don't pass stay NBM and are referred to speech pathology.", "cite": [{"src": "CANVAS", "loc": "page 4-dot-3-assist-screening-tool"}]}, {"text": "NGT: never use auscultation to confirm tube position.", "cite": [{"src": "NGTPOL", "loc": "p.13"}]}]}]}]};
</script>
<script>
"use strict";
/* ---------- data & storage ---------- */
const C = CONTENT || {meta:{title:"Assessment 2 Reviewer",status:"No content built. Run tools/build_reviewer.py."},sources:{},slos:{},skills:[],questions:[],gaps:[],context:[]};
const KEY = "na2-reviewer-v1";
let mem = {};
function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : {}; }catch(e){ return mem; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){ mem = P; } }
const P = Object.assign({items:{}, skills:{}, mocks:[], theme:null, mockA:null, mockB:null, includeSupp:true}, load());

/* Items citing a "supp" source come from outside the 93225 Modules; they are badged and can be excluded. */
const isSuppCite = cites => (cites||[]).some(c => (C.sources[c.src]||{}).set === "supp");
const isSupp = q => isSuppCite(q.cite) || (q.rubric||[]).some(r => isSuppCite(r.cite));
const suppTag = `<span class="tag supp" title="From slides outside the 93225 Modules">Supplementary</span>`;
const QALL = C.questions || [];
let Q = [];
function applySupp(){ Q = QALL.filter(q => P.includeSupp || !isSupp(q)); }
applySupp();
const QBY = Object.fromEntries(QALL.map(q => [q.id, q]));
const SK = C.skills || [];
const GUIDE = C.guide || [];
const SKBY = Object.fromEntries(SK.map(s => [s.id, s]));
/* A skill may have several versions (e.g. one checklist per oxygen device); s.steps always holds the selected one. */
function useVariant(s, v){ if(s.variants && s.variants.length){ s.v = Math.max(0, Math.min(v||0, s.variants.length-1)); s.steps = s.variants[s.v].steps; s.vcite = s.variants[s.v].cite; } }
function allSteps(s){ return s.variants ? s.variants.flatMap(v => v.steps) : (s.steps||[]); }
SK.forEach(s => useVariant(s, 0));

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function uniq(a){ return [...new Set(a)].filter(v => v !== undefined && v !== null && v !== ""); }
function citeText(cites){
  return (cites||[]).map(c => {
    const s = C.sources[c.src] || {};
    if(c.src === "CANVAS"){ // Canvas page slugs -> "93225 Canvas: 3.2 introduction to performing an ecg"
      const page = String(c.loc||"").replace(/^page\s+/, "").replace(/-dot-/g, ".").replace(/-\|-/g, " ").replace(/-/g, " ");
      return esc("93225 Canvas page: " + page);
    }
    return esc((s.file || c.src) + (c.loc ? ", " + c.loc : ""));
  }).join("; ");
}
function citeHTML(cites){ return cites && cites.length ? `<div class="cite">${citeText(cites)}</div>` : ""; }
function pct(x){ return Math.round(x*100) + "%"; }
function record(id, score){
  const r = P.items[id] || {n:0, sum:0};
  r.n++; r.sum += score; r.last = score; r.ts = Date.now();
  P.items[id] = r; save();
}
function isWeak(id){ const r = P.items[id]; return !!r && r.last < 0.6; }
function fmt(ms){ ms = Math.max(0, ms); const s = Math.round(ms/1000); return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }
/* In-page confirmation: embedded viewers block confirm()/alert(), so ask next to the button instead. */
function askFirst(btn, question, onYes){
  const old = btn.parentNode.querySelector(".ask"); if(old) old.remove();
  const box = document.createElement("span");
  box.className = "ask row";
  box.innerHTML = `<b>${esc(question)}</b> <button class="primary">Yes</button> <button>No</button>`;
  const [yes, no] = box.querySelectorAll("button");
  yes.onclick = () => { box.remove(); onYes(); };
  no.onclick = () => box.remove();
  btn.insertAdjacentElement("afterend", box);
}
function beep(){ try{ const a = new (window.AudioContext||window.webkitAudioContext)(); const o = a.createOscillator(); o.connect(a.destination); o.frequency.value = 880; o.start(); setTimeout(()=>{o.stop(); a.close();}, 600); }catch(e){} }

/* ---------- theme ---------- */
function applyTheme(){ if(P.theme) document.documentElement.setAttribute("data-theme", P.theme); else document.documentElement.removeAttribute("data-theme"); }
$("#themeBtn").onclick = () => {
  const dark = P.theme ? P.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  P.theme = dark ? "light" : "dark"; save(); applyTheme();
};
applyTheme();

/* ---------- tabs ---------- */
let tab = "home";
let timerHandle = null;
function go(t){
  tab = t;
  stopTimer();
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  ({home:renderHome, guide:renderGuide, quiz:renderQuizSetup, skills:renderSkills, mock:renderMock, cards:renderCards, search:renderSearch, sources:renderSources}[t])();
  window.scrollTo(0,0);
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => go(b.dataset.tab));
document.title = $("#appTitle").textContent = C.meta.title || "Assessment 2 Reviewer";

function banner(){ return C.meta.status ? `<div class="banner">${esc(C.meta.status)}</div>` : ""; }
function suppToggle(){
  const n = QALL.filter(isSupp).length;
  return n ? `<label><input type="checkbox" id="suppT" ${P.includeSupp?"checked":""}> Include supplementary items (${n} from slides outside the 93225 Modules)</label>` : "";
}
function bindSuppToggle(rerender){
  const t = $("#suppT"); if(!t) return;
  t.onchange = () => { P.includeSupp = t.checked; save(); applySupp(); rerender(); };
}
function contextNote(id){ const c = (C.context||[]).find(x => x.id === id); return c ? `<div class="ctx small"><b>${esc(c.label)}:</b> ${esc(c.text)}</div>` : ""; }

/* ---------- home ---------- */
function renderHome(){
  const attempted = Q.filter(q => P.items[q.id]);
  const acc = attempted.length ? attempted.reduce((s,q)=>s+P.items[q.id].last,0)/attempted.length : 0;
  const weak = Q.filter(q => isWeak(q.id)).length;
  const topics = uniq(Q.map(q => q.topic));
  const rows = topics.map(t => {
    const qs = Q.filter(q => q.topic === t), done = qs.filter(q => P.items[q.id]);
    const a = done.length ? done.reduce((s,q)=>s+P.items[q.id].last,0)/done.length : null;
    return `<tr><td>${esc(t)}</td><td>${qs.length}</td><td>${done.length}</td><td>${a===null?"–":pct(a)}</td></tr>`;
  }).join("");
  const skillRows = SK.map(s => { const r = P.skills[s.id] || {}; return `<tr><td>${esc(s.name)}</td><td>${allSteps(s).length ? allSteps(s).length + (s.variants ? ` (${s.variants.length} versions)` : "") : "not loaded"}</td><td>${r.order?pct(r.order):"–"}</td><td>${r.reps||0}</td></tr>`; }).join("");
  const mocks = (P.mocks||[]).slice(-5).reverse().map(m => `<tr><td>${new Date(m.ts).toLocaleString("en-AU")}</td><td>${esc(m.kind)}</td><td>${esc(m.result)}</td></tr>`).join("");
  $("#main").innerHTML = `${banner()}
  <div class="card"><div class="grid">
    <div><div class="muted small">Questions</div><div class="big">${Q.length}</div></div>
    <div><div class="muted small">Attempted</div><div class="big">${attempted.length}</div></div>
    <div><div class="muted small">Latest accuracy</div><div class="big">${attempted.length?pct(acc):"–"}</div></div>
    <div><div class="muted small">Weak items</div><div class="big">${weak}</div></div>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="primary" id="hQuiz">Practise Part A</button>
    <button id="hWeak" ${weak?"":"disabled"}>Drill weak areas</button>
    <button id="hSkills">Part B skills</button>
    <button id="hMock">Mock exam</button>
  </div></div>
  <div class="card"><h2 class="big" style="margin-top:0">By topic</h2>
    ${rows ? `<table><tr><th>Topic</th><th>Items</th><th>Done</th><th>Latest</th></tr>${rows}</table>` : `<p class="muted">No questions yet.</p>`}</div>
  <div class="card"><h2 class="big" style="margin-top:0">Skills</h2>
    <table><tr><th>Skill</th><th>Steps</th><th>Best order drill</th><th>Rehearsals</th></tr>${skillRows}</table></div>
  ${mocks ? `<div class="card"><h2 class="big" style="margin-top:0">Recent mocks</h2><table>${mocks}</table></div>` : ""}
  <div class="card noprint">${suppToggle()}<div class="row" style="margin-top:10px"><button id="hReset">Reset all progress</button> <span class="muted small">Progress is saved in this browser only.</span></div></div>`;
  bindSuppToggle(renderHome);
  $("#hQuiz").onclick = () => go("quiz");
  $("#hWeak").onclick = () => startQuiz({weak:true});
  $("#hSkills").onclick = () => go("skills");
  $("#hMock").onclick = () => go("mock");
  $("#hReset").onclick = e => askFirst(e.target, "Delete all saved progress on this device?", () => { P.items = {}; P.skills = {}; P.mocks = []; P.mockA = null; P.mockB = null; save(); renderHome(); });
}

/* ---------- Part A quiz ---------- */
let QZ = null; // {ids, i}
function opts(values, all){ return `<option value="">${all}</option>` + values.map(v => `<option>${esc(v)}</option>`).join(""); }
function renderQuizSetup(){
  const weeks = uniq(Q.map(q => q.week)), topics = uniq(Q.map(q => q.topic));
  const slos = uniq(Q.flatMap(q => q.slo || [])).sort(), skills = uniq(Q.map(q => q.skill));
  $("#main").innerHTML = `${banner()}<div class="card">
    <h2 class="big" style="margin-top:0">Part A practice</h2>
    <div class="grid">
      <label>Type<br><select id="fType"><option value="">All types</option><option value="mcq">Multiple choice</option><option value="saq">Short answer</option></select></label>
      <label>Week / module<br><select id="fWeek">${opts(weeks,"All weeks")}</select></label>
      <label>Topic<br><select id="fTopic">${opts(topics,"All topics")}</select></label>
      <label>SLO<br><select id="fSlo">${opts(slos,"All SLOs")}</select></label>
      <label>Part B skill<br><select id="fSkill">${opts(skills.map(s => (SKBY[s]||{}).name || s),"Any")}</select></label>
    </div>
    <div class="row" style="margin-top:10px">
      <label><input type="checkbox" id="fWeakOnly"> Weak areas only</label>
      <label><input type="checkbox" id="fReason"> Clinical reasoning items only</label>
      <label><input type="checkbox" id="fShuffle" checked> Shuffle</label>
    </div>
    <div class="row" style="margin-top:6px">${suppToggle()}</div>
    <div class="row" style="margin-top:12px"><button class="primary" id="fStart">Start</button><span id="fCount" class="muted small"></span></div>
  </div>`;
  const read = () => {
    const skillName = $("#fSkill").value, skill = (SK.find(s => s.name === skillName)||{}).id || skillName;
    return {type:$("#fType").value, week:$("#fWeek").value, topic:$("#fTopic").value, slo:$("#fSlo").value, skill, weak:$("#fWeakOnly").checked, reasoning:$("#fReason").checked, shuffle:$("#fShuffle").checked};
  };
  const count = () => { $("#fCount").textContent = filterQ(read()).length + " matching"; };
  document.querySelectorAll("#main select, #main input").forEach(el => el.onchange = count);
  bindSuppToggle(renderQuizSetup);
  count();
