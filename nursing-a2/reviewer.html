<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assessment 2 Reviewer</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface-2:#eef1f5;--text:#1c2330;--muted:#5b6575;--border:#d6dbe3;
  --accent:#2f5d8a;--accent-text:#ffffff;--good:#1f7a4d;--good-bg:#e3f4ea;--bad:#b3261e;--bad-bg:#fbe7e5;
  --warn:#8a5a00;--warn-bg:#fff3d6;--crit:#b3261e;--focus:#2f5d8a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b;--surface:#1a2028;--surface-2:#232b35;--text:#e6eaf0;--muted:#9aa5b4;--border:#323c48;
    --accent:#7fb0e0;--accent-text:#0d1620;--good:#6fd39e;--good-bg:#173226;--bad:#f28b82;--bad-bg:#3a1d1b;
    --warn:#f2c46b;--warn-bg:#3a2e12;--crit:#f28b82;--focus:#7fb0e0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b;--surface:#1a2028;--surface-2:#232b35;--text:#e6eaf0;--muted:#9aa5b4;--border:#323c48;
  --accent:#7fb0e0;--accent-text:#0d1620;--good:#6fd39e;--good-bg:#173226;--bad:#f28b82;--bad-bg:#3a1d1b;
  --warn:#f2c46b;--warn-bg:#3a2e12;--crit:#f28b82;--focus:#7fb0e0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.ask{gap:6px;margin-left:4px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.bar{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:17px;margin:0 auto 0 0}
nav{max-width:860px;margin:0 auto;padding:0 16px 8px;display:flex;gap:6px;overflow-x:auto}
nav button{flex:0 0 auto}
main{max-width:860px;margin:0 auto;padding:16px}
button,select,textarea,input{font:inherit;color:inherit}
button{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button[aria-pressed="true"],nav button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
select,textarea,input[type=text]{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;max-width:100%}
textarea{width:100%;min-height:110px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);margin:0 4px 4px 0}
.tag.supp{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.banner{border-radius:10px;padding:10px 14px;margin:0 0 14px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px}
.opt:disabled{opacity:1;cursor:default}
.opt.good{background:var(--good-bg);border-color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.why{font-size:14px;margin:2px 0 8px 12px;padding-left:10px;border-left:3px solid var(--border)}
.why.good{border-color:var(--good)}.why.bad{border-color:var(--bad)}
.cite{font-size:13px;color:var(--muted);margin-top:8px}
.cite::before{content:"Source: ";font-weight:600}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--border);border-radius:8px;margin:6px 0;background:var(--surface)}
.steps li .n{min-width:28px;font-weight:700}
.steps li .t{flex:1}
.steps li.good{background:var(--good-bg);border-color:var(--good)}
.steps li.bad{background:var(--bad-bg);border-color:var(--bad)}
.steps li.picked{outline:3px solid var(--accent);cursor:grabbing}
.steps li[data-pos]{cursor:pointer}
.crit{border-left:5px solid var(--crit)!important}
.critbadge{font-size:11px;font-weight:700;color:var(--crit);text-transform:uppercase;letter-spacing:.04em}
.timer{font:700 28px/1 ui-monospace,Consolas,monospace}
.timer.low{color:var(--bad)}
.big{font-size:20px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--border);padding:6px;text-align:left;vertical-align:top}
.ctx{border:1px dashed var(--warn);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--warn-bg)}
.ctx b{color:var(--warn)}
.hide{display:none!important}
@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card{border:none;padding:0}
  .steps li{break-inside:avoid;border-color:#999;background:#fff}
}
</style>
</head>

 pathophysiological and psychosocial factors (RN Standards 4, 5).", "cite": [{"src": "SI", "loc": "p.1"}]}, "SLO2": {"text": "Clinical reasoning and critical thinking for selected cardiovascular, cerebrovascular and respiratory diseases, e.g. asthma, heart failure and stroke (RN Standards 1, 6, 7).", "cite": [{"src": "SI", "loc": "p.1"}]}, "SLO3": {"text": "Practical understanding of the administration and management of oxygen therapy and oxygen devices (RN Standards 1, 5, 6).", "cite": [{"src": "SI", "loc": "p.1"}]}, "SLO4": {"text": "Quality use of medicines including administration of inhaler medication (RN Standards 1, 5, 6).", "cite": [{"src": "SI", "loc": "p.1"}]}}, "skills": [{"id": "auscultation", "name": "Lung auscultation", "slo": ["SLO1", "SLO2"], "steps": [], "notes": [{"text": "93225 summary: ideally position the patient upright and have them breathe through their mouth; listen comparing each side with the other; listen for quality, intensity and adventitious (unexpected) sounds.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-2-preparation-activities-patient-assessment"}]}, {"text": "Stethoscope: bell for high-pitched sounds at the lung apex above the clavicle; diaphragm for low-pitched sounds over the rest of the chest. Lung sounds cannot be heard through bone, so avoid the scapula.", "cite": [{"src": "AUSC", "loc": "p.1, p.3"}]}, {"text": "Normal breath sounds: tracheal (very loud, high pitch, over the trachea); bronchial (loud, over the manubrium); bronchovesicular (medium, 1st-2nd intercostal spaces beside the sternum and between the scapulae); vesicular (soft, low pitch, inspiration longer than expiration, most of the lung field).", "cite": [{"src": "AUSC", "loc": "p.4 (Table 1)"}]}, {"text": "Crackles: from small airways, mostly on inspiration. Coarse crackles may indicate pneumonia, fine crackles may suggest pulmonary oedema; seen in pneumonia, pulmonary fibrosis, COPD, infection and heart failure. Wheeze: often expiratory, musical; high-pitched in asthma. Inspiratory wheeze (stridor) usually means upper airway obstruction. Absent breath sounds: e.g. pneumothorax, pleural effusion, consolidation.", "cite": [{"src": "AUSC", "loc": "p.3-4"}]}, {"text": "Stridor needs an immediate review by a senior doctor, and a silent chest may mean total peripheral airway obstruction (FNP2B tutorial).", "cite": [{"src": "COPD", "loc": "slide 9"}]}], "cite": [{"src": "AUSC", "loc": "p.2-3"}, {"src": "WB2", "loc": "p.~3"}], "variants": [{"id": "procedure", "name": "Chest auscultation procedure (Module 1 reading)", "cite": [{"src": "AUSC", "loc": "p.2-3 (The procedure, steps 1-19)"}], "steps": [{"text": "Ensure your stethoscope has been cleaned according to local infection prevention and control guidance.", "cite": [{"src": "AUSC", "loc": "p.2"}]}, {"text": "Discuss the procedure with the patient and gain informed consent.", "cite": [{"src": "AUSC", "loc": "p.2"}]}, {"text": "Keep the patient warm and the area free from drafts.", "cite": [{"src": "AUSC", "loc": "p.2"}]}, {"text": "Screen the bed to maintain privacy and dignity.", "cite": [{"src": "AUSC", "loc": "p.2"}]}, {"text": "Decontaminate your hands.", "cite": [{"src": "AUSC", "loc": "p.2"}]}, {"text": "Position the patient comfortably so you can access their chest (ideally sitting in a chair or on the side of the bed; some tolerate only 45°).", "cite": [{"src": "AUSC", "loc": "p.2"}]}, {"text": "Remove or rearrange clothing as needed to see the chest.", "cite": [{"src": "AUSC", "loc": "p.2"}]}, {"text": "Warm the stethoscope between your hands if it feels cold.", "cite": [{"src": "AUSC", "loc": "p.2"}]}, {"text": "Put the ear tips in pointing slightly forward, towards the nose.", "cite": [{"src": "AUSC", "loc": "p.2"}]}, {"text": "Hold the chest piece between the index and middle finger of your dominant hand and place it flat on the chest with gentle pressure.", "cite": [{"src": "AUSC", "loc": "p.2"}]}, {"text": "Anterior chest: use a 'stepladder' approach from the 1st to the 7th intercostal space, comparing side to side; listen for a full inspiration and expiration at each point.", "cite": [{"src": "AUSC", "loc": "p.2-3"}]}, {"text": "Posterior chest: stepladder approach from the 1st to the 7th intercostal space, avoiding the scapula.", "cite": [{"src": "AUSC", "loc": "p.3"}]}, {"text": "Right lateral chest: ask the patient to move their right arm aside; listen upper, then middle, then lower lobe.", "cite": [{"src": "AUSC", "loc": "p.3"}]}, {"text": "Repeat on the left side (upper and lower lobes).", "cite": [{"src": "AUSC", "loc": "p.3"}]}, {"text": "Replace the patient's clothing and make them comfortable.", "cite": [{"src": "AUSC", "loc": "p.3"}]}, {"text": "Explain your findings and check whether the patient has any questions.", "cite": [{"src": "AUSC", "loc": "p.3"}]}, {"text": "Decontaminate your stethoscope.", "cite": [{"src": "AUSC", "loc": "p.3"}]}, {"text": "Decontaminate your hands.", "cite": [{"src": "AUSC", "loc": "p.3"}]}, {"text": "Record findings: location of auscultation, quality, and where any abnormal sounds were heard.", "cite": [{"src": "AUSC", "loc": "p.3-4 (Box 2)"}]}]}, {"id": "workbook", "name": "Full respiratory assessment (Lab 2 workbook)", "cite": [{"src": "WB2", "loc": "p.~3 (2. Full Respiratory Assessment)"}], "steps": [{"text": "Perform hand hygiene and gather stethoscope and watch.", "cite": [{"src": "WB2", "loc": "p.~3"}]}, {"text": "Introduce yourself, explain the assessment and obtain consent.", "cite": [{"src": "WB2", "loc": "p.~3"}]}, {"text": "Position the patient upright where possible and expose only as required.", "cite": [{"src": "WB2", "loc": "p.~3"}]}, {"text": "Assess general appearance, colour and work of breathing.", "cite": [{"src": "WB2", "loc": "p.~3"}]}, {"text": "Count respiratory rate for one full minute; assess rhythm, depth and effort.", "cite": [{"src": "WB2", "loc": "p.~3"}]}, {"text": "Inspect anterior and posterior thorax for shape, symmetry, scars and bruising.", "cite": [{"src": "WB2", "loc": "p.~3"}]}, {"text": "Palpate posterior chest for temperature, tenderness, masses and expansion.", "cite": [{"src": "WB2", "loc": "p.~3"}]}, {"text": "Percuss posterior chest systematically.", "cite": [{"src": "WB2", "loc": "p.~3"}]}, {"text": "Auscultate posterior chest systematically and assess vocal resonance where appropriate.", "cite": [{"src": "WB2", "loc": "p.~3"}]}, {"text": "Palpate anterior chest, including tracheal position and expansion.", "cite": [{"src": "WB2", "loc": "p.~3"}]}, {"text": "Percuss and auscultate anterior chest and trachea systematically.", "cite": [{"src": "WB2", "loc": "p.~3"}]}, {"text": "Identify and describe normal and adventitious breath sounds.", "cite": [{"src": "WB2", "loc": "p.~3"}]}, {"text": "Reposition the patient, ensure comfort, clean equipment and perform hand hygiene.", "cite": [{"src": "WB2", "loc": "p.~3"}]}, {"text": "Document findings accurately and escalate significant changes.", "critical": true, "cite": [{"src": "WB2", "loc": "p.~3"}]}]}, {"id": "fnp2b", "name": "FNP2B tutorial summary (supplementary)", "cite": [{"src": "COPD", "loc": "slides 7-9"}], "steps": [{"text": "Position the patient upright.", "cite": [{"src": "COPD", "loc": "slide 7"}]}, {"text": "Ask the patient to breathe through their mouth.", "cite": [{"src": "COPD", "loc": "slide 7"}]}, {"text": "Listen to breath sounds with your stethoscope at each auscultation point, anterior and posterior chest.", "cite": [{"src": "COPD", "loc": "slides 7-8"}]}, {"text": "Compare each side with the other.", "cite": [{"src": "COPD", "loc": "slide 7"}]}, {"text": "Listen for quality, intensity and adventitious sounds.", "cite": [{"src": "COPD", "loc": "slide 7"}]}, {"text": "If you hear stridor (a loud strangulating sound on inspiration, clearest over the trachea), get an immediate review by a senior doctor.", "critical": true, "cite": [{"src": "COPD", "loc": "slide 9"}]}]}]}, {"id": "ecg", "name": "ECG lead placement", "slo": ["SLO1", "SLO2"], "steps": [], "notes": [{"text": "An ECG is a graphical representation of the heart's electrical activity. Indications include chest pain suggestive of ischaemia, known or suspected arrhythmias, rhythm changes, after cardiac arrest, after syncope, ST/T changes with metabolic or electrolyte disturbance, pre-operative assessment, after pacemaker insertion, routine requirements, and medications known to cause arrhythmia.", "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}, {"text": "Limb leads: inconsistent limb lead placement changes how the ECG looks. Place them slightly proximal to the wrists and ankles, symmetrically, avoiding bony prominences. If a standard site is unavailable (amputation, limb tremor), use the most distal available point, mirrored on the other side. Avoid torso placement for a diagnostic 12-lead, and clearly document any modified placement on the tracing.", "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}, {"text": "Continuous monitoring (hardwire or telemetry, usually 3 or 5 electrodes) watches rhythm but does not diagnose. A 12-lead ECG is still recorded when a diagnosis is needed. Every disconnection of a hardwired patient is a period when the rhythm is not being watched.", "cite": [{"src": "CANVAS", "loc": "page 3-dot-3-cardiac-monitoring-and-telemetry"}]}, {"text": "Precordial positions are marked critical here because wrong placement changes the recording (the Canvas page says this for limb leads). The source does not say which steps an assessor treats as fail points.", "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}], "cite": [{"src": "LAB3PKG", "loc": "p.21"}, {"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}], "variants": [{"id": "12lead", "name": "12-lead ECG (Lab 3 appraisal form + lead positions)", "cite": [{"src": "LAB3PKG", "loc": "p.21 (Taking a 12-lead electrocardiograph)"}], "steps": [{"text": "Performs hand hygiene.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Gathers equipment: 12-lead ECG machine, recording paper, pre-gelled electrodes, cleansing wipes, scissors.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Introduces self to the person.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Explains the procedure to the person.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Obtains consent.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Prepares the person for privacy and ensures they are warm.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Removes objects that may cause electrical interference.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Inspects skin and hair status for electrode placement.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Positions the person in the centre of the bed with feet not touching the footboard.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Clips excess hair.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Performs hand hygiene.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Exposes only the skin areas needed for electrode placement.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Enters data into the machine.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Uses cleansing wipes to remove excess oil from the skin.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Attaches limb electrodes to clean, dry, hair-free skin, slightly proximal to the wrists and ankles, symmetrically, avoiding bony prominences.", "critical": true, "cite": [{"src": "LAB3PKG", "loc": "p.21"}, {"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}, {"text": "V1: 4th intercostal space, RIGHT margin of the sternum.", "critical": true, "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}, {"text": "V2: 4th intercostal space, LEFT margin of the sternum.", "critical": true, "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}, {"text": "V4: 5th intercostal space, mid-clavicular line.", "critical": true, "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}, {"text": "V3: midway between V2 and V4.", "critical": true, "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}, {"text": "V5: 5th intercostal space, anterior axillary line (same level as V4).", "critical": true, "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}, {"text": "V6: 5th intercostal space, mid-axillary line (same level as V4).", "critical": true, "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}, {"text": "Attaches the predesignated wires to the corresponding electrodes.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Asks the person to remain still and relaxed.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Records the tracing.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Removes electrodes.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Cleanses the skin.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Provides health education.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Disposes of used equipment appropriately.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Performs hand hygiene.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Documents the procedure, assessment data and ECG interpretation.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Links theory to findings; reviews ECG interpretation and assessment data.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}, {"text": "Initiates nursing interventions as required and reports any abnormalities.", "cite": [{"src": "LAB3PKG", "loc": "p.21"}]}]}, {"id": "monitor", "name": "Cardiac monitoring (Lab 3 appraisal form 11.4)", "cite": [{"src": "LAB3PKG Each is marked U (unsatisfactory), D (developing), S (satisfactory) or NA.", "cite": [{"src": "CANVAS", "loc": "page 2-dot-2-preparation-activities-respiratory-nursing-skills"}, {"src": "O2CHK", "loc": "p.1-3"}]}, {"text": "Flow ranges on the 93225 Canvas page: nasal prongs 1-4 L of O2, and anything above 4 L needs humidification, which standard prongs can't provide. Hudson mask 5-10 L. Section 12.5 gives different ranges (see the next note and CONFLICTS).", "cite": [{"src": "CANVAS", "loc": "page 2-dot-2-preparation-activities-respiratory-nursing-skills"}]}, {"text": "Section 12.5 device ranges: nasal cannula 24-44% at 1-6 L/min (about 4% more per L/min; humidification may be recommended above 4 L/min; above 6 L/min FiO2 does not increase). Simple face mask 40-60% at 5-8 L/min, with a minimum of 5 L/min to prevent rebreathing CO2. Non-rebreather 95-100% at 10-15 L/min; the bag must not totally deflate. Venturi 24-50% at 4-10 L/min (e.g. blue adaptor 24% at 4 L/min; green 35% at 8 L/min).", "cite": [{"src": "S125", "loc": "p.21, 24-27"}]}, {"text": "TSANZ SpO2 targets: 88-92% in chronic respiratory disease with potential for hypercapnia (give O2 when SpO2 < 88%); otherwise 92-96% (give O2 when SpO2 < 92%). Senior clinician review if FiO2 ≥ 0.40 or ≥ 6 L/min via simple face mask is needed to keep the target; ICU review if FiO2 ≥ 0.50 or ≥ 8 L/min via simple face mask.", "cite": [{"src": "TSANZ", "loc": "p.2 (Table 1)"}]}, {"text": "Device safety points from the Lab 2 workbook: nasal prongs, check nares/ears; Hudson, ensure appropriate flow and fit; Venturi, use the prescribed adaptor/setting and maintain target saturation; non-rebreather, the reservoir must be inflated before applying to the face.", "cite": [{"src": "WB2", "loc": "p.~4"}]}], "cite": [{"src": "O2CHK", "loc": "p.1-3"}], "variants": [{"id": "hudson", "name": "Hudson (simple face) mask", "cite": [{"src": "O2CHK", "loc": "p.1 (Section 12.5 appraisal form: Use of Hudson mask)"}], "steps": [{"text": "Identifies the indication for administering oxygen therapy via a Hudson mask.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Performs hand hygiene.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Introduces self and establishes rapport.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Performs a respiratory assessment if baseline data is not available.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Checks that oxygen has been prescribed by a doctor. If there is no order, uses clinical judgement to decide if oxygen is required.", "critical": true, "cite": [{"src": "O2CHK", "loc": "p.1"}, {"src": "TSANZ", "loc": "p.2 (Table 1: 'Oxygen is a drug and thus requires prescription')"}]}, {"text": "Prepares the equipment: oxygen supply, Hudson mask, tubing.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Provides safety education about oxygen therapy to the person and family.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Performs hand hygiene.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Explains why oxygen therapy is required and gains consent.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Assists the person into a semi-Fowler's position if possible.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Connects the oxygen tubing to the flow meter outlet and to the mask.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Connects and sets up a humidifier if required.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Turns the oxygen on and checks it is functioning properly.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Guides the mask to the person's face and applies it from the nose downwards.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Fixes the mask to the contours of the person's face.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Secures the elastic around the person's head so the mask stays in place.", "cite": [{"src": "O2CHK", "loc": "p.1"}]}, {"text": "Applies padding if "text": "Perform or review a respiratory assessment and baseline observations.", "cite": [{"src": "WB2", "loc": "p.~5"}]}, {"text": "Select the nasal prongs/cannula.", "cite": [{"src": "WB2", "loc": "p.~5"}]}, {"text": "Connect the tubing and ensure the device is functioning.", "cite": [{"src": "WB2", "loc": "p.~5"}]}, {"text": "Apply the prongs securely and comfortably.", "cite": [{"src": "WB2", "loc": "p.~5"}]}, {"text": "Attach a pulse oximeter and monitor response against the target range.", "cite": [{"src": "WB2", "loc": "p.~5"}]}, {"text": "Reassess respiratory effort, SpO2 and patient comfort.", "cite": [{"src": "WB2", "loc": "p.~5"}]}, {"text": "Check skin integrity and device position.", "cite": [{"src": "WB2", "loc": "p.~5"}]}, {"text": "Document oxygen device, FiO2/flow, SpO2, response and escalation.", "cite": [{"src": "WB2", "loc": "p.~5"}]}]}]}, {"id": "nebuliser", "name": "Medication administration via nebuliser", "slo": ["SLO4"], "steps": [], "notes": [{"text": "A nebuliser pushes compressed air through liquid medication, turning it into a mist the person inhales through a simple face mask or mouthpiece. A puffer with a spacer works just as effectively for most people and is more convenient.", "cite": [{"src": "S126", "loc": "p.2, p.11"}]}, {"text": "93225 Lecture 2: set the nebuliser to 6-8 L/min. If it is set too high (above 10 L/min) the medication is delivered too fast, reducing effectiveness, and it may pop the connection off the air port.", "cite": [{"src": "L2", "loc": "slide 16"}]}, {"text": "Relievers (e.g. salbutamol/Ventolin) are fast-acting bronchodilators that relax airway muscle. Preventers (e.g. fluticasone/Flixotide, budesonide/Pulmicort) are corticosteroids that reduce airway swelling, redness and mucus.", "cite": [{"src": "S126", "loc": "p.3-4"}]}, {"text": "Clinical safety alert: clean and maintain nebulisers after each use, or the person risks infection and/or not getting the right dose. At home, replace mask, mouthpiece and tubing every three months.", "cite": [{"src": "S126", "loc": "p.8-9, p.17"}]}, {"text": "Children: a mask lets the child breathe naturally. Demonstrate on a doll or toy, let them play with the equipment, and sitting on a parent's lap can help.", "cite": [{"src": "S126", "loc": "p.9"}]}, {"text": "Driving gas differs between sources (see CONFLICTS). TSANZ: in COPD and chronic respiratory failure, give bronchodilators by MDI and spacer, or if a nebuliser is necessary it should be air-driven with oxygen continued via nasal cannulae. The Lab 2 workbook says 'prescribed air flow'. Section 12.6 says hospitals often use oxygen instead of the compressor, with SpO2 monitored.", "cite": [{"src": "TSANZ", "loc": "p.2 (Table 1, Delivery)"}, {"src": "WB2", "loc": "p.~7"}, {"src": "S126", "loc": "p.16"}]}], "cite": [{"src": "S126", "loc": "p.11-19"}], "variants": [{"id": "text", "name": "Skills in Clinical Nursing 12.6 (3Ps table)", "cite": [{"src": "S126", "loc": "p.11-19 (The 3Ps table: Use of nebuliser)"}], "steps": [{"text": "Identify the indication for giving medication via a nebuliser (e.g. can't use an inhaler because of confusion or hand problems; lots of mucus; really struggling to breathe).", "cite": [{"src": "S126", "loc": "p.11"}]}, {"text": "Perform hand hygiene.", "cite": [{"src": "S126", "loc": "p.11-12"}]}, {"text": "Complete a respiratory history and examination first. If the medication is urgent, at least auscultate the chest for adventitious sounds (wheezes, crackles) so you can compare before and after.", "cite": [{"src": "S126", "loc": "p.12"}]}, {"text": "Check the medication chart for a valid order written by a doctor and follow the six rights of safe administration.", "critical": true, "cite": [{"src": "S126", "loc": "p.12-13"}]}, {"text": "Gather equipment: nebuliser compressor, medication chamber, mask or mouthpiece, tubing, liquid medication, drug order (medication chart).", "cite": [{"src": "S126", "loc": "p.13"}]}, {"text": "Perform hand hygiene.", "cite": [{"src": "S126", "loc": "p.14"}]}, {"text": "Introduce yourself (full name and designation). Verify identity (full name and date of birth) and check allergies.", "critical": true, "cite": [{"src": "S126", "loc": "p.14"}]}, {"text": "Explain what you are going to do and obtain consent.", "cite": [{"src": "S126", "loc": "p.14"}]}, {"text": "Position the person semi-Fowler's or sitting upright.", "cite": [{"src": "S126", "loc": "p.14-15"}]}, {"text": "Plug the nebuliser machine into a power outlet and turn it on at the wall.", "cite": [{"src": "S126", "loc": "p.15"}]}, {"text": "Check right medication, dose, route and time against the drug order.", "critical": true, "cite": [{"src": "S126", "loc": "p.15"}]}, {"text": "Connect the tubing to the nebuliser chamber (before adding the medication, to avoid spillage).", "cite": [{"src": "S126", "loc": "p.15"}]}, {"text": "Add the liquid medication to one side of the chamber, screw the two sides together and attach the mask or mouthpiece.", "cite": [{"src": "S126", "loc": "p.15"}]}, {"text": "Place the mask over the face, or give the mouthpiece and ask the person to seal their lips around it and breathe normally.", "cite": [{"src": "S126", "loc": "p.15-16"}]}, {"text": "Turn the nebuliser on and start nebulising (a standard dose takes about 5-10 minutes). If oxygen is used instead of the compressor, always monitor SpO2.", "critical": true, "cite": [{"src": "S126", "loc": "p.16"}]}, {"text": "Document/sign that you have given the medication (the sixth right: documentation).", "cite": [{"src": "S126", "loc": "p.16"}]}, {"text": "When fully nebulised, turn the compressor off and remove the mask/mouthpiece.", "cite": [{"src": "S126", "loc": "p.16-17"}]}, {"text": "Reassess breathing and respiratory rate, and auscultate the lung fields to evaluate effectiveness.", "cite": [{"src": "S126", "loc": "p.17"}]}, {"text": "Clean equipment: rinse the chamber; mask/mouthpiece and tubing can stay with the person for next time.", "cite": [{"src": "S126", "loc": "p.17"}]}, {"text": "Perform hand hygiene.", "cite": [{"src": "S126", "loc": "p.18"}]}, {"text": "Document the treatment in the progress notes/chart, including breath sounds before and after.", "cite": [{"src": "S126", "loc": "p.18"}]}, {"text": "Evaluate the treatment plan and reassess at regular intervals or as required.", "cite": [{"src": "S126", "loc": "p.18"}]}, {"text": "Communicate any changes in the person's condition to the treating doctor.", "cite": [{"src": "S126", "loc": "p.18-19"}]}]}, {"id": "workbook", "name": "Lab 2 workbook nebuliser checklist", "cite": [{"src": "WB2", "loc": "p.~7 (6. Inhaled Medications: Nebuliser)"}], "steps": [{"text": "Check the medication order, patient identity, allergies, expiry date and indication against the medication chart; do the 5 rights 3 times.", "critical": true, "cite": [{"src": "WB2", "loc": "p.~7"}]}, {"text": "Explain the procedure and obtain consent.", "cite": [{"src": "WB2", "loc": "p.~7"}]}, {"text": "Prepare the nebuliser equipment and medication safely.", "cite": [{"src": "WB2", "loc": "p.~7"}]}, {"text": "Position the patient upright.", "cite": [{"src": "WB2", "loc": "p.~7"}]}, {"text": "Apply the prescribed air flow according to local instructions.", "cite": [{"src": "WB2", "loc": "p.~7"}]}, {"text": "Encourage normal tidal breathing through the mouthpiece/mask.", "cite": [{"src": "WB2", "loc": "p.~7"}]}, {"text": "Monitor respiratory status and response with a respiratory assessment.", "cite": [{"src": "WB2", "loc": "p.~7"}]}, {"text": "Stop and escalate if deterioration occurs.", "critical": true, "cite": [{"src": "WB2", "loc": "p.~7"}]}, {"text": "Clean, dispose of or reuse equipment according to policy.", "cite": [{"src": "WB2", "loc": "p.~7"}]}, {"text": "Document medication, route/device, response and any adverse effects.", "cite": [{"src": "WB2", "loc": "p.~7"}]}]}]}], "gaps": ["Critical/fail-point steps: the appraisal forms mark every step U/D/S/NA and do not say which steps an assessor fails you on. Steps marked Critical in this app are ones the sources flag as safety points.", "Lab 2 Student Package and the Skills in Clinical Nursing sections 11.2-11.4 and 13.2 (readings) were not in the Canvas file list; the Lab 3 package contains the 11.2-11.4 appraisal forms.", "Oxygen in COPD: no target SpO2 range for people with COPD in any loaded source. COPD .pdf p.22 raises the question but the answer is in a video, not on the slide.", "Heart failure is named in SLO2, but no loaded source covers it. The 'HEART FAILURE.docx' notes in Downloads were left out because their origin is unknown.", "Continuous cardiac monitoring, basic life support, suctioning and sputum collection are 93225 topics (SI p.2) with no loaded material.", "Inhaler technique (SLO4): only the device and class chart (ASTHMA.pdf p.20) and 'pMDIs should be used with a spacer' are covered, not the steps."], "context": [{"id": "CTX-GENERIC-STEPS", "label": "NOT FROM MODULES — verify", "text": "Bedside skills are usually framed by hand hygiene, patient identification, consent, explanation and privacy at the start, and documentation and escalation at the end. None of these steps are in the loaded sources, so check your 93225 lab guide for the exact wording and order."}], "questions": [{"id": "AI-01", "type": "mcq", "week": "Assessment info", "topic": "Assessment 2 format", "slo": ["SLO1", "SLO2", "SLO3", "SLO4"], "stem": "In Part B of Assessment 2, how many of the four listed skills will you be assessed on?", "options": [{"text": "Two, allocated to you", "correct": true, "why": "The Canvas page says you will be assessed on two of the listed skills, which will be allocated to you."}, {"text": "One skill of your choice", "why": "You do not choose; skills are allocated, and there are two."}, {"text": "All four skills", "why": "Only two of the four are assessed."}, {"text": "Three skills, allocated on the day", "why": "The page says two, not three."}], "explanation": "Part B is a 15-minute bedside demonstration of two allocated skills out of: lung auscultation, ECG lead placement, oxygen administration, medication administration via nebuliser. Prepare all four.", "cite": [{"src": "A2", "loc": "Part B (skills demonstration) section"}]}, {"id": "AI-02", "type": "mcq", "week": "Assessment info", "topic": "Assessment 2 format", "slo": ["SLO1", "SLO2", "SLO3", "SLO4"], "stem": "Which of these is a 93225 subject topic but NOT one of the four Part B skills?", "options": [{"text": "Suctioning", "correct": true, "why": "Suctioning is a subject topic (Subject Information p.2) but is not on the Part B skills list."}, {"text": "Lung auscultation", "why": "Lung auscultation is one of the four Part B skills."}, {"text": "ECG lead placement", "why": "ECG lead placement is one of the four Part B skills."}, {"text": "Medication administration via nebuliser", "why": "Nebuliser medication administration is one of the four Part B skills."}], "explanation": "The Part B list has exactly four skills: lung auscultation, ECG lead placement, oxygen administration, medication administration via nebuliser.", "cite": [{"src": "A2", "loc": "Part B (skills demonstration) section"}, {"src": "SI", "loc": "p.2"}]}, {"id": "AI-03", "type": "mcq", "week": "Assessment info", "topic": "Assessment 2 format", "slo": ["SLO1", "SLO2", "SLO3", "SLO4"], "stem": "What is the format of Part A of Assessment 2?", "options": [{"text": "A 15-minute paper-based quiz with multiple-choice and short-answer questions", "correct": true, "why": "The Canvas page describes Part A as a 15-minute paper-based quiz in multiple-choice and short-answer formats."}, {"text": "A 30-minute online quiz", "why": "30 minutes is the total for Parts A and B together; Part A is 15 minutes and paper based."}, {"text": "A 15-minute multiple-choice-only quiz", "why": "Part A also includes short-answer questions."}, {"text": "An oral viva with the assessor", "why": "Part A is a written paper quiz."}], "explanation": "Part A covers all content in your pre-work, lectures and labs so far, so expect both recall and short written reasoning.", "cite": [{"src": "A2", "loc": "Length and Part A (quiz) sections"}, {"src": "SI", "loc": "p.6"}]}, {"id": "AI-04", "type": "mcq", "week": "Assessment info", "topic": "Oxygen devices", "slo": ["SLO3"], "skill": "oxygen", "stem": "Which oxygen delivery devices does the 93225 Subject Information name for managing oxygen therapy?", "options": [{"text": "Simple face mask (Hudson mask), Venturi mask and non-rebreather mask", "correct": true, "why": "These three devices are named in the content topics and in the core clinical skill."}, {"text": "Nasal prongs, Hudson mask and Venturi mask only", "why": "The Subject Information names the Hudson, Venturi and non-rebreather masks; nasal prongs are not in that list."}, {"text": "CPAP, BiPAP and high-flow nasal prongs", "why": "These are not the devices the Subject Information names."}, {"text": "Venturi mask only", "why": "Three devices are named, not one."}], "explanation": "Oxygen therapy with these three devices is also a core clinical skill assessed in the labs (Subject Information p.8). Their flow rates are not in the loaded sources; see Gaps.", "cite": [{"src": "SI", "loc": "p.2 and p.8"}]}, {"id": "AI-05", "type": "mcq", "week": "Assessment info", "topic": "Assessment 2 format", "slo": ["SLO1", "SLO2", "SLO3", "SLO4"], "stem": "How much is Assessment 2 (Parts A and B combined) worth?", "options": [{"text": "30%", "correct": true, "why": "Both the Canvas page and the Subject Information give a weighting of 30%."}, {"text": "20%", "why": "20% is Assessment 1 (Medication Calculation Quiz)."}, {"text": "50%", "why": "50% is Assessment 3 (Case-Based Assessment)."}, {"text": "15%", "why": "15 is the number of minutes for each part, not the weighting."}], "explanation": "Assessment 2 is individual, worth 30%, and runs in your Week 4 lab (weeks commencing 28 September 2026).", "cite": [{"src": "A2", "loc": "Weighting line"}, {"src": "A2", "loc": "Due date line"}, {"src": "SI", "loc": "p.5 (Task 1), p.6 (Task 2), p.7 (Task 3)"}]}, {"id": "AS-01", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Asthma: oxygen", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "reasoning": true, "stem": "A 10-year-old with acute asthma has an SpO2 of 92% on room air. According to the tutorial's doctor's notes, is supplemental oxygen indicated?", "options": [{"text": "Yes. For children, give O2 if SpO2 is less than 95%", "correct": true, "why": "The doctor's notes say: give O2 if SpO2 is less than 92% (adults) or 95% (children). 92% is below the children's threshold."}, {"text": "No. 92% is not below the 92% threshold", "why": "92% is the adult threshold; for children the threshold is 95%."}, {"text": "No. Oxygen is only needed once SpO2 is below 90%", "why": "Below 90% is one of the life-threatening findings in the Handbook figure, not the threshold for starting oxygen."}, {"text": "Only if the child becomes drowsy", "why": "Drowsiness is a life-threatening finding in the Handbook figure, but oxygen is already indicated by the SpO2."}], "explanation": "Findings (child, SpO2 92% on room air) → interpretation (below the paediatric threshold of 95%) → action (give O2).", "cite": [{"src": "ASTHMA", "loc": "slides 15, 18"}]}, {"id": "AS-02", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Asthma: severity", "slo": ["SLO2"], "reasoning": true, "stem": "A 10-year-old with acute asthma is alert, has increased work of breathing with intercostal recession, and has an SpO2 of 92%. Using the Australian Asthma Handbook categories shown in the tutorial, how severe is this attack?", "options": [{"text": "Severe", "correct": true, "why": "Severe = any of: unable to speak in sentences, visibly breathless, increased work of breathing, oxygen saturation 90–94%."}, {"text": "Mild/moderate", "why": "Mild/moderate means the person can walk and speak whole sentences in one breath (young children: can move about and speak in phrases). Increased work of breathing and SpO2 90–94% are severe features."}, {"text": "Life-threatening", "why": "Life-threatening = any of: drowsy, collapsed, exhausted, cyanotic, poor respiratory effort, oxygen saturation less than 90%. This child is alert with SpO2 92%."}, {"text": "It cannot be classified without a peak flow reading", "why": "The Handbook categories use clinical findings and oxygen saturation. Peak flow is not one of the criteria."}], "explanation": "For severe asthma the flowchart says to start oxygen, titrating to a target saturation of at least 95% (children), and to reassess severity within minutes.", "cite": [{"src": "ASTHMA", "loc": "slide 16"}]}, {"id": "AS-03", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Asthma: severity", "slo": ["SLO2"], "reasoning": true, "stem": "Which finding classifies an acute asthma attack as life-threatening in the Handbook figures shown in the tutorial?", "options": [{"text": "The person is drowsy or exhausted", "correct": true, "why": "Drowsy, collapsed, exhausted, cyanotic, poor respiratory effort, soft/absent breath sounds and oxygen saturation below 90% are the life-threatening findings."}, {"text": "Audible wheeze", "why": "Wheeze is not on the life-threatening list. Soft or absent breath sounds are."}, {"text": "Unable to speak in whole sentences", "why": "Being unable to speak in sentences is a severe feature, not life-threatening."}, {"text": "SpO2 of 93%", "why": "Oxygen saturation 90–94% is in the severe category; life-threatening is below 90%."}], "explanation": "For life-threatening asthma: salbutamol by continuous nebulisation with oxygen driving the nebuliser, arrange immediate transfer to higher-level care, and notify senior staff.", "cite": [{"src": "ASTHMA", "loc": "slides 15-16"}]}, {"id": "AS-04", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Nebulised medication", "slo": ["SLO3", "SLO4"], "skill": "nebuliser", "stem": "In life-threatening acute asthma, what gas does the Handbook figure say to use to drive the salbutamol nebuliser?", "options": [{"text": "Oxygen (piped, or a cylinder with a high-flow regulator)", "correct": true, "why": "The figure says 'Use oxygen to drive nebuliser', with 'piped oxygen or oxygen cylinder fitted with a high-flow regulator'."}, {"text": "Medical air, to avoid giving too much oxygen", "why": "The figure specifies oxygen to drive the nebuliser."}, {"text": "No gas: give salbutamol by pMDI and spacer instead", "why": "Life-threatening asthma calls for continuous nebulisation. A pMDI with spacer is considered once breathing difficulty improves."}, {"text": "Room air via a face mask", "why": "The figure specifies oxygen."}], "explanation": "This links SLO3 (oxygen) and SLO4 (inhaled medicines), and it matters for the nebuliser skill in Part B.", "cite": [{"src": "ASTHMA", "loc": "slides 15-16"}]}, {"id": "AS-05", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Nebulised medication", "slo": ["SLO3", "SLO4"], "skill": "nebuliser", "stem": "In the Handbook figure, what flow rate is stated for the high-flow regulator used to drive the nebuliser?", "options": [{"text": "6 L/min", "correct": true, "why": "The figure's footnote reads: 'Piped oxygen or oxygen cylinder fitted with a high-flow regulator (6 L/min)'."}, {"text": "2 L/min", "why": "Not the flow stated in the figure's footnote."}, {"text": "4 L/min", "why": "Not the flow stated in the figure's footnote."}, {"text": "15 L/min", "why": "Not the flow stated in the figure's footnote."}], "explanation": "Check this against your 93225 lab guide, which may give its own nebuliser flow instruction.", "cite": [{"src": "ASTHMA", "loc": "slide 15 (figure footnote)"}]}, {"id": "AS-06", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Asthma: escalation", "slo": ["SLO2", "SLO4"], "skill": "nebuliser", "reasoning": true, "stem": "A patient with acute asthma on the ward is breathless again 40 minutes after their last salbutamol dose. What do the tutorial's doctor's notes direct?", "options": [{"text": "Salbutamol is given only hourly on the ward; if more is needed, arrange an ICU review", "correct": true, "why": "The notes say 'Only administer salbutamol hourly on ward' and 'If more needed -> ICU review'."}, {"text": "Give up to 6 more puffs now and recheck in an hour", "why": "Up to 6 puffs is the dose, but on the ward it is given only hourly. Needing it sooner triggers an ICU review."}, {"text": "Wait until the next scheduled dose and do nothing else", "why": "Needing salbutamol more often than hourly triggers an ICU review, not waiting."}, {"text": "Give magnesium sulfate straight away instead of escalating", "why": "The notes say MgSO4 'may be given if poor response to initial management', but the stated direction when more salbutamol is needed on the ward is ICU review."}], "explanation": "Findings (needs salbutamol sooner than hourly) → interpretation (not responding to ward-level treatment) → action (escalate for ICU review).", "cite": [{"src": "ASTHMA", "loc": "slide 18"}]}, {"id": "AS-07", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Asthma: escalation", "slo": ["SLO2"], "stem": "According to the doctor's notes, how long should a patient be observed after respiratory distress has resolved?", "options": [{"text": "At least 3 hours", "correct": true, "why": "The notes say: 'Observe patient for at least 3 hours after respiratory distress has resolved'."}, {"text": "At least 1 hour", "why": "One hour is when the Handbook flowchart says to reassess response to treatment. Observation after resolution is at least 3 hours."}, {"text": "30 minutes", "why": "Not the period in the doctor's notes."}, {"text": "No observation is needed once distress resolves", "why": "The notes set a minimum observation period of 3 hours."}], "explanation": "At 1 hour after starting the bronchodilator, the flowchart says to reassess response: spirometry if the child is capable, and repeat pulse oximetry.", "cite": [{"src": "ASTHMA", "loc": "slides 16, 18"}]}, {"id": "AS-09", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Asthma: self-management", "slo": ["SLO1", "SLO2"], "stem": "Why does the tutorial say symptom monitoring can be more reliable than peak expiratory flow (PEF) for asthma self-monitoring?", "options": [{"text": "Symptoms often deteriorate before PEF does", "correct": true, "why": "The slide states: 'Symptoms often deteriorate before PEF, therefore symptom monitoring can be more reliable than PEF'."}, {"text": "PEF meters are not available in Australia", "why": "The slide does not say this."}, {"text": "PEF only measures oxygen saturation", "why": "The slide's reason is the timing of deterioration."}, {"text": "Symptoms never change during an exacerbation", "why": "The point is that symptoms change early."}], "explanation": "The Asthma Foundation NSW symptom diary on the slide records daytime and night-time cough/wheeze, shortness of breath, and reliever and preventer doses.", "cite": [{"src": "ASTHMA", "loc": "slide 24"}]}, {"id": "AS-10", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Asthma medicines", "slo": ["SLO4"], "stem": "On the National Asthma Council medications chart, how is montelukast classified?", "options": [{"text": "Non-steroidal preventer (tablet)", "correct": true, "why": "Montelukast is listed under 'Non steroidal preventer' as a tablet."}, {"text": "SABA reliever", "why": "The SABA relievers on the chart are salbutamol (Ventolin, Airomir) and terbutaline (Bricanyl)."}, {"text": "Inhaled corticosteroid (ICS) preventer", "why": "ICS preventers on the chart include fluticasone, budesonide, beclometasone and ciclesonide."}, {"text": "SAMA medication", "why": "The SAMA on the chart is ipratropium (Atrovent)."}], "explanation": "Other classes on the chart: LAMA, LABA, ICS-LABA, LAMA-LABA and ICS-LAMA-LABA combinations, plus biologic therapies for severe asthma.", "cite": [{"src": "ASTHMA", "loc": "slide 20"}]}, {"id": "AS-11", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Asthma medicines", "slo": ["SLO4"], "skill": "nebuliser", "stem": "Ipratropium (Atrovent) is classified on the NAC chart as a:", "options": [{"text": "SAMA (short-acting muscarinic antagonist)", "correct": true, "why": "Atrovent (ipratropium) is listed under 'SAMA medication'."}, {"text": "SABA (short-acting beta2-agonist)", "why": "The SABAs on the chart are salbutamol and terbutaline."}, {"text": "LABA (long-acting beta2-agonist)", "why": "The LABAs on the chart are formoterol, salmeterol and indacaterol."}, {"text": "Inhaled corticosteroid", "why": "Ipratropium is listed as a SAMA, not with the ICS preventers."}], "explanation": "The doctor's notes add that ipratropium may be used for children with asthma, and the Handbook figures add it to nebulised salbutamol in severe and life-threatening asthma.", "cite": [{"src": "ASTHMA", "loc": "slides 15, 16, 18, 20"}]}, {"id": "AS-12", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Inhaler technique", "slo": ["SLO4"], "stem": "According to the NAC chart in the tutorial, how should a pMDI (such as a salbutamol reliever) be used?", "options": [{"text": "With a spacer (and a face mask if needed)", "correct": true, "why": "The chart states: 'pMDIs should be used with a spacer (and face mask if needed)'."}, {"text": "Always through a nebuliser", "why": "The chart says to use a spacer. The Handbook figures reserve nebulisation for severe or life-threatening attacks."}, {"text": "Without a spacer, to get the full dose", "why": "The chart advises a spacer."}, {"text": "Through a face mask without a spacer", "why": "The chart says a spacer, with a face mask added only if needed."}], "explanation": "Inhaler technique is part of the 'education and skills' component of asthma management.", "cite": [{"src": "ASTHMA", "loc": "slides 15, 16, 20, 23"}]}, {"id": "AS-13", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Asthma: problems", "slo": ["SLO1", "SLO2"], "stem": "Which is a LONG-TERM problem of asthma listed in the tutorial (rather than a short-term/acute one)?", "options": [{"text": "School absenteeism", "correct": true, "why": "School absenteeism is on the long-term list, with recurrent exacerbations, reduced lung function, activity intolerance, sleep disturbance and fatigue, and impaired growth and development."}, {"text": "Impaired gas exchange", "why": "Impaired gas exchange is on the short-term/acute list."}, {"text": "Anxiety/distress", "why": "Anxiety/distress is on the short-term/acute list."}, {"text": "Breathlessness", "why": "Breathlessness is on the short-term/acute list."}], "explanation": "Person-centred care (SLO1) looks past the acute episode to growth, schooling and family impact.", "cite": [{"src": "ASTHMA", "loc": "slide 13"}]}, {"id": "AS-14", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Clinical reasoning cycle", "slo": ["SLO2"], "stem": "In the Clinical Reasoning Cycle used in the tutorial, which phase comes directly after 'Process information'?", "options": [{"text": "Identify priority needs and concerns", "correct": true, "why": "The cycle runs: notice → collect cues/information → process information → identify priority needs and concerns → establish goals → take action → evaluate → reflect."}, {"text": "Take action", "why": "Take action comes after identifying priority needs and establishing goals."}, {"text": "Collect cues/information", "why": "Collecting cues comes before processing information."}, {"text": "Evaluate", "why": "Evaluation comes after action."}], "explanation": "In 'Identify priority needs and concerns' you synthesise facts and inferences to form a nursing diagnosis.", "cite": [{"src": "ASTHMA", "loc": "slide 7"}]}, {"id": "AS-15", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Asthma: management", "slo": ["SLO2", "SLO4"], "reasoning": true, "stem": "An acute asthma attack responds poorly to initial bronchodilator treatment. Which add-on treatment do the tutorial and Handbook figures name?", "options": [{"text": "IV magnesium sulfate", "correct": true, "why": "The doctor's notes say MgSO4 may be given for poor response, and the flowchart says 'If poor response, add IV magnesium sulfate'."}, {"text": "Montelukast tablet", "why": "Montelukast is a non-steroidal preventer on the NAC chart, not an acute add-on in the flowcharts."}, {"text": "Stop salbutamol and observe", "why": "The flowcharts continue the bronchodilator and add treatment."}, {"text": "Oral antibiotics", "why": "Antibiotics are not in the acute asthma flowcharts."}], "explanation": "Within the first hour the flowchart also starts systemic corticosteroids, then reassesses response 1 hour after starting the bronchodilator.", "cite": [{"src": "ASTHMA", "loc": "slides 15, 16, 18, 20"}]}, {"id": "AS-16", "type": "saq", "week": "FNP2B Wk1 (asthma)", "topic": "Asthma: self-management", "slo": ["SLO1", "SLO2", "SLO4"], "reasoning": true, "prompt": "Before discharge, a parent asks what to do if their child's asthma gets worse again at home. Using the tutorial's content on asthma management and written action plans, outline the education you would give.", "model": "Explain that asthma management aims for good symptom control (normal activity) and to minimise the risk of future attacks, fixed airflow limitation and medication side effects. Give and explain a written asthma action plan: it is personalised, helps detect and treat an exacerbation early, and states when to increase treatment, how to increase it, how long to stay on the increased treatment, and when to seek urgent medical assessment; it depends on patient and family engagement. Teach inhaler technique (pMDI with a spacer, and a face mask if needed), stress adherence, avoiding triggers and self-monitoring of symptoms (symptoms often worsen before PEF), and arrange regular review (every 6 months).", "rubric": [{"point": "Written asthma action plan: early detection and personalised self-management", "cite": [{"src": "ASTHMA", "loc": "slide 25"}]}, {"point": "Action plan says when and how to increase treatment, for how long, and when to seek urgent medical assessment", "cite": [{"src": "ASTHMA", "loc": "slide 26"}]}, {"point": "Inhaler technique: pMDI with spacer (face mask if needed)", "cite": [{"src": "ASTHMA", "loc": "slides 20, 23"}]}, {"point": "Adherence, avoiding triggers, self-monitoring of symptoms", "cite": [{"src": "ASTHMA", "loc": "slides 23-24"}]}, {"point": "Regular review every 6 months", "cite": [{"src": "ASTHMA", "loc": "slide 23"}]}], "cite": [{"src": "ASTHMA", "loc": "slides 20-26"}]}, {"id": "AS-17", "type": "saq", "week": "FNP2B Wk1 (asthma)", "topic": "Asthma: self-management", "slo": ["SLO1", "SLO4"], "reasoning": true, "prompt": "A parent asks whether their child really needs daily preventer medication now that the child is much better. Using the tutorial's goals of asthma management, outline how you would respond.", "model": "Acknowledge the parent's concern and involve the family in decisions. Explain that asthma management has two goals: symptom control (good symptom control, normal activity) and risk reduction (minimising the risk of lung attacks, fixed airflow limitation and medication adverse effects). Feeling better now does not remove the risk of future attacks. Taking medicines as prescribed (adherence), inhaler technique and a written action plan are part of management, with regular review every 6 months.", "rubric": [{"point": "Acknowledges the concern and involves the patient and family", "cite": [{"src": "ASTHMA", "loc": "slide 31"}]}, {"point": "Goal 1: symptom control and normal activity", "cite": [{"src": "ASTHMA", "loc": "slide 22"}]}, {"point": "Goal 2: risk reduction (lung attacks, fixed airflow limitation, medication adverse effects)", "cite": [{"src": "ASTHMA", "loc": "slide 22"}]}, {"point": "Adherence, education and regular review are core parts of management", "cite": [{"src": "ASTHMA", "loc": "slide 23"}]}], "cite": [{"src": "ASTHMA", "loc": "slides 22, 23, 31"}]}, {"id": "AS-18", "type": "saq", "week": "FNP2B Wk1 (asthma)", "topic": "Clinical reasoning cycle", "slo": ["SLO2"], "prompt": "Name the eight phases of the Clinical Reasoning Cycle, in order.", "model": "1. Notice the person's current situation. 2. Collect cues/information (review, gather, recall). 3. Process information (analyse, discriminate, relate, infer, match, predict). 4. Identify priority needs and concerns (nursing diagnosis). 5. Establish goals. 6. Take action. 7. Evaluate. 8. Reflect.", "rubric": [{"point": "Notice → Collect cues/information", "cite": [{"src": "ASTHMA", "loc": "slide 7"}]}, {"point": "Process information", "cite": [{"src": "ASTHMA", "loc": "slide 7"}]}, {"point": "Identify priority needs and concerns → Establish goals", "cite": [{"src": "ASTHMA", "loc": "slide 7"}]}, {"point": "Take action → Evaluate → Reflect", "cite": [{"src": "ASTHMA", "loc": "slide 7"}]}], "cite": [{"src": "ASTHMA", "loc": "slide 7"}]}, {"id": "AS-19", "type": "mcq", "week": "FNP2B Wk1 (asthma)", "topic": "Asthma: escalation", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "A child with acute asthma becomes drowsy with soft breath sounds. Continuous nebulised salbutamol driven by oxygen has been started. Apart from treatment, what does the Handbook figure direct?", "options": [{"text": "Arrange immediate transfer to a higher-level care area and notify senior staff", "correct": true, "why": "The life-threatening pathway says 'Arrange immediate transfer to higher-level care area, notify senior staff'."}, {"text": "Recheck observations in 4 hours", "why": "The figure says to 'Reassess immediately after starting salbutamol'."}, {"text": "Switch to a pMDI and spacer so the child can go home", "why": "A pMDI with spacer is considered when breathing improves; this child is deteriorating."}, {"text": "Stop oxygen once the nebuliser finishes", "why": "The figure says to maintain SaO2 of at least 95% in children, so oxygen continues."}], "explanation": "Drowsy and soft/absent breath sounds are life-threatening findings. Treatment and escalation happen together.", "cite": [{"src": "ASTHMA", "loc": "slide 15"}]}, {"id": "CV-01", "type": "mcq", "week": "Cardiac lecture", "topic": "Heart sounds", "slo": ["SLO1"], "stem": "The first heart sound (S1) is produced by closure of which valves?", "options": [{"text": "Mitral and tricuspid", "correct": true, "why": "The slide labels S1 as closure of the mitral and tricuspid (AV) valves, at the start of systole."}, {"text": "Aortic and pulmonary", "why": "Aortic and pulmonary (semilunar) closure is S2 (A2, P2)."}, {"text": "Mitral and aortic", "why": "These close at different times: mitral with S1, aortic with S2."}, {"text": "Tricuspid and pulmonary", "why": "These are on the right side but close at different times: tricuspid with S1, pulmonary with S2."}], "explanation": "S1 = AV valves close (start of ventricular systole). S2 = semilunar valves close (start of diastole).", "cite": [{"src": "ACS", "loc": "slides 15, 17"}]}, {"id": "CV-02", "type": "mcq", "week": "Cardiac lecture", "topic": "Cardiovascular assessment", "slo": ["SLO1"], "stem": "You palpate a radial pulse that is weak and thready. On the lecture's pulse-strength scale, how is this graded?", "options": [{"text": "1+", "correct": true, "why": "1+ = weak, diminished, thready."}, {"text": "2+", "why": "2+ = normal/strong."}, {"text": "3+", "why": "3+ = full, bounding."}, {"text": "0", "why": "0 = absent/non-palpable."}], "explanation": "Pulse sites shown: carotid, brachial, radial, ulnar, femoral, popliteal, posterior tibial, dorsalis pedis.", "cite": [{"src": "ACS", "loc": "slide 10"}]}, {"id": "CV-03", "type": "mcq", "week": "Cardiac lecture", "topic": "Acute coronary syndrome", "slo": ["SLO2"], "stem": "Acute coronary syndrome (ACS) includes which three conditions?", "options": [{"text": "Unstable angina, NSTEMI and STEMI", "correct": true, "why": "The ACS slide lists unstable angina, non-ST-elevation MI and ST-elevation MI."}, {"text": "Stable angina, heart failure and STEMI", "why": "Stable angina and heart failure are not on the ACS list."}, {"text": "Atrial fibrillation, VT and VF", "why": "These are rhythms covered on slides 25-31, not the three conditions listed under ACS on slide 32."}, {"text": "Hypertension, stroke and cardiomyopathy", "why": "These are other cardiovascular diseases on slide 3, not ACS."}], "explanation": "ACS is one of several disorders grouped as cardiovascular disease (slide 3).", "cite": [{"src": "ACS", "loc": "slides 3, 25-32"}]}, {"id": "CV-04", "type": "mcq", "week": "Cardiac lecture", "topic": "Acute coronary syndrome", "slo": ["SLO2", "SLO4"], "reasoning": true, "stem": "Which of these is NOT part of the IMMEDIATE management of ACS listed in the lecture?", "options": [{"text": "Statin", "correct": true, "why": "Statins are listed under ongoing 'Medications' (with anticoagulants, beta-blockers and ACE inhibitors), not immediate management."}, {"text": "Oxygen", "why": "Oxygen is listed under immediate management."}, {"text": "Nitroglycerin", "why": "Nitroglycerin is listed under immediate management."}, {"text": "Aspirin", "why": "Aspirin is listed under immediate management, with oxygen, nitroglycerin and morphine."}], "explanation": "ACS treatment in three tiers: (1) immediate (oxygen, nitroglycerin, morphine, aspirin); (2) medications; (3) reperfusion (PCI, thrombolytics, CABG).", "cite": [{"src": "ACS", "loc": "slide 34"}]}, {"id": "CV-05", "type": "mcq", "week": "Cardiac lecture", "topic": "Acute coronary syndrome", "slo": ["SLO2"], "stem": "Which blood tests are named in the lecture as cardiac biomarkers?", "options": [{"text": "Troponin, creatine kinase (CK) and CK-MB", "correct": true, "why": "The slide lists troponin, CK and CK-MB as cardiac biomarkers."}, {"text": "Lipid profile and fasting glucose", "why": "These are on the same slide but are not biomarkers of cardiac injury."}, {"text": "FBC and U&C", "why": "Not named as cardiac biomarkers in the lecture."}, {"text": "Blood cultures", "why": "Blood cultures are not on the lecture's list of cardiac biomarkers."}], "explanation": "Other cardiovascular diagnostics: ECG, echocardiogram, exercise stress test, coronary angiography, Holter monitor, cardiac CT/MRI.", "cite": [{"src": "ACS", "loc": "slides 20-21"}]}, {"id": "CV-06", "type": "mcq", "week": "Cardiac lecture", "topic": "ECG rhythms", "slo": ["SLO2"], "reasoning": true, "stem": "A monitored patient's ECG shows a grossly irregular, chaotic trace with no identifiable P waves and bizarre QRS complexes varying in shape, and no rate to count. What is the rhythm and the action?", "options": [{"text": "Ventricular fibrillation: immediate cardioversion/defibrillation", "correct": true, "why": "These are the VF features on slide 31, and the listed action is immediate cardioversion/defibrillation."}, {"text": "Ventricular tachycardia: treat only if it is sustained", "why": "VT is regular with a rate of 100–250. This trace is grossly irregular with no real rate."}, {"text": "Atrial fibrillation: continue monitoring", "why": "AF (slide 29) has identifiable QRS complexes. VF has no organised complexes and is life-threatening."}, {"text": "Normal sinus rhythm with artefact", "why": "Normal sinus rhythm is shown on the normal ECG slides (26-28). The trace described matches the VF criteria on slide 31."}], "explanation": "Second-year students should recognise NSR and the life-threatening arrhythmias VT, VF and asystole.", "cite": [{"src": "ACS", "loc": "slides 25-31"}]}, {"id": "CV-07", "type": "mcq", "week": "Cardiac lecture", "topic": "ECG rhythms", "slo": ["SLO2"], "stem": "Which features describe ventricular tachycardia on the lecture slide?", "options": [{"text": "Rate 100–250, regular, P waves usually not identifiable, QRS 0.12 s or greater and bizarre", "correct": true, "why": "These are the VT criteria on slide 30."}, {"text": "No real rate, grossly irregular, no P waves", "why": "Those are the VF features (slide 31)."}, {"text": "Rate over 300 with a P wave before every QRS", "why": "Not the VT criteria on slide 30: rate 100 to 250, P waves usually not identifiable."}, {"text": "Irregular rhythm with narrow QRS complexes", "why": "Slide 30 describes VT as regular with QRS 0.12 s or greater and bizarre."}], "explanation": "Treat VT if sustained, symptomatic or linked to organic heart disease. Options: DC cardioversion, or IV procainamide, lignocaine or a class III antiarrhythmic if haemodynamically unstable.", "cite": [{"src": "ACS", "loc": "slides 30-31"}]}, {"id": "CV-08", "type": "mcq", "week": "Cardiac lecture", "topic": "ECG basics", "slo": ["SLO1"], "skill": "ecg", "stem": "On the ECG, what does the QRS complex represent?", "options": [{"text": "Activation of the ventricles", "correct": true, "why": "The slide labels QRS as 'activation of the ventricles'."}, {"text": "Activation of the atria", "why": "That is the P wave."}, {"text": "Recovery (repolarisation) of the ventricles", "why": "The T wave is labelled the 'recovery wave'."}, {"text": "Closure of the semilunar valves", "why": "That is the heart sound S2, not an ECG wave."}], "explanation": "P = atrial activation. QRS = ventricular activation. T = recovery wave.", "cite": [{"src": "ACS", "loc": "slides 17, 27"}]}, {"id": "CV-09", "type": "mcq", "week": "Cardiac lecture", "topic": "Cardiovascular assessment", "slo": ["SLO1", "SLO2"], "stem": "Using the AHA blood pressure categories in the lecture, how is a reading of 134/86 mmHg classified?", "options": [{"text": "High blood pressure (hypertension) stage 1", "correct": true, "why": "Stage 1 = systolic 130–139 OR diastolic 80–89."}, {"text": "Elevated", "why": "Elevated = 120–129 AND diastolic below 80. The diastolic of 86 is too high."}, {"text": "Hypertension stage 2", "why": "Stage 2 = 140 or higher OR 90 or higher."}, {"text": "Normal", "why": "Normal = below 120 AND below 80."}], "explanation": "Hypertensive crisis = higher than 180 and/or higher than 120: consult the doctor immediately.", "cite": [{"src": "ACS", "loc": "slide 19"}]}, {"id": "CV-10", "type": "mcq", "week": "Cardiac lecture", "topic": "Acute coronary syndrome", "slo": ["SLO2"], "stem": "Which of these is NOT on the lecture's list of common ACS symptoms?", "options": [{"text": "High fever", "correct": true, "why": "Fever is not on the ACS list. It appears on the pneumonia symptom diagram."}, {"text": "Cold, clammy skin", "why": "Cold, clammy skin is on the ACS list."}, {"text": "Nausea or vomiting", "why": "Nausea or vomiting is on the ACS list."}, {"text": "Radiating pain", "why": "Radiating pain is on the ACS list."}], "explanation": "Common ACS symptoms: chest pain or discomfort, radiating pain, SOB, nausea/vomiting, cold clammy skin, light-headedness or dizziness, palpitations, fatigue.", "cite": [{"src": "ACS", "loc": "slide 33"}, {"src": "COPD", "loc": "slide 13"}]}, {"id": "CV-11", "type": "saq", "week": "Cardiac lecture", "topic": "Acute coronary syndrome", "slo": ["SLO1", "SLO2", "SLO4"], "reasoning": true, "prompt": "A patient reports chest discomfort radiating down the arm, with nausea and cold, clammy skin. Using the cardiac lecture, name the likely syndrome, two diagnostic tests you would expect, the immediate management, and two things to prioritise after discharge.", "model": "These symptoms fit acute coronary syndrome (unstable angina, NSTEMI or STEMI). Expected tests: ECG, and cardiac biomarkers (troponin, CK, CK-MB). Immediate management: oxygen, nitroglycerin, morphine, aspirin. Then medications (anticoagulants, beta-blockers, ACE inhibitors, statins) and reperfusion (PCI, thrombolytics or CABG). After discharge: cardiac rehabilitation, adherence to medications, lifestyle changes and regular check-ups.", "rubric": [{"point": "Identifies ACS from the symptoms", "cite": [{"src": "ACS", "loc": "slides 32-33"}]}, {"point": "ECG and cardiac biomarkers (troponin/CK/CK-MB)", "cite": [{"src": "ACS", "loc": "slides 20-21"}]}, {"point": "Immediate management: oxygen, nitroglycerin, morphine, aspirin", "cite": [{"src": "ACS", "loc": "slide 34"}]}, {"point": "Reperfusion options: PCI, thrombolytics, CABG", "cite": [{"src": "ACS", "loc": "slide 34"}]}, {"point": "After discharge: cardiac rehab, medication adherence, lifestyle, check-ups", "cite": [{"src": "ACS", "loc": "slide 35"}]}], "cite": [{"src": "ACS", "loc": "slides 20-35"}]}, {"id": "CV-12", "type": "mcq", "week": "Cardiac lecture", "topic": "Cardiovascular assessment", "slo": ["SLO1", "SLO2"], "reasoning": true, "stem": "A patient's BP is 190/125 mmHg. How do the AHA categories in the lecture classify this, and what action do they state?", "options": [{"text": "Hypertensive crisis: consult the doctor immediately", "correct": true, "why": "Hypertensive crisis = systolic higher than 180 and/or diastolic higher than 120, with 'consult your doctor immediately'."}, {"text": "Hypertension stage 2: recheck at the next routine observations", "why": "The reading exceeds 180 and 120, which is the crisis category with an immediate action."}, {"text": "Hypertension stage 1: lifestyle advice", "why": "Stage 1 is 130–139 or 80–89."}, {"text": "Elevated: no action needed", "why": "Elevated is 120–129 with diastolic below 80."}], "explanation": "Findings → category → action: the chart builds the escalation into the crisis band.", "cite": [{"src": "ACS", "loc": "slide 19"}]}, {"id": "CV-13", "type": "mcq", "week": "Cardiac lecture", "topic": "Heart sounds", "slo": ["SLO1"], "stem": "Which of these is NOT one of the cardiac auscultation areas shown in the lecture?", "options": [{"text": "Axillary area", "correct": true, "why": "The areas shown are aortic, pulmonic, tricuspid, apical and epigastric; axillary is not one of them."}, {"text": "Aortic area", "why": "Aortic is shown."}, {"text": "Apical area", "why": "Apical is shown."}, {"text": "Epigastric area", "why": "Epigastric is shown."}], "explanation": "Cardiac auscultation also includes listening for a bruit (e.g. over the carotid) and to the heart sounds.", "cite": [{"src": "ACS", "loc": "slides 14, 16"}]}, {"id": "CV-14", "type": "mcq", "week": "Cardiac lecture", "topic": "ECG rhythms", "slo": ["SLO2"], "stem": "According to the VT slide, when should ventricular tachycardia be treated?", "options": [{"text": "If it is sustained, symptomatic, or associated with organic heart disease", "correct": true, "why": "The slide says 'Treat if VT is sustained, symptomatic or associated with organic heart disease'."}, {"text": "Only once it becomes VF", "why": "VT has its own treatment criteria on the slide."}, {"text": "Never; VT resolves on its own", "why": "The slide lists treatments, including DC cardioversion."}, {"text": "Only if the heart rate is below 100", "why": "VT is defined by a rate of 100–250."}], "explanation": "Repeated episodes: surgical ablation, or pacing with an implanted cardioverter-defibrillator (ICD).", "cite": [{"src": "ACS", "loc": "slide 30"}]}, {"id": "CP-01", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Pneumonia", "slo": ["SLO2"], "reasoning": true, "stem": "A patient has high fever, a productive cough with sputum, shortness of breath, a high heart rate and low blood pressure. Which condition's symptom diagram in the loaded slides do these match?", "options": [{"text": "Pneumonia", "correct": true, "why": "The 'Main symptoms of infectious pneumonia' diagram lists high fever (systemic), cough with sputum and shortness of breath (lungs), high heart rate (heart) and low blood pressure (vascular)."}, {"text": "Acute coronary syndrome", "why": "The ACS symptom list does not include fever or cough with sputum."}, {"text": "Stroke", "why": "The F.A.S.T. signs are face drooping, arm weakness and speech problems, none of which are described here."}, {"text": "Stable COPD", "why": "The typical symptoms on the stable-COPD chart do not include high fever or low blood pressure."}], "explanation": "Grouping cues and relating them to one another is the 'Process information' phase of the Clinical Reasoning Cycle.", "cite": [{"src": "COPD", "loc": "slides 13, 29"}, {"src": "ACS", "loc": "slide 33"}, {"src": "STROKE", "loc": "slide 19"}, {"src": "ASTHMA", "loc": "slide 7"}]}, {"id": "CP-03", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "COPD: oxygen", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "reasoning": true, "stem": "A colleague says oxygen should never be given to a person with COPD. Which statement is supported by the COPD tutorial material?", "options": [{"text": "The stepwise COPD chart says to consider oxygen therapy for hypoxaemia", "correct": true, "why": "The chart's moderate-to-severe column says 'Consider oxygen therapy for hypoxaemia'."}, {"text": "The chart says oxygen is contraindicated in COPD", "why": "The chart does not say this; it lists oxygen therapy for hypoxaemia."}, {"text": "The chart makes oxygen the first step for all mild COPD", "why": "The first pharmacological step is short-acting relievers (SABA or SAMA). Oxygen appears in the moderate-to-severe column, for hypoxaemia."}, {"text": "The tutorial sets a target SpO2 of 100% for COPD", "why": "No COPD SpO2 target is given in the loaded slides."}], "explanation": "The tutorial poses 'do not give oxygen because of COPD' as a discussion question with a video, and the COPD target SpO2 range is not in the loaded material. Check your 93225 lab guide (see Gaps).", "cite": [{"src": "COPD", "loc": "slides 22, 29"}]}, {"id": "CP-04", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Infection control", "slo": ["SLO1", "SLO2"], "reasoning": true, "stem": "A viral component is suspected in a patient's COPD exacerbation. According to the tutorial, what infection control process applies?", "options": [{"text": "Isolation with droplet and contact precautions", "correct": true, "why": "The slide's answer is 'Isolation with droplet precautions & contact'."}, {"text": "Standard precautions only", "why": "The tutorial specifies isolation with droplet and contact precautions."}, {"text": "Airborne precautions in a negative-pressure room only", "why": "The tutorial specifies droplet and contact precautions."}, {"text": "No isolation until the swab result returns", "why": "Isolation applies when a viral component is suspected."}], "explanation": "Viral swabs (naso-oropharynx) are collected from older people or those with chronic lung disease presenting with dyspnoea or chest/URTI/LRTI symptoms. Prevention: immunisation (COVID, flu vaccine); the stepwise chart also recommends annual influenza and pneumococcal vaccines.", "cite": [{"src": "COPD", "loc": "slides 23, 29"}]}, {"id": "CP-05", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "COPD: management", "slo": ["SLO2"], "stem": "On the Lung Foundation 'Stepwise management of stable COPD', which FEV1 range defines MODERATE COPD?", "options": [{"text": "40–59% predicted", "correct": true, "why": "Moderate: FEV1 = 40–59% predicted."}, {"text": "60–80% predicted", "why": "60–80% predicted is mild."}, {"text": "Less than 40% predicted", "why": "Below 40% predicted is severe."}, {"text": "Above 80% predicted", "why": "The chart's mild band stops at 80%."}], "explanation": "Typical moderate symptoms: breathless walking on level ground, increasing limitation of daily activities, cough and sputum, and exacerbations needing oral corticosteroids and/or antibiotics.", "cite": [{"src": "COPD", "loc": "slide 29"}]}, {"id": "CP-06", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "COPD: medicines", "slo": ["SLO4"], "stem": "According to the stepwise COPD management chart, which inhaled medicines do you START with?", "options": [{"text": "Short-acting relievers used as needed: SABA or SAMA", "correct": true, "why": "The chart says: start with short-acting relievers (used as needed), SABA or SAMA."}, {"text": "Inhaled corticosteroid alone", "why": "The chart says to consider adding an ICS later, on top of long-acting bronchodilators."}, {"text": "Triple therapy (ICS/LAMA/LABA)", "why": "Triple therapy is the last step on the chart."}, {"text": "Montelukast", "why": "Montelukast is not on the COPD stepwise chart."}], "explanation": "Next step: add long-acting bronchodilators (LAMA or LABA). The chart also says to assess and optimise inhaler device technique at every visit.", "cite": [{"src": "COPD", "loc": "slide 29"}]}, {"id": "CP-07", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "COPD: person-centred care", "slo": ["SLO1"], "reasoning": true, "stem": "For a person admitted with a COPD exacerbation, when does the tutorial say discharge planning should begin?", "options": [{"text": "At admission", "correct": true, "why": "The slide says 'Planning for discharge at admission': assistance at home, GP, respiratory physician and pharmacist contact."}, {"text": "The day before discharge", "why": "The tutorial places discharge planning at admission."}, {"text": "Only after spirometry results return", "why": "Not stated; discharge planning starts at admission."}, {"text": "After discharge, by the GP", "why": "The tutorial places discharge planning at admission, as part of inpatient care."}], "explanation": "Also consider community nursing options, ask what has changed recently, and involve family or partner.", "cite": [{"src": "COPD", "loc": "slide 27"}]}, {"id": "CP-09", "type": "saq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "COPD: person-centred care", "slo": ["SLO1"], "reasoning": true, "prompt": "A person is admitted with a COPD exacerbation. What social history and health literacy areas does the tutorial suggest you explore, and why do they matter for discharge?", "model": "Social determinants of health: what is happening at home, socially and at work; carer responsibilities; financial state; access to a GP and pharmacy; whether they live with a smoker. Health literacy: their understanding of their illness, how they find out about new interventions, and education needs. History and adherence: what has changed recently, and what family or partner think. These shape discharge planning, which starts at admission: assistance at home, GP, respiratory physician and pharmacist contact, and community nursing options.", "rubric": [{"point": "Home, social and work situation; carer responsibilities", "cite": [{"src": "COPD", "loc": "slide 25"}]}, {"point": "Finances; access to GP and pharmacy; lives with a smoker", "cite": [{"src": "COPD", "loc": "slide 25"}]}, {"point": "Health literacy: understanding of illness, sources of information, education", "cite": [{"src": "COPD", "loc": "slide 26"}]}, {"point": "Adherence, recent changes, involving family or partner", "cite": [{"src": "COPD", "loc": "slide 27"}]}, {"point": "Discharge planning from admission (home help, GP, respiratory physician, pharmacist, community nursing)", "cite": [{"src": "COPD", "loc": "slide 27"}]}], "cite": [{"src": "COPD", "loc": "slides 25-27"}]}, {"id": "CP-10", "type": "saq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "Pneumonia", "slo": ["SLO2"], "reasoning": true, "prompt": "For each of these findings in a patient with suspected pneumonia, name the body system it sits under on the tutorial's pneumonia symptom diagram: high fever, high heart rate, low blood pressure, cough with sputum.", "model": "High fever → systemic. High heart rate → heart. Low blood pressure → vascular. Cough with sputum or phlegm → lungs (with shortness of breath, pleuritic chest pain and haemoptysis).", "rubric": [{"point": "High fever → systemic", "cite": [{"src": "COPD", "loc": "slide 13"}]}, {"point": "High heart rate → heart", "cite": [{"src": "COPD", "loc": "slide 13"}]}, {"point": "Low blood pressure → vascular", "cite": [{"src": "COPD", "loc": "slide 13"}]}, {"point": "Cough with sputum → lungs", "cite": [{"src": "COPD", "loc": "slide 13"}]}], "cite": [{"src": "COPD", "loc": "slide 13"}]}, {"id": "CP-11", "type": "mcq", "
