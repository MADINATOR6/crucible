week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "COPD: management", "slo": ["SLO1", "SLO2"], "stem": "Which non-pharmacological RISK REDUCTION actions does the Lung Foundation stepwise COPD chart list?", "options": [{"text": "Check smoking status and support cessation; recommend annual influenza and pneumococcal vaccines", "correct": true, "why": "These are the listed risk-reduction actions."}, {"text": "Start triple inhaled therapy", "why": "That is a pharmacological step, not non-pharmacological risk reduction."}, {"text": "Bed rest and reduced activity", "why": "The chart says to encourage regular exercise and physical activity (optimise function)."}, {"text": "Avoid all vaccines during winter", "why": "The chart recommends vaccines."}], "explanation": "The other non-pharmacological headings are: optimise function, consider co-morbidities, and refer symptomatic patients to pulmonary rehabilitation.", "cite": [{"src": "COPD", "loc": "slide 29"}]}, {"id": "CP-12", "type": "mcq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "COPD: management", "slo": ["SLO1", "SLO2"], "stem": "Which co-morbidities does the stepwise COPD chart say to consider especially?", "options": [{"text": "Cardiovascular disease, anxiety, depression, lung cancer and osteoporosis", "correct": true, "why": "The chart says 'Consider co-morbidities especially cardiovascular disease, anxiety, depression, lung cancer and osteoporosis'."}, {"text": "Asthma and hay fever only", "why": "Not the co-morbidities named on the chart."}, {"text": "Stroke and epilepsy", "why": "Not the co-morbidities named on the chart."}, {"text": "None; COPD is managed on its own", "why": "The chart explicitly lists co-morbidities to consider."}], "explanation": "Considering co-morbidities, alongside risk reduction, optimising function and pulmonary rehabilitation, is one of the chart's non-pharmacological steps.", "cite": [{"src": "COPD", "loc": "slide 29"}]}, {"id": "CP-13", "type": "saq", "week": "FNP2B Wk2 (COPD & pneumonia)", "topic": "COPD: management", "slo": ["SLO1", "SLO2", "SLO4"], "prompt": "A person is ready for discharge after a COPD exacerbation. Using the tutorial's discharge prompts and the stepwise COPD chart, outline a discharge plan.", "model": "Aim to improve ventilation, promote secretion removal, prevent complications and progression of symptoms, promote the person's comfort and participation in care, and improve quality of life, using the COPD Management Plan. From the stepwise chart: risk reduction (smoking status and cessation support; annual influenza and pneumococcal vaccines); optimise function (regular exercise, nutrition review, education, GP management plan and written COPD action plan, regular review); consider co-morbidities; refer to pulmonary rehabilitation if the person is symptomatic; assess and optimise inhaler technique at every visit. Link with GP, respiratory physician, pharmacist and community nursing (planned from admission).", "rubric": [{"point": "Discharge goals: ventilation, secretion removal, preventing complications, comfort/participation, quality of life", "cite": [{"src": "COPD", "loc": "slide 28"}]}, {"point": "Smoking cessation support and vaccines (influenza, pneumococcal)", "cite": [{"src": "COPD", "loc": "slide 29"}]}, {"point": "Exercise, nutrition, education, written COPD action plan", "cite": [{"src": "COPD", "loc": "slide 29"}]}, {"point": "Pulmonary rehabilitation referral if symptomatic; inhaler technique checked each visit", "cite": [{"src": "COPD", "loc": "slide 29"}]}, {"point": "GP, respiratory physician, pharmacist, community nursing", "cite": [{"src": "COPD", "loc": "slide 27"}]}], "cite": [{"src": "COPD", "loc": "slides 27-29"}]}, {"id": "HF-01", "type": "mcq", "week": "Module 3", "topic": "Heart failure", "slo": ["SLO1", "SLO2"], "reasoning": true, "stem": "A patient with heart failure has gained more than 2 kg over 3 days on the daily weight chart. According to Lecture 3, what should you do?", "options": [{"text": "Escalate: weight up more than 2 kg in 3 days is an escalation trigger", "correct": true, "why": "Lecture 3 lists 'Weight up more than 2 kg in 3 days' under 'Escalate if' for the daily charts."}, {"text": "Nothing yet: weigh again in a week", "why": "The lecture tracks the daily trend and escalates at more than 2 kg in 3 days."}, {"text": "Withhold all heart failure medicines", "why": "The lecture says doses are deliberately increased over time: 'Don't just withhold'. Check the patient and ask the MO."}, {"text": "Increase oral fluids to support the kidneys", "why": "Fluid and sodium restriction is part of daily heart failure care when prescribed; weight gain suggests fluid retention."}], "explanation": "Slow deterioration shows up across charts, not in one set of observations: daily weight, fluid balance across days, a creeping HR/RR, rising oxygen needs.", "cite": [{"src": "L3", "loc": "p.15, p.34-35"}]}, {"id": "HF-02", "type": "mcq", "week": "Module 3", "topic": "Heart failure", "slo": ["SLO1", "SLO4"], "stem": "How should daily weights be taken for a patient with heart failure, according to Lecture 3?", "options": [{"text": "Same time, same scales, same clothing, before breakfast", "correct": true, "why": "This is the lecture's daily weight standard."}, {"text": "Whenever convenient during the shift", "why": "The lecture specifies the same time, scales and clothing so the trend is meaningful."}, {"text": "Only on admission and discharge", "why": "Daily weight is part of daily heart failure care."}, {"text": "After the evening meal, to include fluid intake", "why": "The lecture says before breakfast."}], "explanation": "At home the patient weighs every morning after the toilet, before breakfast, on the same scales, and writes it down.", "cite": [{"src": "L3", "loc": "p.15, p.37"}]}, {"id": "HF-03", "type": "mcq", "week": "Module 3", "topic": "Heart failure", "slo": ["SLO2", "SLO4"], "reasoning": true, "stem": "A heart failure patient is due their beta blocker. Their pulse is low and potassium has risen since yesterday. What does Lecture 3 advise?", "options": [{"text": "Ask the MO before giving it", "correct": true, "why": "'Low BP or pulse, or a rising potassium or creatinine – ask the MO before you give it.'"}, {"text": "Give it as charted; doses are always given", "why": "The lecture says to check HR, BP, potassium and renal function first, and ask the MO before giving it if BP or pulse is low, or potassium or creatinine is rising."}, {"text": "Withhold it permanently and document", "why": "The lecture warns these doses are deliberately increased over time: 'Don't just withhold'."}, {"text": "Halve the dose on nursing judgement", "why": "The lecture's action is to ask the MO, not change the dose."}], "explanation": "The four HFrEF pillars are a beta blocker, an ACE inhibitor/ARNI, an MRA and an SGLT2 inhibitor. Before any of them, check heart rate, BP, and the latest potassium and renal function.", "cite": [{"src": "L3", "loc": "p.34"}]}, {"id": "HF-04", "type": "mcq", "week": "Module 3", "topic": "Heart failure", "slo": ["SLO2"], "reasoning": true, "stem": "A cardiac patient develops new bilateral, dependent ankle oedema with increasing breathlessness. What does Lecture 3 say?", "options": [{"text": "Bilateral dependent oedema fits a cardiac cause; with breathlessness, escalate for urgent review", "correct": true, "why": "The lecture says bilateral and dependent fits cardiac, and to escalate urgently if rapid onset or accompanied by breathlessness."}, {"text": "It is most likely a DVT", "why": "The lecture links DVT assessment to unilateral oedema with warmth or calf pain."}, {"text": "It is expected and needs no report", "why": "The lecture says to always report to the nurse in charge and document it."}, {"text": "Encourage fluids and elevate the legs only", "why": "The lecture's actions are to compare the weight trend, review fluid balance, and check JVD, breath sounds and SpO2, then escalate with breathlessness."}], "explanation": "Oedema may mean worsening right-sided or biventricular heart failure, drug causes, low albumin, or venous/lymphatic obstruction.", "cite": [{"src": "L3", "loc": "p.11"}]}, {"id": "HF-05", "type": "mcq", "week": "Module 3", "topic": "Heart failure", "slo": ["SLO1", "SLO4"], "stem": "Before discharge, which instruction does Lecture 3 give a heart failure patient about their fluid tablet (diuretic)?", "options": [{"text": "Take it in the morning, not at night", "correct": true, "why": "The lecture says 'Take the fluid tablet in the morning, not at night'."}, {"text": "Take it at bedtime so it works overnight", "why": "The lecture says morning, not night."}, {"text": "Skip it on days you feel well", "why": "Not the instruction given. The lecture says to take the fluid tablet in the morning, not at night."}, {"text": "Take it only if weight goes up", "why": "Not the instruction given. The lecture says to call the HF nurse or GP if weight goes up about 2 kg in two days."}], "explanation": "Also: know the fluid limit in cups, weigh every morning, and call 000 for chest pain or breathlessness at rest. Check understanding with teach-back, and refer to cardiac rehab before discharge.", "cite": [{"src": "L3", "loc": "p.37"}]}, {"id": "HF-06", "type": "mcq", "week": "Module 3", "topic": "Cardiac escalation", "slo": ["SLO2"], "reasoning": true, "stem": "A cardiac patient with a urinary catheter has passed 80 mL of urine over the last 4 hours. According to Lecture 3, what is the right response?", "options": [{"text": "Escalate for urgent review: under 100 mL over 4 hours is the trigger", "correct": true, "why": "Escalate if low urine output persists for 4 hours (under 100 mL over 4 hours, or under 0.5 mL/kg/hr via an IDC)."}, {"text": "Recheck at the end of the shift", "why": "The 4-hour threshold has already been met."}, {"text": "Give a fluid bolus without review", "why": "Low output may be 'dry' or 'congested'; the lecture's actions are checks and escalation, not an independent bolus."}, {"text": "Assume the catheter is blocked and do nothing else", "why": "Check catheter patency, but also fluid balance, BP, recent diuretics and renal function, and escalate."}], "explanation": "In heart failure, low urine output can mean congestion: the kidneys are backed up, not short of fluid.", "cite": [{"src": "L3", "loc": "p.10"}]}, {"id": "HF-07", "type": "saq", "week": "Module 3", "topic": "Heart failure", "slo": ["SLO1", "SLO2", "SLO4"], "prompt": "Outline the daily nursing care for a patient with heart failure, using Lecture 3.", "model": "Fluid and sodium restriction where prescribed, helping the patient tolerate it; fluid balance chart including urine output and response to diuretics; daily weight (same time, scales and clothing, before breakfast); respiratory status, lung sounds, oedema and JVP; sit upright to ease breathing. Document mobilisation specifically, pace care with rest, and manage falls risk (postural drop after diuretics). Watch nutrition (poor intake can signal gut congestion). Diuretics. Before: BP, weight, fluid balance, latest electrolytes and renal function. After: urine output, postural BP, weight trend, potassium and magnesium.", "rubric": [{"point": "Fluid/sodium restriction and fluid balance with urine output", "cite": [{"src": "L3", "loc": "p.35"}]}, {"point": "Daily weight done the same way each day", "cite": [{"src": "L3", "loc": "p.15, p.35"}]}, {"point": "Respiratory status, lung sounds, oedema, JVP; upright positioning", "cite": [{"src": "L3", "loc": "p.35"}]}, {"point": "Mobility, pacing and falls risk (postural drop after diuretics)", "cite": [{"src": "L3", "loc": "p.35"}]}, {"point": "Diuretic checks. Before: BP, weight, fluid balance, electrolytes, renal function. After: urine output, postural BP, weight trend, potassium, magnesium", "cite": [{"src": "L3", "loc": "p.34"}]}], "cite": [{"src": "L3", "loc": "p.34-35"}]}, {"id": "M1-01", "type": "mcq", "week": "Module 1", "topic": "When to reassess", "slo": ["SLO1", "SLO2"], "reasoning": true, "stem": "A concern is raised during handover about a patient's change in behaviour. How should this affect A–H assessment?", "options": [{"text": "Conduct an A–H assessment to assess the change", "correct": true, "why": "The lecture identifies both handover concerns and changes in behaviour as indications for A–H assessment."}, {"text": "Wait until an emergency is confirmed", "why": "A–H is not just for emergencies; it establishes a baseline and detects change early."}, {"text": "Use the admission assessment without reassessing", "why": "The lecture directs repeat A–H assessment when the condition changes or there is concern."}, {"text": "Assess only if the concern includes abnormal vital signs", "why": "Behavioural change and handover concerns are themselves listed indications."}], "explanation": "An earlier assessment is a snapshot. A new concern calls for reassessment and comparison with the patient's baseline and trends.", "cite": [{"src": "L1", "loc": "p.5"}, {"src": "L1", "loc": "p.31"}]}, {"id": "M1-02", "type": "mcq", "week": "Module 1", "topic": "Airway sounds", "slo": ["SLO2"], "reasoning": true, "stem": "During airway assessment, a patient with reduced consciousness has snoring respirations. Which interpretation matches the lecture?", "options": [{"text": "The tongue may be falling back", "correct": true, "why": "The airway section links snoring with the tongue falling back in reduced consciousness."}, {"text": "Snoring is the sound used to identify upper-airway secretions", "why": "The lecture associates upper-airway secretions with gurgling, rather than snoring."}, {"text": "Snoring is the high-pitched inspiratory sound described as stridor", "why": "The lecture distinguishes snoring from high-pitched inspiratory stridor."}, {"text": "Snoring demonstrates the same airway finding as clear speech in full sentences", "why": "Speech quality is assessed separately; snoring is linked to the tongue falling back."}], "explanation": "Distinguishing gurgling, snoring and stridor helps interpret the airway finding rather than recording only 'noisy breathing'.", "cite": [{"src": "L1", "loc": "p.9"}]}, {"id": "M1-03", "type": "mcq", "week": "Module 1", "topic": "Respiratory rate", "slo": ["SLO2"], "stem": "How does Lecture 1 direct the nurse to measure respiratory rate?", "options": [{"text": "Count manually for a full 60 seconds without announcing the count", "correct": true, "why": "The lecture specifies a full minute without telling the patient, because awareness can alter their breathing rate."}, {"text": "Estimate the rate from the patient's overall appearance", "why": "The lecture explicitly says to count for a full minute and not estimate."}, {"text": "Ask the patient to consciously control their breathing during the count", "why": "The lecture warns that patients who know they are being counted can alter their breathing and falsify the reading."}, {"text": "Use SpO2 in place of a respiratory-rate count", "why": "SpO2 is listed separately; manual respiratory-rate counting remains the primary tool for measuring rate."}], "explanation": "The lecture describes respiratory rate as an early, sensitive sign of deterioration and requires an actual full-minute count.", "cite": [{"src": "L1", "loc": "p.12"}]}, {"id": "M1-04", "type": "mcq", "week": "Module 1", "topic": "Perfusion cues", "slo": ["SLO2"], "reasoning": true, "stem": "A circulation assessment finds cold, pale hands and delayed capillary refill. Which interpretation is supported by Lecture 1?", "options": [{"text": "These findings suggest reduced perfusion", "correct": true, "why": "Cold, pale extremities are linked to vasoconstriction/reduced perfusion, and delayed refill may suggest reduced perfusion."}, {"text": "These are the lecture's signs of good peripheral perfusion", "why": "The lecture associates warm extremities with good perfusion and cold, pale extremities with reduced perfusion."}, {"text": "Peripheral findings can be ignored if a central assessment has been done", "why": "The circulation section directs assessment centrally and peripherally."}, {"text": "Capillary refill alone completes the circulation assessment", "why": "The lecture also assesses skin, symptoms, blood pressure, extremities, oedema and peripheral pulses."}], "explanation": "Cluster the peripheral findings as perfusion cues while completing the central and peripheral circulation assessment.", "cite": [{"src": "L1", "loc": "p.17"}]}, {"id": "M1-05", "type": "mcq", "week": "Module 1", "topic": "New confusion", "slo": ["SLO2"], "reasoning": true, "stem": "A previously alert patient develops new confusion. Which response follows the general disability-assessment principles in Lecture 1?", "options": [{"text": "Treat the neurological change as urgent and escalate", "correct": true, "why": "The lecture describes any ACVPU step down from Alert as an escalation trigger and a new neurological drop as urgent until proven otherwise."}, {"text": "Wait for the patient to become unresponsive before escalating", "why": "New confusion is already a step down from Alert; unresponsiveness is not required."}, {"text": "Assume the change must be an isolated brain problem", "why": "The lecture also identifies oxygenation, perfusion and glucose as possible causes of neurological change."}, {"text": "Use normal pupils to dismiss the change in conscious state", "why": "Pupil assessment does not remove the separate escalation trigger of a step down from Alert."}], "explanation": "New confusion is a deterioration cue. Assessment should consider oxygenation, perfusion, glucose and brain function while escalating the change.", "cite": [{"src": "L1", "loc": "p.19"}]}, {"id": "M1-06", "type": "mcq", "week": "Module 1", "topic": "GCS motor response", "slo": ["SLO2"], "reasoning": true, "stem": "During GCS assessment, a patient follows a simple motor command, although the movement is weak. How does the Lab 1 neurological chart classify this response?", "options": [{"text": "Obeys commands: motor score 6", "correct": true, "why": "The chart explicitly includes following commands even weakly under motor score 6."}, {"text": "Localises to pain: motor score 5", "why": "Score 5 describes a hand moving towards the source of pain, above the nipple line, rather than obeying a command."}, {"text": "Withdraws: motor score 4", "why": "Score 4 describes movement away from a painful stimulus."}, {"text": "Flexion to pain: motor score 3", "why": "Score 3 describes arm flexion/decorticate posturing in response to pain."}], "explanation": "GCS motor scoring describes the best response to commands or stimuli; weak command-following still meets the chart's 'obeys commands' description.", "cite": [{"src": "LAB1PKG", "loc": "p.8"}]}, {"id": "M1-07", "type": "mcq", "week": "Module 1", "topic": "Limb strength", "slo": ["SLO2"], "reasoning": true, "stem": "A limb moves actively against gravity but cannot move against added resistance. Which MRC strength grade on the Lab 1 chart matches this finding?", "options": [{"text": "Grade 3", "correct": true, "why": "Grade 3 is active movement against gravity."}, {"text": "Grade 2", "why": "Grade 2 is active movement when the effect of gravity is removed."}, {"text": "Grade 4", "why": "Grade 4 requires movement against gravity with some resistance."}, {"text": "Grade 5", "why": "Grade 5 requires movement against gravity with full resistance."}], "explanation": "Distinguish movement against gravity from movement against resistance when assigning the limb-strength grade.", "cite": [{"src": "LAB1PKG", "loc": "p.8"}]}, {"id": "M1-08", "type": "mcq", "week": "Module 1", "topic": "Exposure and dignity", "slo": ["SLO1", "SLO2"], "reasoning": true, "stem": "Wounds and drain sites are covered by bedclothes. Which approach best follows the lecture's exposure assessment?", "options": [{"text": "Expose the areas needed for assessment, then cover each area promptly", "correct": true, "why": "The lecture says to assess hidden wounds and drains while exposing only what is needed and restoring dignity immediately after each area."}, {"text": "Leave covered areas unassessed to preserve privacy", "why": "The lecture specifically includes wounds and drains hidden by bedclothes in exposure assessment."}, {"text": "Keep the whole body exposed until all assessment and documentation are complete", "why": "The instruction is to cover immediately after each area is assessed."}, {"text": "Assess skin only where it is already visible above the bedclothes", "why": "The lecture requires looking for hidden wounds, drains and pressure-injury risk areas."}], "explanation": "A thorough exposure assessment and preservation of dignity are both required.", "cite": [{"src": "L1", "loc": "p.21"}]}, {"id": "M1-09", "type": "mcq", "week": "Module 1", "topic": "Fluid assessment", "slo": ["SLO2"], "reasoning": true, "stem": "A patient reports thirst, has dark amber urine and skin that tents and returns slowly. Which interpretation does the fluid-assessment section support?", "options": [{"text": "The findings support concern about dehydration", "correct": true, "why": "The lecture links thirst, dark amber urine and slowly returning skin turgor with dehydration."}, {"text": "Dark amber urine is the lecture's specific description of possible UTI", "why": "Cloudy urine, rather than dark amber urine, is linked with possible UTI in this section."}, {"text": "Thirst is unrelated to fluid assessment", "why": "The lecture describes thirst as a simple, reliable indicator of dehydration."}, {"text": "Only the current urine reading matters; trends are unnecessary", "why": "The fluid section says to watch the trend, not just the current reading."}], "explanation": "Interpret these cues together and review fluid input, output and trends as directed by the fluid-assessment section.", "cite": [{"src": "L1", "loc": "p.22"}]}, {"id": "M1-10", "type": "mcq", "week": "Module 1", "topic": "Glucose and cognition", "slo": ["SLO2"], "reasoning": true, "stem": "Why should glucose assessment remain part of assessing a patient with altered cognition?", "options": [{"text": "Both low and high glucose can impair cognition and mimic neurological deterioration", "correct": true, "why": "The glucose section explicitly identifies both hypo- and hyperglycaemia as causes of impaired cognition that can mimic neurological deterioration."}, {"text": "Only low glucose can affect cognition", "why": "The lecture includes both low and high glucose."}, {"text": "Only high glucose can affect cognition", "why": "The lecture includes both high and low glucose."}, {"text": "Orientation assessment replaces the need to check BGL", "why": "The section includes orientation assessment as well as checking the BGL or point-of-care result."}], "explanation": "Checking BGL helps interpret altered cognition alongside the rest of the A–H findings.", "cite": [{"src": "L1", "loc": "p.23"}]}, {"id": "M1-11", "type": "mcq", "week": "Module 1", "topic": "Concern despite normal observations", "slo": ["SLO2"], "reasoning": true, "stem": "A nurse is seriously concerned about a patient even though observations are between the flags. Which statement matches Lecture 1?", "options": [{"text": "Serious concern can justify a Clinical Review or Rapid Response call", "correct": true, "why": "The lecture states that serious concern is enough to call even when observations are between the flags."}, {"text": "A normal chart prevents an escalation call", "why": "The lecture explicitly says a normal chart does not override clinical judgement."}, {"text": "Only a red-zone numerical observation permits any review", "why": "The lecture permits calls at any time on the basis of serious concern."}, {"text": "Family concerns cannot be escalated outside the usual treating team", "why": "The REACH section requires a local pathway for patient, carer or family escalation to a clinician not routinely involved in care."}], "explanation": "Track-and-trigger observations support assessment; they do not cancel serious clinical concern.", "cite": [{"src": "L1", "loc": "p.27"}]}, {"id": "M1-12", "type": "mcq", "week": "Module 1", "topic": "Auscultation positioning", "slo": ["SLO1", "SLO2"], "skill": "auscultation", "reasoning": true, "stem": "A patient cannot tolerate sitting in a chair or on the side of the bed for chest auscultation but is comfortable lying at 45 degrees. What does the Module 1 reading support?", "options": [{"text": "Use the tolerated 45-degree position, with support if needed", "correct": true, "why": "The reading says some patients tolerate only a 45-degree angle and that this can facilitate assessment; support may be needed."}, {"text": "Insist on sitting despite the patient's discomfort", "why": "The reading requires consideration of clinical condition and comfort."}, {"text": "Abandon auscultation because only a chair is acceptable", "why": "The reading accepts sitting on the bed or lying at 45 degrees as well as sitting in a chair."}, {"text": "Require the patient to lie flat", "why": "The alternative described for patients unable to sit is a 45-degree angle, with comfort considered."}], "explanation": "Adapt positioning to the patient's condition and comfort while enabling access for auscultation.", "cite": [{"src": "AUSC", "loc": "p.2"}]}, {"id": "M1-13", "type": "mcq", "week": "Module 1", "topic": "Posterior auscultation", "slo": ["SLO2"], "skill": "auscultation", "stem": "Why does the chest-auscultation reading direct the nurse to avoid placing the stethoscope over the scapula?", "options": [{"text": "Lung sounds cannot be heard through bone", "correct": true, "why": "This is the reading's stated reason for avoiding the scapula during posterior auscultation."}, {"text": "The posterior chest should not be assessed", "why": "The reading explicitly directs posterior assessment using the stepladder approach."}, {"text": "Only the inspiratory phase should be heard posteriorly", "why": "The reading requires a full inspiration and expiration at each stepladder point."}, {"text": "The posterior assessment replaces both lateral assessments", "why": "The procedure separately includes posterior, right lateral and left lateral assessment."}], "explanation": "Use the posterior stepladder approach, avoiding bone, and listen through a full respiratory cycle at each point.", "cite": [{"src": "AUSC", "loc": "p.3"}]}, {"id": "M1-14", "type": "mcq", "week": "Module 1", "topic": "BLS recognition", "slo": ["SLO2"], "reasoning": true, "stem": "A person is unresponsive and has slow, irregular agonal gasps. According to the Canvas BLS page, what should the nurse do?", "options": [{"text": "Start CPR because agonal gasps are not normal breathing", "correct": true, "why": "The page directs CPR for unresponsiveness with abnormal breathing and explicitly includes agonal gasping."}, {"text": "Wait because gasping proves adequate breathing", "why": "The page warns that agonal gasps are not breathing and may be mistaken for a sign of life."}, {"text": "Check for a pulse before deciding whether to start BLS", "why": "The page says pulse checks are not part of BLS and are unreliable."}, {"text": "First determine whether the cause is cardiac or respiratory", "why": "The page says this distinction is not required before responding; the BLS response is identical."}], "explanation": "Unresponsiveness plus absent or abnormal breathing triggers the BLS response without delay for pulse checks or a cause diagnosis.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}, {"id": "M1-15", "type": "mcq", "week": "Module 1", "topic": "Oropharyngeal airway", "slo": ["SLO2"], "reasoning": true, "stem": "During use of an oropharyngeal airway, the person gags and pushes the device out. What does the Canvas BLS page direct?", "options": [{"text": "Remove it and manage the airway manually", "correct": true, "why": "The page explicitly directs removal and manual management if the person gags or pushes it out."}, {"text": "Force the device back into position", "why": "The page says never to force an OPA and identifies an intact gag or cough reflex as a contraindication."}, {"text": "Leave it because an OPA prevents aspiration", "why": "The page states that an OPA does not protect against aspiration."}, {"text": "Stop manual positioning because the device replaces it", "why": "The page says manual airway positioning is still required and an OPA does not replace head tilt–chin lift."}], "explanation": "The gag reflex is the decision point. The page also requires confirming placement scope with the facilitator and local policy.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}, {"id": "M1-16", "type": "mcq", "week": "Module 1", "topic": "AVPU", "slo": ["SLO2"], "reasoning": true, "stem": "A patient's eyes do not open spontaneously but open when spoken to. Which AVPU category is described on the Module 1 preparation page?", "options": [{"text": "V: Verbal", "correct": true, "why": "V describes eyes opening to a verbal stimulus rather than spontaneously."}, {"text": "A: Alert", "why": "A describes awareness and spontaneous eye opening."}, {"text": "P: Pain", "why": "P describes responding only to painful stimuli."}, {"text": "U: Unresponsive", "why": "U describes no spontaneous response and no response to verbal or painful stimuli."}], "explanation": "AVPU provides a rapid conscious-state assessment by identifying the stimulus needed to produce a response.", "cite": [{"src": "CANVAS", "loc": "page 1-dot-2-preparation-activities-patient-assessment"}]}, {"id": "M1-17", "type": "saq", "week": "Module 1", "topic": "Holistic assessment", "slo": ["SLO1", "SLO2"], "reasoning": true, "prompt": "A patient is visibly anxious during assessment. Outline how the H component of A–H can help you assess needs beyond physical observations.", "model": "Observe non-verbal cues and available support people. Listen without interrupting and ask what matters most, including goals and language or health-literacy needs. Sit at eye level and acknowledge distress. Consider social circumstances, cultural and spiritual needs, functional baseline, goals of care or an advance care plan, and communication with carers.", "rubric": [{"point": "Observe non-verbal cues and support people; listen without interrupting", "cite": [{"src": "L1", "loc": "p.25"}]}, {"point": "Explore what matters most, goals and language or health-literacy needs", "cite": [{"src": "L1", "loc": "p.25"}]}, {"point": "Acknowledge distress at eye level and consider social, cultural, spiritual, functional and carer needs", "cite": [{"src": "L1", "loc": "p.25"}]}], "cite": [{"src": "L1", "loc": "p.25"}]}, {"id": "M1-18", "type": "saq", "week": "Module 1", "topic": "Focused neurological assessment", "slo": ["SLO2"], "prompt": "According to Module 1 preparation, what belongs in a focused neurological assessment, and how should limb strength be assessed and recorded?", "model": "Assess level of consciousness, limb strength and pupillary response, with cranial nerves as applicable, alongside other assessments and at least vital signs. Complete GCS before limb-strength assessment. Assess each limb from upper to lower and proximal to distal, and score each limb separately on the chart.", "rubric": [{"point": "LOC, limb strength, pupils and cranial nerves as applicable, alongside at least vital signs", "cite": [{"src": "CANVAS", "loc": "page 1-dot-2-preparation-activities-patient-assessment"}]}, {"point": "Complete GCS first, then assess limbs upper to lower and proximal to distal", "cite": [{"src": "CANVAS", "loc": "page 1-dot-2-preparation-activities-patient-assessment"}]}, {"point": "Score each limb separately", "cite": [{"src": "CANVAS", "loc": "page 1-dot-2-preparation-activities-patient-assessment"}]}], "cite": [{"src": "CANVAS", "loc": "page 1-dot-2-preparation-activities-patient-assessment"}]}, {"id": "M1-19", "type": "saq", "week": "Module 1", "topic": "Auscultation documentation", "slo": ["SLO2"], "skill": "auscultation", "reasoning": true, "prompt": "You have completed chest auscultation and want the next nurse to compare findings at reassessment. What should you document according to the Module 1 reading, and why?", "model": "Document the areas assessed, such as anterior, posterior and lateral chest; describe sound quality or timbre; and record where any abnormal sounds were heard. Accurate recording enables clinical comparison when the patient is reassessed.", "rubric": [{"point": "Record the locations assessed", "cite": [{"src": "AUSC", "loc": "p.4"}]}, {"point": "Describe sound quality and locate abnormal sounds", "cite": [{"src": "AUSC", "loc": "p.4"}]}, {"point": "Explain that accurate recording supports comparison at reassessment", "cite": [{"src": "AUSC", "loc": "p.4"}]}], "cite": [{"src": "AUSC", "loc": "p.4"}]}, {"id": "M1-20", "type": "saq", "week": "Module 1", "topic": "Bag-valve-mask ventilation", "slo": ["SLO2"], "prompt": "According to the Canvas BLS page, what three conditions are needed for effective bag-valve-mask ventilation, how should two trained rescuers share the task, and what hazard is associated with poor technique?", "model": "Effective BVM requires a patent airway, an adequate mask seal and adequate ventilation technique. Two trained rescuers are recommended: one manages the airway, mask and seal, while the other operates the bag. Poor technique or prolonged use can force air into the stomach and increase the risk of regurgitation of gastric contents.", "rubric": [{"point": "Patent airway, adequate mask seal and adequate ventilation technique", "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}, {"point": "One trained rescuer manages airway/mask/seal; the second operates the bag", "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}, {"point": "Poor technique or prolonged use can force air into the stomach and increase regurgitation risk", "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}], "cite": [{"src": "CANVAS", "loc": "page 1-dot-3-basic-life-support"}]}, {"id": "M2-01", "type": "mcq", "week": "Module 2", "topic": "Oxygen prescription", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "reasoning": true, "stem": "A breathless adult has an SpO2 within the recommended range and no other indication for oxygen. What does the TSANZ statement say about giving oxygen solely for breathlessness?", "options": [{"text": "Do not give it solely for breathlessness without hypoxaemia", "correct": true, "why": "Oxygen treats hypoxaemia; it does not relieve breathlessness in its absence."}, {"text": "Give it whenever the patient feels breathless", "why": "Breathlessness without hypoxaemia is not an indication for oxygen."}, {"text": "Give it to prevent a future fall in SpO2", "why": "Supplemental oxygen in normoxic patients can mask subsequent deterioration."}, {"text": "Give it without a target saturation", "why": "Oxygen is a drug and its prescription includes a target SpO2 range."}], "explanation": "Assess oxygenation and the cause of breathlessness; use oxygen for hypoxaemia to a prescribed target range.", "cite": [{"src": "TSANZ", "loc": "p.3"}, {"src": "TSANZ", "loc": "p.4"}, {"src": "TSANZ", "loc": "p.8"}]}, {"id": "M2-02", "type": "mcq", "week": "Module 2", "topic": "Oxygen prescription", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "stem": "What is the minimum information TSANZ says an oxygen prescription must specify?", "options": [{"text": "Delivery device, permitted flow-rate range and target SpO2 range", "correct": true, "why": "These are the statement's minimum requirements."}, {"text": "Device alone", "why": "This omits both the flow-rate range and the target SpO2 range."}, {"text": "A single flow rate alone", "why": "This omits the device and target SpO2 range."}, {"text": "SpO2 target alone", "why": "This omits the device and permitted flow-rate range."}], "explanation": "The oxygen prescription documents the device, flow range and saturation target in the medical record and drug chart.", "cite": [{"src": "TSANZ", "loc": "p.4"}]}, {"id": "M2-03", "type": "mcq", "week": "Module 2", "topic": "Oxygen escalation", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "reasoning": true, "stem": "An adult needs increasing oxygen flow to stay within the prescribed SpO2 range. What does that change indicate?", "options": [{"text": "Possible underlying deterioration requiring clinical review", "correct": true, "why": "TSANZ says increasing oxygen requirement indicates deterioration and should prompt review."}, {"text": "Recovery because the SpO2 is still in range", "why": "The increased oxygen requirement itself may indicate deterioration despite an adequate SpO2."}, {"text": "No need to record oxygen flow", "why": "The prescription includes permitted flow rates; increasing requirements matter to clinical review."}, {"text": "An indication to exceed the target SpO2 range", "why": "Oxygen is titrated to the target range, not above it."}], "explanation": "Interpret SpO2 alongside the oxygen needed to achieve it; rising support needs review.", "cite": [{"src": "TSANZ", "loc": "p.4"}, {"src": "TSANZ", "loc": "p.7"}]}, {"id": "M2-04", "type": "mcq", "week": "Module 2", "topic": "Oximetry limits", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "reasoning": true, "stem": "A patient with signs of acute respiratory disease has no reliable pulse-oximetry signal. What further assessment does TSANZ say to consider?", "options": [{"text": "Arterial blood gas measurement", "correct": true, "why": "A reliable signal cannot be obtained in symptomatic acute respiratory disease is a listed reason to consider ABG."}, {"text": "Rely on the last SpO2 alone", "why": "TSANZ cautions against over-reliance on oximetry and calls for clinical judgement."}, {"text": "Use a venous gas as an exact measure of PaO2", "why": "A venous gas does not accurately estimate PaO2."}, {"text": "Wait for a reliable signal before assessing oxygenation", "why": "The statement lists this situation as a reason to consider ABG."}], "explanation": "When oximetry is unreliable and acute respiratory illness is suspected, consider ABG alongside clinical assessment.", "cite": [{"src": "TSANZ", "loc": "p.4"}]}, {"id": "M2-05", "type": "saq", "week": "Module 2", "topic": "Oxygen and COPD", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "reasoning": true, "prompt": "An adult with an acute COPD exacerbation has SpO2 86%. State the TSANZ target, suitable initial oxygen interfaces, and what is needed before adopting a target of 92% or higher.", "model": "Titrate oxygen to SpO2 88–92%. At SpO2 below 88%, options include a 24% or 28% Venturi mask or nasal cannulae at 1–2 L/min. If a target of at least 92% is considered, measure arterial blood gases to exclude hypercapnia first.", "rubric": [{"point": "COPD exacerbation target SpO2 88–92%", "cite": [{"src": "TSANZ", "loc": "p.4"}]}, {"point": "At SpO2 below 88%, 24% or 28% Venturi mask or nasal cannulae at 1–2 L/min, titrated to target", "cite": [{"src": "TSANZ", "loc": "p.5"}]}, {"point": "ABG to exclude hypercapnia before a target of at least 92%", "cite": [{"src": "TSANZ", "loc": "p.5"}]}], "cite": [{"src": "TSANZ", "loc": "p.4"}, {"src": "TSANZ", "loc": "p.5"}]}, {"id": "M2-06", "type": "mcq", "week": "Module 2", "topic": "COPD oxygen", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "reasoning": true, "stem": "An adult with COPD has SpO2 89% at initial assessment. According to the TSANZ practice point, is oxygen initially required on this finding alone?", "options": [{"text": "No; when SpO2 is at least 88%, oxygen is not initially required", "correct": true, "why": "The COPD practice point states this threshold explicitly."}, {"text": "Yes; every COPD patient needs oxygen", "why": "The statement makes oxygen dependent on the measured saturation and target."}, {"text": "Yes; give a non-rebreather mask at 15 L/min", "why": "At SpO2 at least 88% in COPD, oxygen is not initially required on this finding alone."}, {"text": "Yes; aim for a saturation above 96%", "why": "The recommended COPD target is 88–92%."}], "explanation": "The TSANZ COPD practice point distinguishes SpO2 at or above 88% from below 88% when deciding initial oxygen.", "cite": [{"src": "TSANZ", "loc": "p.4"}, {"src": "TSANZ", "loc": "p.5"}]}, {"id": "M2-07", "type": "mcq", "week": "Module 2", "topic": "Oxygen devices", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "reasoning": true, "stem": "A simple face mask has been set below 5 L/min. What is the source-based concern?", "options": [{"text": "Carbon dioxide rebreathing", "correct": true, "why": "TSANZ advises avoiding simple-mask flow below 5 L/min for this reason."}, {"text": "It becomes a Venturi mask", "why": "A Venturi mask is a different delivery system; low simple-mask flow creates rebreathing risk."}, {"text": "It delivers a fixed FiO2 regardless of breathing", "why": "A simple face mask is not the precise Venturi system described in the skills text."}, {"text": "The reservoir bag will overinflate", "why": "A simple face mask has no reservoir bag; the issue is rebreathing."}], "explanation": "Keep simple-mask flow at least 5 L/min to avoid carbon dioxide rebreathing.", "cite": [{"src": "TSANZ", "loc": "p.6"}, {"src": "S125", "loc": "p.24"}]}, {"id": "M2-08", "type": "mcq", "week": "Module 2", "topic": "Oxygen devices", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "reasoning": true, "stem": "A non-rebreather reservoir bag collapses completely on inspiration. What correction does the skills text give?", "options": [{"text": "Increase the oxygen litre flow", "correct": true, "why": "The source says the bag must not totally deflate and to correct it by increasing flow."}, {"text": "Lower the oxygen flow", "why": "This would not address a bag that is emptying; the text specifies increasing flow."}, {"text": "Remove the one-way valves", "why": "The valves prevent room air and exhaled air from entering the bag."}, {"text": "Keep the bag collapsed during inspiration", "why": "The source says the bag must not totally deflate because carbon dioxide can build up."}], "explanation": "Watch the reservoir during inspiration and raise flow if it empties completely.", "cite": [{"src": "S125", "loc": "p.25"}, {"src": "S125", "loc": "p.26"}]}, {"id": "M2-09", "type": "mcq", "week": "Module 2", "topic": "Oxygen devices", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "stem": "Which device does the skills text describe as delivering a precise, consistent oxygen concentration using large-bore tubing?", "options": [{"text": "Venturi mask", "correct": true, "why": "It is named as the high-flow system that controls FiO2 precisely."}, {"text": "Standard nasal cannula", "why": "This is a low-flow device with FiO2 that varies with breathing and flow."}, {"text": "Simple face mask", "why": "This is listed as a low-flow device; entrained room air affects FiO2."}, {"text": "Non-rebreather mask", "why": "The cited description of precise, consistent FiO2 names the Venturi mask."}], "explanation": "Venturi adaptors specify oxygen concentration and required flow; raising source flow beyond the adaptor specification does not increase that concentration.", "cite": [{"src": "S125", "loc": "p.18"}, {"src": "S125", "loc": "p.27"}]}, {"id": "M2-10", "type": "saq", "week": "Module 2", "topic": "Oxygen escalation", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "reasoning": true, "prompt": "An adult needs 8 L/min through a simple face mask to keep SpO2 adequate. What level of review does TSANZ recommend, and why is the oxygen requirement concerning?", "model": "Seek ICU review. TSANZ uses at least 8 L/min through a simple face mask as an example of estimated FiO2 at least 0.50; most such patients need higher monitoring and supportive care. High FiO2 to keep SpO2 adequate signals severe illness and leaves limited capacity to increase FiO2 if the patient deteriorates.", "rubric": [{"point": "At least 8 L/min by simple mask is the TSANZ example of estimated FiO2 at least 0.50", "cite": [{"src": "TSANZ", "loc": "p.7"}]}, {"point": "ICU review; most need higher monitoring and supportive care", "cite": [{"src": "TSANZ", "loc": "p.7"}]}, {"point": "High FiO2 indicates severe illness and limited reserve for further deterioration", "cite": [{"src": "TSANZ", "loc": "p.7"}]}], "cite": [{"src": "TSANZ", "loc": "p.7"}]}, {"id": "M2-11", "type": "mcq", "week": "Module 2", "topic": "Oxygen weaning", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "reasoning": true, "stem": "A patient's SpO2 rises above the prescribed target range during oxygen therapy. What does TSANZ recommend?", "options": [{"text": "Reduce or stop oxygen and continue saturation monitoring", "correct": true, "why": "The statement says oxygen can be reduced or stopped above target while monitoring continues."}, {"text": "Continue the same flow to protect against later hypoxaemia", "why": "Excess oxygen can mask deterioration; reduce or stop it above target."}, {"text": "Stop all observations", "why": "Saturation monitoring should continue to detect subsequent deterioration."}, {"text": "Increase oxygen until SpO2 is as high as possible", "why": "The oxygen target is a range; values above it are not the goal."}], "explanation": "Titrate within the prescribed range and keep monitoring after reduction or cessation.", "cite": [{"src": "TSANZ", "loc": "p.7"}]}, {"id": "M2-12", "type": "mcq", "week": "Module 2", "topic": "Oxygen devices", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "reasoning": true, "stem": "An adult needs oxygen but wishes to keep eating and speaking comfortably. Which standard device does the skills text say interferes least with those activities?", "options": [{"text": "Nasal cannula", "correct": true, "why": "The source says nasal cannulae do not interfere with eating or talking."}, {"text": "Simple face mask", "why": "This covers the nose and mouth, whereas the nasal cannula permits eating and talking."}, {"text": "Non-rebreather mask", "why": "This is a mask with a reservoir; the source identifies nasal cannulae for eating and talking."}, {"text": "Venturi mask", "why": "The Venturi is a mask; the source identifies nasal cannulae as comfortable for eating and talking."}], "explanation": "Standard nasal cannulae are usually preferred where appropriate; titrate their flow to target saturation.", "cite": [{"src": "S125", "loc": "p.19"}, {"src": "TSANZ", "loc": "p.6"}]}, {"id": "M2-13", "type": "mcq", "week": "Module 2", "topic": "Nebuliser assessment", "slo": ["SLO2", "SLO3"], "skill": "nebuliser", "reasoning": true, "stem": "A patient is too breathless for a full respiratory history before urgent nebulised medicine. Which focused comparison does the skills text recommend?", "options": [{"text": "Auscultate breath sounds before and after treatment", "correct": true, "why": "Pre/post auscultation helps evaluate the medicine when a full examination is impractical."}, {"text": "Only check breath sounds after treatment", "why": "Without a pre-treatment assessment there is no breath-sound comparison."}, {"text": "Delay urgent treatment until a complete history is obtained", "why": "The source allows at least chest auscultation when medication must start immediately."}, {"text": "Use only the medicine chart to judge response", "why": "The chart verifies the order; breath sounds before and after help evaluate clinical response."}], "explanation": "At minimum auscultate before urgent treatment, then reassess breathing and lung fields afterwards.", "cite": [{"src": "S126", "loc": "p.12"}, {"src": "S126", "loc": "p.17"}]}, {"id": "M2-14", "type": "mcq", "week": "Module 2", "topic": "Nebuliser safety", "slo": ["SLO2", "SLO3"], "skill": "nebuliser", "stem": "Before giving prescribed nebulised medicine, which check does the skills text require?", "options": [{"text": "Confirm a valid medication order and apply the six rights", "correct": true, "why": "The preparation table explicitly requires an order and the six rights."}, {"text": "Give it first and check the chart afterwards", "why": "The source requires the order and six rights before administration."}, {"text": "Check the device but omit patient identity", "why": "Right patient is one of the six rights and identity is checked before administration."}, {"text": "Skip the allergy check if the medicine is inhaled", "why": "The procedure explicitly calls for checking allergies before any medication."}], "explanation": "Verify the medication order, patient identity, allergies and the six rights before delivery.", "cite": [{"src": "S126", "loc": "p.12"}, {"src": "S126", "loc": "p.14"}]}, {"id": "M2-15", "type": "saq", "week": "Module 2", "topic": "Nebuliser reassessment", "slo": ["SLO2", "SLO3", "SLO4"], "skill": "nebuliser", "reasoning": true, "prompt": "After a nebulised medicine dose, what respiratory reassessment, documentation and communication does the skills text require?", "model": "Reassess breathing and respiratory rate and auscultate the lung fields to judge response. Record the medicine administration and document treatment and breath sounds before and after. Continue assessments for improvement or deterioration, and communicate changes in condition to the treating doctor for review.", "rubric": [{"point": "Reassess breathing, respiratory rate and lung-field sounds", "cite": [{"src": "S126", "loc": "p.17"}]}, {"point": "Sign administration and record treatment plus pre/post breath sounds", "cite": [{"src": "S126", "loc": "p.16"}, {"src": "S126", "loc": "p.18"}]}, {"point": "Continue assessment and communicate changes to the treating doctor", "cite": [{"src": "S126", "loc": "p.18"}, {"src": "S126", "loc": "p.19"}]}], "cite": [{"src": "S126", "loc": "p.16"}, {"src": "S126", "loc": "p.17"}, {"src": "S126", "loc": "p.18"}, {"src": "S126", "loc": "p.19"}]}, {"id": "M2-16", "type": "mcq", "week": "Module 2", "topic": "Nebuliser selection", "slo": ["SLO2", "SLO3"], "skill": "nebuliser", "reasoning": true, "stem": "A patient cannot operate an inhaler because of difficulty using their hands. Which reason for considering a nebuliser appears in the skills text?", "options": [{"text": "Difficulty using an inhaler is a listed circumstance for nebuliser use", "correct": true, "why": "The text specifically lists problems with the hands or confusion."}, {"text": "Nebulisers are required for everyone with asthma", "why": "The text says puffers with spacers work effectively and nebulisers are not recommended for most."}, {"text": "A nebuliser avoids the need for a medication order", "why": "The procedure still requires a valid order and the six rights."}, {"text": "A nebuliser means no respiratory reassessment is needed", "why": "The source requires reassessment of breathing and breath sounds afterwards."}], "explanation": "Nebuliser use may be appropriate when an inhaler cannot be used effectively; continue usual medicine and response checks.", "cite": [{"src": "S126", "loc": "p.11"}, {"src": "S126", "loc": "p.12"}, {"src": "S126", "loc": "p.17"}]}, {"id": "M2-17", "type": "mcq", "week": "Module 2", "topic": "Nebuliser hygiene", "slo": ["SLO2", "SLO3"], "skill": "nebuliser", "stem": "Why does the skills text require nebuliser equipment to be cleaned after each use?", "options": [{"text": "To reduce infection or cross-contamination risk", "correct": true, "why": "The clinical safety alert and post-procedure table identify infection and contamination risk."}, {"text": "To increase the prescribed medicine dose", "why": "Cleaning protects against infection and incorrect delivery; it does not change the prescription."}, {"text": "To remove the need for hand hygiene", "why": "Hand hygiene remains a separate post-procedure action."}, {"text": "To replace respiratory reassessment", "why": "The source requires reassessment as well as cleaning."}], "explanation": "Clean and maintain the nebuliser after each use, alongside hand hygiene and patient reassessment.", "cite": [{"src": "S126", "loc": "p.8"}, {"src": "S126", "loc": "p.9"}, {"src": "S126", "loc": "p.17"}, {"src": "S126", "loc": "p.18"}]}, {"id": "M2-18", "type": "mcq", "week": "Module 2", "topic": "Suction indication", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "A patient has rattling breath sounds and cannot expectorate secretions. Which basis for upper-airway suctioning matches the skills text?", "options": [{"text": "Clinical need based on distress and inability to clear secretions", "correct": true, "why": "The text lists these findings and says suctioning follows clinical need."}, {"text": "A fixed hourly schedule regardless of findings", "why": "The source explicitly prefers clinical need over a fixed schedule."}, {"text": "The presence of any cough, even when secretions are cleared", "why": "The indication includes difficulty handling or expectorating secretions."}, {"text": "Routine suctioning to prevent all later secretions", "why": "Excessive suctioning irritates mucosa and may increase secretions."}], "explanation": "Assess distress and ability to clear secretions; suction only when clinically indicated.", "cite": [{"src": "S127", "loc": "p.11"}, {"src": "S127", "loc": "p.12"}]}, {"id": "M2-19", "type": "mcq", "week": "Module 2", "topic": "Suction route", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "A patient needing upper-airway suction has facial trauma. Which route choice is supported by the suctioning text?", "options": [{"text": "Avoid nasopharyngeal suctioning; consider the less traumatic oropharyngeal route", "correct": true, "why": "Facial trauma contraindicates nasopharyngeal suctioning and the oropharyngeal route is preferred as less traumatic."}, {"text": "Use nasopharyngeal suctioning because facial trauma makes it safer", "why": "Facial trauma is a stated contraindication."}, {"text": "Use either route without checking contraindications", "why": "The text lists specific contraindications to the nasal route."}, {"text": "Perform tracheal suctioning as the standard first route", "why": "The source distinguishes upper-airway suctioning from tracheal suctioning for lower-airway secretions."}], "explanation": "Check route contraindications; nasal suctioning is contraindicated after facial trauma.", "cite": [{"src": "S127", "loc": "p.8"}, {"src": "S127", "loc": "p.9"}]}, {"id": "M2-20", "type": "saq", "week": "Module 2", "topic": "Suction safety", "slo": ["SLO2", "SLO3"], "reasoning": true, "prompt": "For upper-airway suctioning, explain when to suction, the maximum duration per attempt, and two harms of excessive or prolonged suctioning.", "model": "Suction when clinical assessment shows respiratory distress or inability to cough up and expectorate secretions, rather than on a fixed schedule. Limit each attempt to 10–15 seconds. Prolonged suctioning can cause hypoxia; excessive suctioning can damage the pharyngeal mucosa, with bleeding, swelling or inflammation, and can further lower SpO2.", "rubric": [{"point": "Use clinical need, including distress or inability to clear secretions, rather than a fixed schedule", "cite": [{"src": "S127", "loc": "p.11"}, {"src": "S127", "loc": "p.12"}]}, {"point": "Limit each attempt to 10–15 seconds", "cite": [{"src": "S127", "loc": "p.11"}]}, {"point": "Prolonged suctioning can cause hypoxia", "cite": [{"src": "S127", "loc": "p.11"}]}, {"point": "Excess suctioning may injure pharyngeal mucosa or lower SpO2", "cite": [{"src": "S127", "loc": "p.11"}, {"src": "S127", "loc": "p.12"}]}], "cite": [{"src": "S127", "loc": "p.11"}, {"src": "S127", "loc": "p.12"}]}, {"id": "M2-21", "type": "mcq", "week": "Module 2", "topic": "Sputum collection", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "Secretions are needed for diagnostic testing while a patient already requires suctioning. Which item does the skills text describe attaching to the suction circuit?", "options": [{"text": "A sputum collection container or trap", "correct": true, "why": "The trap collects secretions during suctioning for diagnostic purposes."}, {"text": "A Venturi adaptor", "why": "A Venturi adaptor delivers oxygen; the sputum trap collects secretions."}, {"text": "A nebuliser chamber", "why": "A nebuliser chamber holds liquid medicine; the source names a sputum trap for samples."}, {"text": "A spacer", "why": "A spacer helps deliver puffer medication, not collect sputum during suctioning."}], "explanation": "The sputum trap connects between suction catheter and suction tubing to collect the sample.", "cite": [{"src": "S127", "loc": "p.13"}, {"src": "S127", "loc": "p.14"}, {"src": "S126", "loc": "p.7"}]}, {"id": "M2-22", "type": "mcq", "week": "Module 2", "topic": "Suction technique", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "During oral or oropharyngeal suction, when should suction be applied to the catheter according to the procedure?", "options": [{"text": "After insertion, intermittently around secretions", "correct": true, "why": "The procedure says not to apply suction during insertion and to apply it intermittently once positioned."}, {"text": "Continuously throughout insertion", "why": "Suction during insertion can traumatise the mucous membrane."}, {"text": "Only while withdrawing, without targeting secretions", "why": "The procedure describes intermittent suction on either side of the glottis and where secretions collect."}, {"text": "Before inserting, while the catheter is outside the mouth", "why": "The source directs leaving suction off during insertion and applying it where secretions are present."}], "explanation": "Insert without suction to limit mucosal trauma, then use intermittent suction at the indicated sites.", "cite": [{"src": "S127", "loc": "p.23"}, {"src": "S127", "loc": "p.24"}]}, {"id": "M2-23", "type": "mcq", "week": "Module 2", "topic": "Suction positioning", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "How does the suctioning procedure position an unconscious person for upper-airway suction?", "options": [{"text": "Left lateral, facing the nurse", "correct": true, "why": "This allows the tongue to fall forward and secretions to drain, reducing aspiration risk."}, {"text": "Flat supine with the face upward", "why": "The procedure specifies left lateral positioning to aid drainage."}, {"text": "Upright without any support", "why": "The source's unconscious-person instruction is left lateral."}, {"text": "Prone with the face down", "why": "The procedure specifies left lateral, facing the nurse."}], "explanation": "Left lateral positioning supports airway access and drainage in an unconscious person.", "cite": [{"src": "S127", "loc": "p.22"}]}, {"id": "M2-24", "type": "mcq", "week": "Module 2", "topic": "Oxygen monitoring", "slo": ["SLO2", "SLO3"], "skill": "oxygen", "reasoning": true, "stem": "A patient with possible hypercapnia has a venous blood gas. Can its oxygen and carbon dioxide values reliably replace an arterial blood gas for assessing PaO2 and PaCO2?", "options": [{"text": "No; venous values do not accurately estimate PaO2 or PaCO2", "correct": true, "why": "TSANZ says a VBG cannot accurately estimate either arterial value."}, {"text": "Yes; venous and arterial oxygen values are interchangeable", "why": "The statement says venous gas does not accurately estimate PaO2."}, {"text": "Yes; venous PCO2 definitively excludes hypercapnia", "why": "Even venous PCO2 below 40 mm Hg makes hypercapnia unlikely but does not rule it out."}, {"text": "No blood gas is useful if SpO2 is available", "why": "TSANZ recommends considering ABG in patients at risk of hypercapnia."}], "explanation": "Use ABG when exclusion of hypercapnia is clinically relevant.", "cite": [{"src": "TSANZ", "loc": "p.4"}]}, {"id": "M2-25", "type": "saq", "week": "Module 2", "topic": "Inhaled bronchodilator", "slo": ["SLO2", "SLO3"], "skill": "nebuliser", "reasoning": true, "prompt": "An adult with COPD needs an inhaled bronchodilator and also needs supplemental oxygen. State TSANZ's preferred medicine delivery method, the alternative if necessary, and what happens to nasal oxygen during treatment.", "model": "Use a metered dose inhaler with spacer where possible. If a nebuliser is needed, TSANZ specifies an air-driven nebuliser. Continue supplemental nasal oxygen as required during either method.", "rubric": [{"point": "Prefer metered dose inhaler with spacer", "cite": [{"src": "TSANZ", "loc": "p.6"}]}, {"point": "Air-driven nebuliser if necessary", "cite": [{"src": "TSANZ", "loc": "p.6"}]}, {"point": "Continue supplemental nasal oxygen as required during bronchodilator delivery", "cite": [{"src": "TSANZ", "loc": "p.6"}]}], "cite": [{"src": "TSANZ", "loc": "p.6"}]}, {"id": "M3-01", "type": "mcq", "week": "Module 3", "topic": "Irregular pulse", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "A new irregular radial pulse is found. Which assessment avoids undercounting the rate?", "options": [{"text": "Count apically for a full minute", "correct": true, "why": "A radial count can undercount an irregular pulse."}, {"text": "Count only at the wrist", "why": "The radial count can undercount."}, {"text": "Use only the monitor rate", "why": "The lecture calls for manual assessment."}, {"text": "Wait until the next round", "why": "A new irregular pulse must be reported."}], "explanation": "A radial count can undercount an irregular pulse.", "cite": [{"src": "L3", "loc": "p.10"}]}, {"id": "M3-02", "type": "mcq", "week": "Module 3", "topic": "Low urine output", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "Urine output falls in a cardiac patient. Which check helps interpret this finding?", "options": [{"text": "Check catheter patency and fluid-balance accuracy", "correct": true, "why": "Both checks are specified."}, {"text": "Assume dehydration", "why": "Congestion is another possible cause."}, {"text": "Give fluid without assessment", "why": "The cause may be fluid overload."}, {"text": "Ignore it until pain appears", "why": "Persistent low output needs urgent review."}], "explanation": "Both checks are specified.", "cite": [{"src": "L3", "loc": "p.10"}]}, {"id": "M3-03", "type": "mcq", "week": "Module 3", "topic": "Oedema pattern", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "New unilateral leg swelling with warmth suggests what next assessment?", "options": [{"text": "Assess for DVT", "correct": true, "why": "Unilateral warmth or calf pain needs a DVT assessment."}, {"text": "Assume cardiac oedema", "why": "Bilateral dependent oedema better fits cardiac oedema."}, {"text": "Check weight only", "why": "Pattern and other findings also matter."}, {"text": "Wait for breathlessness", "why": "New oedema is always reported."}], "explanation": "Unilateral warmth or calf pain needs a DVT assessment.", "cite": [{"src": "L3", "loc": "p.11"}]}, {"id": "M3-04", "type": "mcq", "week": "Module 3", "topic": "Postural drop", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "A cardiac patient develops a postural BP drop. What should be checked?", "options": [{"text": "Repeat manual lying and standing BP and assess pulse, consciousness, fluid balance and bleeding", "correct": true, "why": "These are specified checks."}, {"text": "Check only weight", "why": "Weight omits the stated checks."}, {"text": "Assume diuretic effect", "why": "Bleeding and arrhythmia are also possible."}, {"text": "Wait for syncope", "why": "A new drop must be reported."}], "explanation": "These are specified checks.", "cite": [{"src": "L3", "loc": "p.11"}]}, {"id": "M3-05", "type": "mcq", "week": "Module 3", "topic": "Oxygen trend", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "SpO₂ stays stable but oxygen requirement rises. What does the trend mean?", "options": [{"text": "Deterioration", "correct": true, "why": "The lecture explicitly identifies stable saturations on more oxygen as deterioration."}, {"text": "No change", "why": "Oxygen need has risen."}, {"text": "Stop trending observations", "why": "Trends can show slow deterioration."}, {"text": "Only weight matters", "why": "The observation chart includes oxygen need."}], "explanation": "The lecture explicitly identifies stable saturations on more oxygen as deterioration.", "cite": [{"src": "L3", "loc": "p.15"}]}, {"id": "M3-06", "type": "mcq", "week": "Module 3", "topic": "Chest pain", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "Chest pain persists after a normal first ECG. What next?", "options": [{"text": "Urgent review and repeat ECG", "correct": true, "why": "One normal ECG does not exclude ACS."}, {"text": "Rule out ACS", "why": "The first ECG cannot exclude it."}, {"text": "Wait for troponin", "why": "The lecture says not to wait."}, {"text": "Skip vital signs", "why": "Full vital signs are part of the response."}], "explanation": "One normal ECG does not exclude ACS.", "cite": [{"src": "L3", "loc": "p.12"}]}, {"id": "M3-07", "type": "mcq", "week": "Module 3", "topic": "Access-site bleeding", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "Bleeding starts at a groin access site after PCI. What is the immediate response?", "options": [{"text": "Apply direct pressure above the puncture and have someone call for help", "correct": true, "why": "This is the stated response."}, {"text": "Wait for swelling to settle", "why": "Urgent review is required every time."}, {"text": "Check only the next routine pulse", "why": "Distal pulses and vital signs are needed now."}, {"text": "Give analgesia first", "why": "Bleeding requires immediate action."}], "explanation": "This is the stated response.", "cite": [{"src": "L3", "loc": "p.12"}]}, {"id": "M3-08", "type": "mcq", "week": "Module 3", "topic": "Radial PCI complication", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "Forearm pain, swelling and tightness increase after radial PCI. What next?", "options": [{"text": "Escalate immediately", "correct": true, "why": "These are signs of compartment syndrome."}, {"text": "Medicate and wait", "why": "The source explicitly rejects waiting."}, {"text": "Treat it as expected discomfort", "why": "These are warning signs."}, {"text": "Check only the groin", "why": "The radial limb needs assessment."}], "explanation": "These are signs of compartment syndrome.", "cite": [{"src": "L3", "loc": "p.30"}]}, {"id": "M3-09", "type": "mcq", "week": "Module 3", "topic": "Limb electrodes", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "A standard wrist site is unavailable for a diagnostic ECG. What placement is advised?", "options": [{"text": "Use the most distal available limb point, mirror it contralaterally and document it", "correct": true, "why": "The page specifies this modification."}, {"text": "Move leads to the torso without documentation", "why": "Torso placement alters morphology."}, {"text": "Place electrodes asymmetrically", "why": "Symmetry is recommended."}, {"text": "Omit the limb lead", "why": "Modified limb placement is described."}], "explanation": "The page specifies this modification.", "cite": [{"src": "CANVAS", "loc": "page 3-dot-2-introduction-to-performing-an-ecg"}]}, {"id": "M3-10", "type": "mcq", "week": "Module 3", "topic": "V3 placement", "slo": ["SLO2", "SLO3"], "stem": "Where is V3 placed?", "options": [{"text": "Midway between V2 and V4", "correct": true, "why": "This is V3."}, {"text": "Right sternal margin, fourth intercostal space", "why": "This is V1."}, {"text": "Left sternal margin, fourth intercostal space", "why": "This is V2."}, {"text": "Mid-axillary line level with V4", "why": "This is V6."}], "explanation": "This is V3.", "cite": [{"src": "LAB3SL", "loc": "p.12"}]}, {"id": "M3-11", "type": "mcq", "week": "Module 3", "topic": "Lead reversal", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "Lead II is predominantly downward and aVR upright. What quality issue should be checked?", "options": [{"text": "Left/right arm lead reversal", "correct": true, "why": "The source describes reversal of these waveform directions."}, {"text": "Accept the pattern as expected", "why": "Normally II is upright and aVR downward."}, {"text": "Diagnose a rhythm from this alone", "why": "Misplacement can cause diagnostic error."}, {"text": "Repeat without checking electrodes", "why": "Electrode position needs checking."}], "explanation": "The source describes reversal of these waveform directions.", "cite": [{"src": "ECGBAR", "loc": "p.2"}]}, {"id": "M3-12", "type": "mcq", "week": "Module 3", "topic": "Shivering artefact", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "An ECG baseline is bumpy and spiky while the patient shivers. Likely cause?", "options": [{"text": "Skeletal muscle activity", "correct": true, "why": "Shivering can produce this artefact."}, {"text": "Missing lead", "why": "That produces a dotted baseline."}, {"text": "Arm lead reversal", "why": "That reverses waveform direction."}, {"text": "A normal flat baseline", "why": "A good baseline is sharp and flat."}], "explanation": "Shivering can produce this artefact.", "cite": [{"src": "ECGBAR", "loc": "p.3"}]}, {"id": "M3-13", "type": "mcq", "week": "Module 3", "topic": "Missing lead", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "One ECG lead shows a dotted baseline. What should be checked?", "options": [{"text": "Skin-to-monitor conduction", "correct": true, "why": "A missing lead indicates failed conduction."}, {"text": "Breathing movement alone", "why": "This can cause a wandering baseline."}, {"text": "Normal waveform", "why": "The lead is missing."}, {"text": "Only talking", "why": "Talking causes muscle artefact."}], "explanation": "A missing lead indicates failed conduction.", "cite": [{"src": "ECGBAR", "loc": "p.4"}]}, {"id": "M3-14", "type": "mcq", "week": "Module 3", "topic": "Monitoring purpose", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "Monitoring shows a rhythm change. What records a specific diagnostic tracing?", "options": [{"text": "A separate 12-lead ECG", "correct": true, "why": "Monitoring watches rhythm but does not diagnose."}, {"text": "Monitor rate alone", "why": "It is surveillance, not diagnostic ECG."}, {"text": "Telemetry alone", "why": "It changes transmission method."}, {"text": "Disconnect monitoring", "why": "Disconnection loses surveillance."}], "explanation": "Monitoring watches rhythm but does not diagnose.", "cite": [{"src": "CANVAS", "loc": "page 3-dot-3-cardiac-monitoring-and-telemetry"}]}, {"id": "M3-15", "type": "mcq", "week": "Module 3", "topic": "Hardwire mobility", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "A high-risk patient on hardwire cardiac monitoring needs to get to the toilet. What does the Canvas monitoring page tell you to plan?", "options": [{"text": "How toileting and transfers will be managed: supervision, a commode at the bedside, or a switch to telemetry if they are mobile enough", "correct": true, "why": "The page says to think ahead about toileting and transfers for a high-risk patient, because every disconnection is a period when the rhythm is not being watched."}, {"text": "Nothing: hardwire monitoring lets the patient walk around the ward", "why": "Hardwire monitoring limits movement to cable reach; the patient must be disconnected to leave the bedspace. Walking around the ward is what telemetry allows."}, {"text": "Record a 12-lead ECG instead of monitoring while they are up", "why": "The page says a 12-lead ECG is recorded when a diagnosis is needed; it is not a substitute for watching the rhythm during mobility."}, {"text": "Turn off the monitor alarms until they return", "why": "The page describes alarms as how staff are alerted to rhythm changes; it does not suggest turning them off."}], "explanation": "Hardwire: cable to a bedside monitor, so movement is limited. Telemetry: a wireless transmitter the patient carries, so they can walk around the ward. Each disconnection from hardwire is unwatched time.", "cite": [{"src": "CANVAS", "loc": "page 3-dot-3-cardiac-monitoring-and-telemetry"}]}, {"id": "M3-16", "type": "mcq", "week": "Module 3", "topic": "Burette medication port", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "Where is medication added to the described burette?", "options": [{"text": "Top-plate needleless access site", "correct": true, "why": "The instruction specifies this site."}, {"text": "Air vent", "why": "Medication must not go through the vent."}, {"text": "Needle through access site", "why": "Needles and blunt cannulae are prohibited there."}, {"text": "Floating valve", "why": "This prevents air entering the line."}], "explanation": "The instruction specifies this site.", "cite": [{"src": "BURETTE1", "loc": "p.1"}]}, {"id": "M3-17", "type": "saq", "week": "Module 3", "topic": "Irregular pulse", "slo": ["SLO2", "SLO3"], "reasoning": true, "prompt": "A new fast, irregular pulse is found with breathlessness. Outline the assessment and escalation.", "model": "Check pulse and BP. Assess radial rate, rhythm and volume manually; if irregular, count apically for a full minute. Check BP, conscious state, 12-lead ECG and cardiac monitoring. Tell the nurse in charge, document, and seek immediate urgent review because of breathlessness.", "rubric": [{"point": "Manual pulse and full-minute apical count if irregular", "cite": [{"src": "L3", "loc": "p.10"}]}, {"point": "BP, conscious state, ECG and monitoring", "cite": [{"src": "L3", "loc": "p.10"}]}, {"point": "Report and document", "cite": [{"src": "L3", "loc": "p.10"}]}, {"point": "Urgent review with breathlessness", "cite": [{"src": "L3", "loc": "p.10"}]}], "cite": [{"src": "L3", "loc": "p.10"}]}, {"id": "M3-18", "type": "saq", "week": "Module 3", "topic": "ECG conduction", "slo": ["SLO2", "SLO3"], "reasoning": true, "prompt": "A tracing has a dotted baseline in one lead. Explain likely causes and checks before interpretation.", "model": "A dotted missing-lead baseline indicates failed conduction from skin to monitor. Check skin preparation, electrode gel and contact, cable tension, peeling electrodes, and damaged wires.", "rubric": [{"point": "Recognises failed conduction", "cite": [{"src": "ECGBAR", "loc": "p.4"}]}, {"point": "Checks skin preparation and electrode contact", "cite": [{"src": "ECGBAR", "loc": "p.4"}]}, {"point": "Checks dry electrodes, cable tension and damaged wires", "cite": [{"src": "ECGBAR", "loc": "p.4"}]}], "cite": [{"src": "ECGBAR", "loc": "p.4"}]}, {"id": "M3-19", "type": "saq", "week": "Module 3", "topic": "Burette priming", "slo": ["SLO2", "SLO3"], "reasoning": true, "prompt": "Explain how to prime the administration line and why to keep the burette vertical.", "model": "Use burette fluid to prime the administration line until all air is removed, then close the lower clamp. Keep the chamber vertical so the floating safety shut-off valve can function and prevent air entering the line when it empties.", "rubric": [{"point": "Primes with burette fluid and removes all air", "cite": [{"src": "BURETTE1", "loc": "p.1"}]}, {"point": "Closes lower clamp after priming", "cite": [{"src": "BURETTE1", "loc": "p.1"}]}, {"point": "Keeps chamber vertical for floating valve function", "cite": [{"src": "BURETTE1", "loc": "p.1"}]}], "cite": [{"src": "BURETTE1", "loc": "p.1"}]}, {"id": "M3-20", "type": "saq", "week": "Module 3", "topic": "Post-PCI checks", "slo": ["SLO2", "SLO3"], "reasoning": true, "prompt": "After PCI, what access-site and distal limb checks are needed, and what findings need immediate escalation?", "model": "Check the access site and band for bleeding. Compare distal colour, warmth, movement, sensation and pulses with baseline. Escalate increasing forearm pain, swelling or tightness immediately. Back or flank pain with hypotension suggests retroperitoneal bleeding; new chest pain needs ECG and escalation.", "rubric": [{"point": "Checks site for bleeding", "cite": [{"src": "L3", "loc": "p.30"}]}, {"point": "Compares distal neurovascular findings with baseline", "cite": [{"src": "L3", "loc": "p.30"}]}, {"point": "Escalates radial forearm pain, swelling or tightness", "cite": [{"src": "L3", "loc": "p.30"}]}, {"point": "Recognises back or flank pain with hypotension and new chest pain", "cite": [{"src": "L3", "loc": "p.30"}]}], "cite": [{"src": "L3", "loc": "p.30"}]}, {"id": "M4-01", "type": "mcq", "week": "Module 4", "topic": "ASSIST first screen", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "An adult with persisting acute stroke symptoms cannot hold their head erect. What does ASSIST direct?", "options": [{"text": "Stop, place the patient NBM and review when all section 1 parameters are yes", "correct": true, "why": "Any no in section 1 triggers this action."}, {"text": "Proceed to the water sip", "why": "The water test follows only after section 1 is passed."}, {"text": "Start the premorbid oral diet", "why": "This is step 5 after preceding checks."}, {"text": "Assess only voice quality", "why": "Head control is a section 1 gate."}], "explanation": "Any no in section 1 triggers this action.", "cite": [{"src": "ASSIST", "loc": "p.1"}]}, {"id": "M4-02", "type": "mcq", "week": "Module 4", "topic": "ASSIST risk signs", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "A stroke patient has facial droop before the water test. What does ASSIST direct?", "options": [{"text": "Stop, place NBM and refer to speech pathology", "correct": true, "why": "Facial weakness or droop is a section 2 trigger."}, {"text": "Give a 10 mL water sip", "why": "Section 2 must be passed first."}, {"text": "Offer a full cup of water", "why": "The cup test is later."}, {"text": "Start the first meal", "why": "Diet resumes only after screening steps pass."}], "explanation": "Facial weakness or droop is a section 2 trigger.", "cite": [{"src": "ASSIST", "loc": "p.1"}]}, {"id": "M4-03", "type": "mcq", "week": "Module 4", "topic": "ASSIST water sip", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "During the 10 mL water sip, the patient's voice quality changes. What next?", "options": [{"text": "Stop, place NBM and refer to speech pathology", "correct": true, "why": "Voice change is a section 3 stop criterion."}, {"text": "Continue to the cup of water", "why": "The cup follows only if no section 3 signs occur."}, {"text": "Start oral medications", "why": "The tool directs NBM at this point."}, {"text": "Observe only at the first meal", "why": "The patient has not passed screening."}], "explanation": "Voice change is a section 3 stop criterion.", "cite": [{"src": "ASSIST", "loc": "p.1"}]}, {"id": "M4-04", "type": "mcq", "week": "Module 4", "topic": "ASSIST first meal", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "After passing ASSIST, what is required at the first meal?", "options": [{"text": "Nursing staff observe the patient", "correct": true, "why": "Step 5 explicitly requires first-meal observation."}, {"text": "No further observation", "why": "The tool specifically requires it."}, {"text": "Repeat a 10 mL sip only", "why": "That is an earlier screening step."}, {"text": "Refer everyone to speech pathology", "why": "Referral is specified for failed sections."}], "explanation": "Step 5 explicitly requires first-meal observation.", "cite": [{"src": "ASSIST", "loc": "p.1"}]}, {"id": "M4-05", "type": "mcq", "week": "Module 4", "topic": "Silent aspiration clue", "slo": ["SLO2", "SLO3"], "reasoning": true, "stem": "After oral intake resumes, temperature spikes and chest condition deteriorates. What does ASSIST advise?", "options": [{"text": "Place NBM and refer to speech pathology", "correct": true, "why": "These changes may indicate silent aspiration."}, {"text": "Continue the premorbid diet", "why": "The tool directs NBM."}, {"text": "Repeat only the initial alertness check", "why": "The follow-up warning calls for NBM and referral."}, {"text": "Ignore it without coughing", "why": "The tool flags silent aspiration without requiring cough."}], "explanation": "These changes may indicate silent aspiration.", "cite": [{"src": "ASSIST", "loc": "p.1"}]}, {"id": "M4-06", "type": "mc
